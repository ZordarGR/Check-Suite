name: Verify Debug switch sizing
on:
  push:
    branches: [fix/debug-pill-switch]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node test/release.js
          node test/scopecheck.js
      - run: |
          npm install --no-save playwright-core@1.56.1 playwright@1.56.1
          npx playwright install --with-deps chromium
          actual=$(find "$HOME/.cache/ms-playwright" -path '*/chrome-linux/chrome' -type f | head -1)
          sudo mkdir -p /opt/pw-browsers/chromium-1194/chrome-linux
          sudo ln -s "$actual" /opt/pw-browsers/chromium-1194/chrome-linux/chrome
      - run: |
          node test/harness.js
          node test/browser/pill-audit.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-switch-screenshots
          path: pill-audit-debug-*.png
      - name: Verify normal and forced HTML delivery
        env:
          RELEASE_VERSION: 1.17.103
          MANIFEST_URL: https://raw.githubusercontent.com/ZordarGR/Check-Suite/${{ github.sha }}/update/latest.json
        run: |
          node test/html-update-delivery.js
          node test/required-html-delivery.js
