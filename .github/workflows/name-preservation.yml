name: Verify 1.17.82 HTML delivery
on:
  push:
    branches: ["codex/preserve-full-names-20260918"]
permissions:
  contents: read
jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/dist-win64/parts/RecCheck-Setup.exe.*
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node <<'NODE'
          const fs=require('fs'),os=require('os'),path=require('path'),assert=require('assert/strict');
          const {Updater}=require('./app/updater');
          const manifest=require('./update/latest.json'),nativeFetch=global.fetch;
          global.fetch=(url,opts)=>String(url).startsWith('https://candidate.invalid/')?Promise.resolve(new Response(JSON.stringify(manifest))):nativeFetch(url,{...opts,signal:AbortSignal.timeout(60000)});
          (async()=>{
            const dir=fs.mkdtempSync(path.join(os.tmpdir(),'check-delivery-'));
            try{
              const u=new Updater({userDataDir:dir,packagedDir:path.resolve('app'),pkgVersion:'1.17.81',updateUrl:'https://candidate.invalid/manifest',fallbackReleaseUrl:''});
              const pending=await u.check();
              assert.equal(pending.version,'1.17.82');assert(!pending.full);assert.equal(u.promote(),true);
              const effective=u.effective();assert.equal(effective.version,'1.17.82');
              assert.equal(fs.readFileSync(effective.file,'utf8'),fs.readFileSync('app/index.html','utf8'));
              console.log('DELIVERY VERIFIED: released 1.17.81 updater downloaded, verified and promoted the pinned 1.17.82 page.');
            }finally{fs.rmSync(dir,{recursive:true,force:true});}
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
