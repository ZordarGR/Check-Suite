name: Validate and package eligibility-first invoices
on:
  push:
    branches: [codex/quiet-excluded-invoices]
    paths-ignore: ["dist-win64/parts/**"]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cloud build and browser dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mono-devel mono-utils
          npm install --no-save playwright-core@1.56.1
          PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers npx playwright-core install --with-deps chromium
      - name: Build helper with BCL guard
        run: sh app/build-helper.sh
      - name: Reproduce released eligibility ordering
        run: |
          git fetch --no-tags --depth=1 origin b92790936fa5e2996a321a82473f5afb0b5dd1b9
          cp app/arrangement.js /tmp/fixed-arrangement.js
          trap 'cp /tmp/fixed-arrangement.js app/arrangement.js' EXIT
          git show b92790936fa5e2996a321a82473f5afb0b5dd1b9:app/arrangement.js > app/arrangement.js
          if node test/arrangement.js > /tmp/released-gate.log 2>&1; then
            cat /tmp/released-gate.log
            echo "Released eligibility ordering unexpectedly passed" >&2
            exit 1
          fi
          cat /tmp/released-gate.log
          grep -F "excluded incomplete metadata must remain outside" /tmp/released-gate.log
          cp /tmp/fixed-arrangement.js app/arrangement.js
          git diff --exit-code -- app/arrangement.js
      - name: Complete regression and renderer tests
        run: |
          sh test/run.sh
          node test/browser/arrangement.js
  windows:
    strategy:
      fail-fast: false
      matrix:
        target: [anycpu, x86]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build native fixture in the cloud
        shell: pwsh
        run: |
          $compiler = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $compiler /nologo /target:winexe "/out:$PWD\app\rc-tbind.exe" "$PWD\app\tbind.cs"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $compiler /nologo /target:exe /platform:${{ matrix.target }} /r:System.Windows.Forms.dll "/out:$PWD\PROT32.exe" "$PWD\test\invoice-window.cs"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Reproduce the existing permanent timeout block
        shell: pwsh
        run: |
          git fetch --no-tags --depth=1 origin 91e793d62b53f6a559c71fe9d9f2b3b7e0de3439
          git show 91e793d62b53f6a559c71fe9d9f2b3b7e0de3439:app/tbind.cs | Set-Content -Encoding utf8 old-tbind.cs
          $compiler = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $compiler /nologo /target:winexe "/out:$PWD\old-tbind.exe" "$PWD\old-tbind.cs"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & .\PROT32.exe "$PWD\old-tbind.exe" "$PWD\old-invoice-stream.jsonl"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node test/invoice-stream.js old-invoice-stream.jsonl 2>&1 | Tee-Object old-failure.txt
          if ($LASTEXITCODE -eq 0) { throw "Old reader unexpectedly recovered" }
          if (-not (Select-String -Path old-failure.txt -SimpleMatch "a timed-out B getter must recover")) { throw "Unexpected baseline failure" }
          $global:LASTEXITCODE = 0
      - name: Verify scope gate and recovery against actual Windows controls
        shell: pwsh
        run: |
          & .\PROT32.exe "$PWD\app\rc-tbind.exe" "$PWD\invoice-stream.jsonl"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node test/invoice-stream.js invoice-stream.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-invoice-stream-${{ matrix.target }}
          path: invoice-stream.jsonl*
  package:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refuse a moved source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Cloud build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nsis p7zip-full mono-devel mono-utils
          npm install --no-save @electron/asar@3.2.10
      - name: Package and unpack-verify 1.17.76
        run: |
          bash test/package-arrangement.sh
          stat -c 'SETUP_SIZE=%s' Pro-Check-Setup.exe
      - name: Save verified package outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/index.html "Departments Check.html" app/package.json app/rc-tbind.exe dist-win64/nsi/reccheck.nsi dist-win64/parts update/latest.json
          git commit -m "Package verified Pro-Check 1.17.76"
          git push origin HEAD:codex/quiet-excluded-invoices
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pro-Check-1.17.76
          path: Pro-Check-Setup.exe
          if-no-files-found: ignore
