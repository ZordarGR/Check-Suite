name: Departure report focused checks
on:
  push:
    branches: [codex/departure-date-report]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare HTML manifest
        run: |
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const m=JSON.parse(fs.readFileSync('update/latest.json','utf8'));
          m.version='1.17.77';m.type='html';
          m.sha256=crypto.createHash('sha256').update(fs.readFileSync('app/index.html')).digest('hex');
          m.notes='Print an on-demand report by departure date with rooms, stay dates and recorded extras across the stay. Preserve captured in-house rows when smaller lists open on the same day.';
          fs.writeFileSync('update/latest.json',JSON.stringify(m,null,2)+'\n');
          NODE
      - name: Focused data checks
        run: |
          node test/departure-report.js
          node test/status.js
          node test/release.js
          node test/harness.js
      - name: Install cloud browser
        run: |
          npm install --no-save --no-package-lock playwright-core@1.56.1
          PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers npx playwright-core install --with-deps chromium
      - name: Browser and printing checks
        run: |
          node test/browser/departure-report.js
          node test/browser/reports.js
      - name: Save verified manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update/latest.json
          git diff --cached --quiet || git commit -m "Set verified 1.17.77 HTML digest"
          git push origin HEAD:codex/departure-date-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: departure-report-print
          path: departure-report-smoke.pdf
