name: Departure report arrival conflicts
on:
  push:
    branches: [codex/departure-report-arrivals]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare HTML manifest
        run: |
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const m=JSON.parse(fs.readFileSync('update/latest.json','utf8'));
          m.version='1.17.79';m.type='html';
          m.html='https://raw.githubusercontent.com/ZordarGR/Check-Suite/'+process.env.GITHUB_SHA+'/Departments%20Check.html';
          m.sha256=crypto.createHash('sha256').update(fs.readFileSync('app/index.html')).digest('hex');
          m.notes='Resolve duplicate arrival-date versions from saved captures. Show unresolved date conflicts once without changing stored reservation dates.';
          fs.writeFileSync('update/latest.json',JSON.stringify(m,null,2)+'\n');
          NODE
      - name: Focused data checks
        run: |
          node test/departure-report.js
          node test/status.js
          node test/release.js
          node test/harness.js
      - name: Install cloud browser
        run: |
          npm install --no-save --no-package-lock playwright-core@1.56.1
          PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers npx playwright-core install --with-deps chromium
      - name: Browser and printing checks
        run: |
          node test/browser/departure-report.js
          node test/browser/reports.js
      - name: Verify public HTML update delivery
        run: |
          node - <<'NODE'
          const fs=require('fs'),os=require('os'),path=require('path'),assert=require('assert'),crypto=require('crypto');
          const {Updater}=require('./app/updater');
          const m=JSON.parse(fs.readFileSync('update/latest.json','utf8')),realFetch=global.fetch;
          global.fetch=(url,opts)=>String(url).startsWith('https://manifest.test/')?Promise.resolve(new Response(JSON.stringify(m),{status:200})):realFetch(url,opts);
          (async()=>{
            const u=new Updater({userDataDir:fs.mkdtempSync(path.join(os.tmpdir(),'names-update-')),packagedDir:path.resolve('app'),pkgVersion:'1.17.76',updateUrl:'https://manifest.test/latest'});
            assert.deepEqual(await u.check(),{version:'1.17.79'});assert(u.promote());assert.equal(u.effective().version,'1.17.79');
            assert.equal(crypto.createHash('sha256').update(fs.readFileSync(u.effective().file)).digest('hex'),m.sha256);
            console.log('PASS Public immutable download, SHA validation, promotion to 1.17.79');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Save verified manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update/latest.json
          git diff --cached --quiet || git commit -m "Set verified 1.17.79 HTML digest"
          git push origin HEAD:codex/departure-report-arrivals
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: departure-report-print
          path: departure-report-*.pdf
