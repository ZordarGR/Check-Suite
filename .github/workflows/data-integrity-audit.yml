name: Data integrity audit
on:
  push:
    branches: ["codex/data-integrity-audit-20260918"]
permissions:
  contents: read
jobs:
  node-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/dist-win64/parts/RecCheck-Setup.exe.*
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare cloud test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mono-devel
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo mkdir -p /opt/pw-browsers/chromium-1194/chrome-linux
          CHROME="$(node -p "require('playwright').chromium.executablePath()")"
          sudo ln -sf "$CHROME" /opt/pw-browsers/chromium-1194/chrome-linux/chrome
          mkdir -p audit-results
      - name: Existing node and native harnesses
        id: standard
        continue-on-error: true
        run: |
          set -o pipefail
          sh app/build-helper.sh
          sh test/run.sh 2>&1 | tee audit-results/standard.log
      - name: Offline departure regression
        id: departure
        if: always()
        continue-on-error: true
        run: node test/departure-report.js 2>&1 | tee audit-results/departure.log
      - name: Adversarial integrity harnesses
        id: audit
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          fail=0
          for t in test/audit-*.js; do
            [ -f "$t" ] || continue
            node "$t" 2>&1 | tee "audit-results/$(basename "$t" .js).log" || fail=1
          done
          exit "$fail"
      - name: Browser and real PDF harnesses
        id: browser
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          node test/harness.js
          fail=0
          for t in sweep taxsweep legacy ledger live alerts movesfit reports exact orient dbgshot optshot departure-report arrangement audit-reports guest-turnover; do
            timeout 420 node "test/browser/$t.js" > "audit-results/browser-$t.log" 2>&1 || fail=1
            cat "audit-results/browser-$t.log"
          done
          exit "$fail"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-node-browser-evidence
          path: |
            audit-results/
            test/browser/*.png
            test/browser/*.pdf
            /tmp/*.pdf
            ./*.pdf
      - name: Require successful checks
        if: always()
        env:
          STANDARD: ${{ steps.standard.outcome }}
          DEPARTURE: ${{ steps.departure.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
        run: test "$STANDARD/$DEPARTURE/$AUDIT/$BROWSER" = success/success/success/success
  core-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/dist-win64/parts/RecCheck-Setup.exe.*
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run core integrity and compatibility checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mono-devel
          mkdir -p audit-results
          sh app/build-helper.sh
          fail=0
          sh test/run.sh > audit-results/standard.log 2>&1 || fail=1
          cat audit-results/standard.log
          node test/departure-report.js || fail=1
          for t in test/audit-*.js; do
            node "$t" > "audit-results/$(basename "$t" .js).log" 2>&1 || fail=1
            cat "audit-results/$(basename "$t" .js).log"
          done
          exit "$fail"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-core-evidence
          path: |
            audit-results/
            app/rc-tbind.exe
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/dist-win64/parts/RecCheck-Setup.exe.*
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exercise synthetic Windows controls in both target bitnesses
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force audit-results | Out-Null
          $compiler = 'C:/Windows/Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          $helperSource = (Resolve-Path 'app/tbind.cs').Path
          $helperExe = Join-Path (Get-Location) 'audit-results/rc-tbind.exe'
          & $compiler /nologo /target:winexe "/out:$helperExe" $helperSource
          if ($LASTEXITCODE -ne 0) { throw 'helper compilation failed' }
          $failed = $false
          foreach ($target in @('x86', 'anycpu')) {
            $fixture = (Resolve-Path 'test/invoice-window.cs').Path
            $fixtureExe = Join-Path (Get-Location) "audit-results/invoice-$target.exe"
            & $compiler /nologo /target:exe "/platform:$target" /r:System.Windows.Forms.dll /r:System.Drawing.dll "/out:$fixtureExe" $fixture
            if ($LASTEXITCODE -ne 0) { throw 'fixture compilation failed' }
            & ./audit-results/invoice-$target.exe $helperExe "audit-results/invoice-$target.jsonl"
            if ($LASTEXITCODE -ne 0) { $failed = $true }
            node test/invoice-stream.js "audit-results/invoice-$target.jsonl" *> "audit-results/native-$target.log"
            if ($LASTEXITCODE -ne 0) { $failed = $true }
            Get-Content "audit-results/native-$target.log"
          }
          if ($failed) { throw 'native harness failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-native-evidence
          path: audit-results/
