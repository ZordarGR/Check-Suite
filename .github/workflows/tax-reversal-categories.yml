name: Tax reversal category checks
on:
  push:
    branches: ["codex/tax-reversal-categories-20260925"]
    paths-ignore: ["dist-win64/**", "app/package.json", "app/rc-tbind.exe", "update/latest.json", ".reccheck-notes.md", ".github/workflows/release.yml"]
permissions:
  contents: read
jobs:
  node-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [live]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/dist-win64/parts/RecCheck-Setup.exe.*
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare cloud browser dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo mkdir -p /opt/pw-browsers/chromium-1194/chrome-linux
          CHROME="$(node -p "require('playwright').chromium.executablePath()")"
          sudo ln -sf "$CHROME" /opt/pw-browsers/chromium-1194/chrome-linux/chrome
          mkdir -p audit-results
      - name: Browser and real PDF harnesses
        env:
          GROUP: ${{ matrix.group }}
        run: |
          node test/harness.js
          case "$GROUP" in
            general) tests="sweep taxsweep legacy ledger alerts movesfit dbgshot optshot" ;;
            live) tests="tax-posting-dates light-theme" ;;
            reports) tests="reports exact orient departure-report audit-reports" ;;
          esac
          fail=0
          for t in $tests; do
            timeout 420 node "test/browser/$t.js" > "audit-results/browser-$t.log" 2>&1 || fail=1
            cat "audit-results/browser-$t.log"
          done
          exit "$fail"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-browser-${{ matrix.group }}-evidence
          path: |
            audit-results/
            test/browser/*.png
            test/browser/*.pdf
            /tmp/*.pdf
            ./*.pdf
  core-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/dist-win64/parts/RecCheck-Setup.exe.*
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run core integrity and compatibility checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mono-devel
          mkdir -p audit-results
          sh app/build-helper.sh
          fail=0
          sh test/run.sh > audit-results/standard.log 2>&1 || fail=1
          cat audit-results/standard.log
          node test/departure-report.js || fail=1
          for t in test/audit-*.js; do
            node "$t" > "audit-results/$(basename "$t" .js).log" 2>&1 || fail=1
            cat "audit-results/$(basename "$t" .js).log"
          done
          exit "$fail"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-core-evidence
          path: |
            audit-results/
            app/rc-tbind.exe
  html-delivery:
    needs: [core-audit, node-browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/dist-win64/parts/RecCheck-Setup.exe.*
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify immutable page with the released updater
        env:
          RELEASE_VERSION: 1.17.98
          MANIFEST_URL: https://raw.githubusercontent.com/ZordarGR/Check-Suite/${{ github.sha }}/update/latest.json
        run: |
          node test/html-update-delivery.js
          node test/required-html-delivery.js
