name: Completed accordion color verification
on:
  push:
    branches: ["codex/completed-accordion-colors-20260919"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/dist-win64/parts/RecCheck-Setup.exe.*
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node test/release.js
          node test/scopecheck.js
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node <<'NODE'
          const fs=require('fs'),assert=require('assert/strict'),os=require('os'),path=require('path');
          const {chromium}=require('playwright');
          (async()=>{
            const source=fs.readFileSync('app/index.html','utf8'),style=source.match(/<style>([\s\S]*?)<\/style>/)[1];
            const header='<div class="head"><div class="bar"></div><div class="name">CAFETERIA<span class="tick">✓</span></div><div class="cnt"><b>11</b> rec.</div><div class="prog"><b>11</b> / 11</div><div class="tot">151,00</div><div class="chev">▶</div></div><div class="body">Receipt body</div>';
            const browser=await chromium.launch({args:['--no-sandbox']});
            try{
              const page=await browser.newPage({viewport:{width:1100,height:500}});
              await page.setContent('<style>'+style+'</style><div class="acc done" id="complete">'+header+'</div><div class="acc part" id="partial">'+header+'</div>');
              const read=()=>page.locator('#complete>.head').evaluate(h=>({bg:getComputedStyle(h).backgroundColor,colors:[h,...h.querySelectorAll('.name,.tick,.cnt,.cnt b,.prog,.prog b,.tot,.chev')].map(e=>getComputedStyle(e).color)}));
              for(const open of [false,true]){
                await page.locator('#complete').evaluate((e,open)=>e.classList.toggle('open',open),open);
                await page.locator('#complete>.head').hover();
                const c=await read();assert.equal(c.bg,'rgb(74, 222, 128)');assert(c.colors.every(x=>x==='rgb(0, 0, 0)'));
              }
              assert.equal(await page.locator('#partial>.head').evaluate(e=>getComputedStyle(e).backgroundColor),'rgba(0, 0, 0, 0)');
              await page.screenshot({path:'completed-accordions.png'});
              console.log('Completed header green/black verified, including hover/open; partial header unchanged.');
            }finally{await browser.close();}
            const {Updater}=require('./app/updater'),manifest=require('./update/latest.json'),nativeFetch=global.fetch;
            global.fetch=(url,opts)=>String(url).startsWith('https://candidate.invalid/')?Promise.resolve(new Response(JSON.stringify(manifest))):nativeFetch(url,{...opts,signal:AbortSignal.timeout(60000)});
            const dir=fs.mkdtempSync(path.join(os.tmpdir(),'accordion-delivery-'));
            try{
              const u=new Updater({userDataDir:dir,packagedDir:path.resolve('app'),pkgVersion:'1.17.81',updateUrl:'https://candidate.invalid/manifest',fallbackReleaseUrl:''});
              const p=await u.check();assert.equal(p.version,'1.17.85');assert(!p.full);assert.equal(u.promote(),true);
              assert.equal(fs.readFileSync(u.effective().file,'utf8'),source);
              console.log('1.17.85 download, checksum and promotion verified.');
            }finally{fs.rmSync(dir,{recursive:true,force:true});}
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: completed-accordion-preview
          path: completed-accordions.png
