name: Validate move receipt name fix
on:
  push:
    branches: [codex/validate-move-receipt-names]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: UTC
      PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
            test
            update
            .github
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies on the cloud runner
        run: |
          npm install --no-save playwright-core@1.56.1
          npx playwright-core install --with-deps chromium
      - name: Run node regression checks
        run: sh test/run.sh
      - name: Build fresh browser harness
        run: node test/harness.js
      - name: Run browser checks for names and moves
        run: |
          node test/browser/live.js
          node test/browser/movesfit.js
