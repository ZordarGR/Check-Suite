name: Light theme and forced rollout checks
on:
  push:
    branches: ["codex/light-theme-20260925"]
    paths-ignore: ["dist-win64/**", "app/package.json", "app/rc-tbind.exe", "update/latest.json", ".reccheck-notes.md", ".github/workflows/release.yml"]
permissions:
  contents: read
jobs:
  node-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [live]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare cloud browser dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo mkdir -p /opt/pw-browsers/chromium-1194/chrome-linux
          CHROME="$(node -p "require('playwright').chromium.executablePath()")"
          sudo ln -sf "$CHROME" /opt/pw-browsers/chromium-1194/chrome-linux/chrome
          mkdir -p audit-results
      - name: Browser and real PDF harnesses
        env:
          GROUP: ${{ matrix.group }}
        run: |
          node test/harness.js
          case "$GROUP" in
            general) tests="sweep taxsweep legacy ledger alerts movesfit dbgshot optshot" ;;
            live) tests="light-theme" ;;
            reports) tests="reports exact orient departure-report audit-reports" ;;
          esac
          fail=0
          for t in $tests; do
            timeout 420 node "test/browser/$t.js" > "audit-results/browser-$t.log" 2>&1 || fail=1
            cat "audit-results/browser-$t.log"
          done
          exit "$fail"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-browser-${{ matrix.group }}-evidence
          path: |
            audit-results/
            test/browser/*.png
            test/browser/*.pdf
            /tmp/*.pdf
            ./*.pdf
