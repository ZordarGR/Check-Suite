name: Arrangement posted and unposted nights
on:
  push:
    branches: ["codex/arrangement-projection-20260922"]
    paths-ignore: ["dist-win64/**", "app/package.json", "app/rc-tbind.exe", "update/latest.json", ".reccheck-notes.md", ".github/workflows/release.yml"]
permissions:
  contents: read
jobs:
  node-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [live]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/dist-win64/parts/RecCheck-Setup.exe.*
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare cloud browser dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo mkdir -p /opt/pw-browsers/chromium-1194/chrome-linux
          CHROME="$(node -p "require('playwright').chromium.executablePath()")"
          sudo ln -sf "$CHROME" /opt/pw-browsers/chromium-1194/chrome-linux/chrome
          mkdir -p audit-results
      - name: Browser and real PDF harnesses
        env:
          GROUP: ${{ matrix.group }}
        run: |
          node test/harness.js
          case "$GROUP" in
            general) tests="sweep taxsweep legacy ledger alerts movesfit dbgshot optshot" ;;
            live) tests="arrangement" ;;
            reports) tests="reports exact audit-reports" ;;
          esac
          fail=0
          for t in $tests; do
            timeout 420 node "test/browser/$t.js" > "audit-results/browser-$t.log" 2>&1 || fail=1
            cat "audit-results/browser-$t.log"
          done
          exit "$fail"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-browser-${{ matrix.group }}-evidence
          path: |
            audit-results/
            test/browser/*.png
            test/browser/*.pdf
            /tmp/*.pdf
            ./*.pdf
  core-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/dist-win64/parts/RecCheck-Setup.exe.*
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run core integrity and compatibility checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mono-devel
          mkdir -p audit-results
          sh app/build-helper.sh
          fail=0
          sh test/run.sh > audit-results/standard.log 2>&1 || fail=1
          cat audit-results/standard.log
          node test/departure-report.js || fail=1
          for t in test/audit-*.js; do
            node "$t" > "audit-results/$(basename "$t" .js).log" 2>&1 || fail=1
            cat "audit-results/$(basename "$t" .js).log"
          done
          exit "$fail"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-core-evidence
          path: |
            audit-results/
            app/rc-tbind.exe
  package-verified:
    needs: [core-audit, node-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      RELEASE_VERSION: 1.17.88
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and verify the complete installer in the cloud
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mono-devel nsis p7zip-full
          npm install --no-save asar@3.2.0
          bash test/package-integrity.sh
          node -e 'const fs=require("fs"),p="update/latest.json",m=JSON.parse(fs.readFileSync(p));m.notes="Calculate already posted Arrangement charges plus the list rate for each unposted night. Keep isolated first-night differences visible.";fs.writeFileSync(p,JSON.stringify(m,null,2)+"\n")'
      - uses: actions/upload-artifact@v4
        with:
          name: verified-integrity-installer
          path: |
            Pro-Check-Setup.exe
            update/latest.json
            app/rc-tbind.exe
      - name: Save verified package on the audit branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/package.json app/index.html 'Departments Check.html' app/rc-tbind.exe dist-win64/nsi/reccheck.nsi dist-win64/parts update/latest.json
          git commit -m "Build verified integrity release $RELEASE_VERSION"
          git push origin HEAD:codex/arrangement-projection-20260922
