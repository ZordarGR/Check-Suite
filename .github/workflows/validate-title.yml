name: Validate and package title placement
on:
  push:
    branches: [codex/arrangement-title-position]
    paths:
      - "app/arrangement-view.js"
      - "test/browser/arrangement.js"
      - "test/package-arrangement.sh"
      - ".github/workflows/validate-title.yml"
permissions:
  contents: write
jobs:
  validate-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cloud build and browser dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nsis p7zip-full mono-devel mono-utils
          npm install --no-save @electron/asar@3.2.10 playwright-core@1.56.1
          PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers npx playwright-core install --with-deps chromium
      - name: Reproduce released placement fault and verify fixed renderer
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          cp app/arrangement-view.js /tmp/fixed-arrangement-view.js
          trap 'cp /tmp/fixed-arrangement-view.js app/arrangement-view.js' EXIT
          git show c6f4caa88177f7200e31d1289c9cb05fb247973e:app/arrangement-view.js > app/arrangement-view.js
          if node test/browser/arrangement.js > /tmp/released-placement.log 2>&1; then
            cat /tmp/released-placement.log
            echo "Released renderer unexpectedly passed the regression" >&2
            exit 1
          fi
          cat /tmp/released-placement.log
          grep -F "status icon must remain inside the B name tile row" /tmp/released-placement.log
          cp /tmp/fixed-arrangement-view.js app/arrangement-view.js
          git diff --exit-code -- app/arrangement-view.js
          node test/browser/arrangement.js
      - name: Complete standard regression suite
        run: sh test/run.sh
      - name: Package and verify installer contents
        run: bash test/package-arrangement.sh
      - name: Save verified package outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/index.html "Departments Check.html" app/package.json dist-win64/nsi/reccheck.nsi dist-win64/parts update/latest.json
          git diff --cached --stat
          git commit -m "Package verified Pro-Check 1.17.72"
          git push origin HEAD:codex/arrangement-title-position
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pro-Check-1.17.72
          path: Pro-Check-Setup.exe
          if-no-files-found: ignore
