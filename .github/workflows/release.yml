name: Publish RecCheck release
on:
  workflow_dispatch:
  push:
    paths:
      - "dist-win64/parts/**"
      - ".github/workflows/release.yml"
permissions:
  contents: write
env:
  VERSION: v1.17.39
  SETUP_SHA256: 1a74830502bafe9dc578236c036ec158fabccada66ffbbfbc3934a521a1cef1a
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # "Departments Check.html" is what the light (html) update path serves, and
      # app/index.html is what the installer packs. They are the same page, so a
      # drift means one release channel silently ships an older UI than the other
      # -- which is exactly what happened between 1.16.1 and 1.16.2.
      - name: Refuse to release with the two copies of the page out of step
        run: |
          cmp -s "app/index.html" "Departments Check.html" || {
            echo "app/index.html and 'Departments Check.html' differ." >&2
            diff <(head -c 200000 "app/index.html") <(head -c 200000 "Departments Check.html") | head -40 >&2
            echo "Copy app/index.html over 'Departments Check.html' and commit." >&2
            exit 1
          }
      - name: Assemble installer from parts
        run: |
          cat dist-win64/parts/RecCheck-Setup.exe.* > RecCheck-Setup.exe
          echo "$SETUP_SHA256  RecCheck-Setup.exe" | sha256sum -c -
      # The release page was published from a static file that said "1.17.14" on every
      # release after it, because nothing ever rewrote it. The app already shows the
      # right notes from update/latest.json; the release page now says the same thing,
      # and refuses to publish if the manifest and this file name different versions.
      - name: Refuse to release with the manifest and the workflow naming different versions
        run: |
          mv="v$(jq -r .version update/latest.json)"
          [ "$mv" = "$VERSION" ] || { echo "update/latest.json says $mv, this workflow says $VERSION" >&2; exit 1; }
      - name: Write the release notes from the manifest
        run: |
          { printf '## RecCheck %s — Windows\n\n' "${VERSION#v}"
            jq -r .notes update/latest.json
            printf '\n'
            cat .github/release-notes.md; } > release-notes.md
      - name: Publish release with installer asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$VERSION" --yes || true
          git push --delete origin "refs/tags/$VERSION" || true
          gh release create "$VERSION" RecCheck-Setup.exe \
            --title "RecCheck ${VERSION#v} — Windows" \
            --notes-file release-notes.md \
            --latest
