name: Publish RecCheck release
on:
  workflow_dispatch:
  push:
    paths:
      - "dist-win64/parts/**"
      - ".github/workflows/release.yml"
permissions:
  contents: write
env:
  VERSION: v1.6.1
  SETUP_SHA256: 034abbc831ca3fbf5c3f43e23242c916e2498410442e5a2d8a8f0202246a7d93
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble installer from parts
        run: |
          cat dist-win64/parts/RecCheck-Setup.exe.* > RecCheck-Setup.exe
          echo "$SETUP_SHA256  RecCheck-Setup.exe" | sha256sum -c -
      - name: Publish release with installer asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$VERSION" --yes || true
          git push --delete origin "refs/tags/$VERSION" || true
          gh release create "$VERSION" RecCheck-Setup.exe \
            --title "RecCheck 1.6.1 — Windows" \
            --notes-file .github/release-notes.md \
            --latest
