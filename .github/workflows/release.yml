name: Publish Pro-Check release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "dist-win64/parts/**"
      - ".github/workflows/release.yml"
permissions:
  contents: write
env:
  VERSION: v1.17.88
  SETUP_SHA256: 5a94bafc5ed56397cb58ac9098b845caa17ed17643abaa028c3af757f8923db3
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # "Departments Check.html" is what the light (html) update path serves, and
      # app/index.html is what the installer packs. They are the same page, so a
      # drift means one release channel silently ships an older UI than the other
      # -- which is exactly what happened between 1.16.1 and 1.16.2.
      - name: Refuse to release with the two copies of the page out of step
        run: |
          cmp -s "app/index.html" "Departments Check.html" || {
            echo "app/index.html and 'Departments Check.html' differ." >&2
            diff <(head -c 200000 "app/index.html") <(head -c 200000 "Departments Check.html") | head -40 >&2
            echo "Copy app/index.html over 'Departments Check.html' and commit." >&2
            exit 1
          }
      - name: Assemble installer from parts
        run: |
          # the parts keep the internal name; the asset carries the one people see
          cat dist-win64/parts/RecCheck-Setup.exe.* > Pro-Check-Setup.exe
          echo "$SETUP_SHA256  Pro-Check-Setup.exe" | sha256sum -c -
      # The release page was published from a static file that said "1.17.14" on every
      # release after it, because nothing ever rewrote it. The app already shows the
      # right notes from update/latest.json; the release page now says the same thing,
      # and refuses to publish if the manifest and this file name different versions.
      - name: Refuse to release with the manifest and the workflow naming different versions
        run: |
          mv="v$(jq -r 'if .type == "full" then .version else .engine end' update/latest.json)"
          [ "$mv" = "$VERSION" ] || { echo "update/latest.json says $mv, this workflow says $VERSION" >&2; exit 1; }
      # An html-only release moves the manifest's version past the installer's: the page
      # updates itself on first run, so the installer page says so and carries its notes.
      - name: Write the release notes from the manifest
        run: |
          t=$(jq -r .type update/latest.json); v=$(jq -r .version update/latest.json)
          { printf '## Pro-Check %s — Windows\n\n' "${VERSION#v}"
            printf '*For protel setups that have been stuck in the '"'"'80s.*\n\n'
            [ "$t" = html ] && printf 'The page updates itself to %s on first run.\n\n' "$v"
            jq -r .notes update/latest.json
            printf '\n'
            cat .github/release-notes.md; } > release-notes.md
      - name: Publish release with installer asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            digest="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION" --jq '.assets[] | select(.name == "Pro-Check-Setup.exe") | .digest')"
            [ "$digest" = "sha256:$SETUP_SHA256" ] || { echo "Existing installer does not match the verified package." >&2; exit 1; }
            echo "Verified existing installer; preserving the published release."
            exit 0
          fi
          gh release create "$VERSION" Pro-Check-Setup.exe \
            --target "$GITHUB_SHA" \
            --title "Pro-Check ${VERSION#v} — Windows" \
            --notes-file release-notes.md \
            --latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify public delivery through the released updater
        run: |
          if [ "$(jq -r .type update/latest.json)" = full ]; then
            RELEASE_VERSION="${VERSION#v}" node test/update-delivery.js
          fi
