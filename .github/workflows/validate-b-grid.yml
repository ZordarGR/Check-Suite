name: Validate and package B grid tint
on:
  push:
    branches: [codex/b-grid-tint]
    paths-ignore: ["dist-win64/parts/**"]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cloud build and browser dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mono-devel mono-utils
          npm install --no-save @electron/asar@3.2.10 playwright-core@1.56.1
          PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers npx playwright-core install --with-deps chromium
      - name: Build helper with BCL guard
        run: sh app/build-helper.sh
      - name: Reproduce full Invoice tint and verify grid-only renderer
        run: |
          cp app/arrangement-view.js /tmp/fixed-arrangement-view.js
          cp app/arrangement.html /tmp/fixed-arrangement.html
          trap 'cp /tmp/fixed-arrangement-view.js app/arrangement-view.js; cp /tmp/fixed-arrangement.html app/arrangement.html' EXIT
          git show 07ffe5c09183c5f1565a8cc5c02f215b3214c3a7:app/arrangement-view.js > app/arrangement-view.js
          git show 07ffe5c09183c5f1565a8cc5c02f215b3214c3a7:app/arrangement.html > app/arrangement.html
          if node test/browser/arrangement.js > /tmp/released-tint.log 2>&1; then
            cat /tmp/released-tint.log
            echo "Released full-Invoice tint unexpectedly passed" >&2
            exit 1
          fi
          cat /tmp/released-tint.log
          grep -F "unpaid tint must cover only B entries grid" /tmp/released-tint.log
          cp /tmp/fixed-arrangement-view.js app/arrangement-view.js
          cp /tmp/fixed-arrangement.html app/arrangement.html
          git diff --exit-code -- app/arrangement-view.js app/arrangement.html
          node test/browser/arrangement.js
      - name: Complete standard regression suite
        run: sh test/run.sh
  windows:
    strategy:
      fail-fast: false
      matrix:
        target: [anycpu, x86]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build native test fixture in the cloud
        shell: pwsh
        run: |
          $compiler = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $compiler /nologo /target:winexe "/out:$PWD\app\rc-tbind.exe" "$PWD\app\tbind.cs"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $compiler /nologo /target:exe /platform:${{ matrix.target }} /r:System.Windows.Forms.dll "/out:$PWD\PROT32.exe" "$PWD\test\invoice-window.cs"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify exact B grid bounds against real Windows controls
        shell: pwsh
        run: |
          & .\PROT32.exe "$PWD\app\rc-tbind.exe" "$PWD\invoice-stream.jsonl"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node test/invoice-stream.js invoice-stream.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-grid-stream-${{ matrix.target }}
          path: invoice-stream.jsonl*
  package:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refuse a moved source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Cloud build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nsis p7zip-full mono-devel mono-utils
          npm install --no-save @electron/asar@3.2.10
      - name: Package and unpack-verify 1.17.74
        run: bash test/package-arrangement.sh
      - name: Save verified package outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/index.html "Departments Check.html" app/package.json app/rc-tbind.exe dist-win64/nsi/reccheck.nsi dist-win64/parts update/latest.json
          git commit -m "Package verified Pro-Check 1.17.74"
          git push origin HEAD:codex/b-grid-tint
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pro-Check-1.17.74
          path: Pro-Check-Setup.exe
          if-no-files-found: ignore
