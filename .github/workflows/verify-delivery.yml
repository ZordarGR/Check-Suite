name: Verify release delivery correction
on:
  push:
    branches: ["codex/release-delivery-version-20260919"]
permissions:
  contents: read
jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/dist-win64/parts/RecCheck-Setup.exe.*
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify actual published installer and HTML through the released updater
        env:
          RELEASE_VERSION: 1.17.87
        run: node test/update-delivery.js
