name: Validate live Arrangement checker
on:
  push:
    branches: ["codex/live-arrangement"]
    paths-ignore: ["dist-win64/parts/**"]
permissions:
  contents: read
jobs:
  package:
    if: contains(github.event.head_commit.message, '[package]')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/live-arrangement
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refuse a moved source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code ab87eee4f4d74dff60edaf74920cf3d998ad748d HEAD -- app
        env:
          SOURCE_SHA: ${{ github.sha }}
      - name: Cloud build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nsis p7zip-full mono-devel mono-utils
          npm install --no-save @electron/asar@3.2.10
      - name: Build and verify 1.17.70 installer
        run: |
          bash test/package-arrangement.sh
          sh test/run.sh
      - name: Save verified release files on the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/index.html "Departments Check.html" app/package.json app/rc-tbind.exe dist-win64/nsi/reccheck.nsi dist-win64/parts update/latest.json
          git commit -m "Package verified Pro-Check 1.17.70"
          git push origin HEAD:codex/live-arrangement
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-pro-check-1.17.70
          path: Pro-Check-Setup.exe
