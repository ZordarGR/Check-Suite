name: Verify HTML update delivery
on:
  push:
    branches: [codex/fix-11777-delivery]
permissions:
  contents: read
jobs:
  delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test existing updater against public files
        run: |
          node - <<'NODE'
          const fs=require('fs'),os=require('os'),path=require('path'),crypto=require('crypto'),assert=require('assert');
          const {Updater}=require('./app/updater');
          const latest=JSON.parse(fs.readFileSync('update/latest.json','utf8'));
          const realFetch=global.fetch;
          const digest=b=>crypto.createHash('sha256').update(b).digest('hex');
          (async()=>{
            const live=await realFetch('https://raw.githubusercontent.com/ZordarGR/Check-Suite/main/update/latest.json?_='+Date.now(),{cache:'no-store'});
            const lm=await live.json(); console.log('LIVE_MANIFEST',live.status,lm.version,lm.sha256);
            const old=await realFetch(lm.html,{cache:'no-store'}),oldbuf=Buffer.from(await old.arrayBuffer());
            console.log('OLD_URL',old.status,'SHA',digest(oldbuf),'EXPECTED',lm.sha256,'MATCH',digest(oldbuf)===lm.sha256,'CACHE',old.headers.get('x-cache'));
            const tmp=fs.mkdtempSync(path.join(os.tmpdir(),'update-delivery-'));
            const u=new Updater({userDataDir:tmp,packagedDir:path.resolve('app'),pkgVersion:'1.17.76',updateUrl:'https://manifest.test/latest.json'});
            global.fetch=async(url,opts)=>{
              if(String(url).startsWith('https://manifest.test/'))return new Response(JSON.stringify(latest),{status:200});
              const r=await realFetch(url,opts);console.log('DOWNLOAD',r.status,url);return r;
            };
            const result=await u.check();
            assert.deepEqual(result,{version:'1.17.77'});
            assert(u.promote());assert.equal(u.effective().version,'1.17.77');
            assert.equal(digest(fs.readFileSync(u.effective().file)),latest.sha256);
            console.log('PASS Existing 1.17.76 updater downloads, validates and promotes pinned 1.17.77 HTML');
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
          node test/release.js
