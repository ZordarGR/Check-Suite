name: Verify guest turnover and preserved census
on:
  push:
    branches: [codex/guest-turnover-180]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce released name defects
        run: |
          git fetch --depth=1 origin 1e74ad81c3386dd8b44e5ac32029250c15c3dd66
          cp app/index.html /tmp/turnover-candidate.html
          git show 1e74ad81c3386dd8b44e5ac32029250c15c3dd66:app/index.html > app/index.html
          if node test/guest-turnover.js; then
            cp /tmp/turnover-candidate.html app/index.html
            echo "Expected released regression did not reproduce"; exit 1
          fi
          cp /tmp/turnover-candidate.html app/index.html
      - name: Prepare immutable HTML manifest
        run: |
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const p='update/latest.json',m=JSON.parse(fs.readFileSync(p));
          m.version='1.17.80';m.type='html';
          m.html='https://raw.githubusercontent.com/ZordarGR/Check-Suite/'+process.env.GITHUB_SHA+'/Departments%20Check.html';
          m.sha256=crypto.createHash('sha256').update(fs.readFileSync('Departments Check.html')).digest('hex');
          m.notes='Match all printed guest-name characters; follow confirmed departure room moves; retain same-day in-house rows until explicit departure CO.';
          fs.writeFileSync(p,JSON.stringify(m,null,2)+'\n');
          NODE
      - name: Node regressions
        id: unit
        continue-on-error: true
        run: |
          sh test/run.sh
          node test/departure-report.js
      - name: Install cloud browser
        run: |
          npm install --no-save --no-package-lock playwright-core@1.56.1
          PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers npx playwright-core install --with-deps chromium
          node test/harness.js
      - name: Browser regressions
        id: browser
        continue-on-error: true
        run: |
          node test/browser/guest-turnover.js
          node test/browser/movesfit.js
          node test/browser/live.js
      - name: Verify public download with installed updater
        run: |
          node <<'NODE'
          const fs=require('fs'),os=require('os'),path=require('path'),assert=require('assert');
          const {Updater}=require('./app/updater'),m=JSON.parse(fs.readFileSync('update/latest.json'));
          const realFetch=global.fetch;global.fetch=(url,opts)=>String(url).startsWith('https://manifest.test/')?Promise.resolve({ok:true,json:async()=>m}):realFetch(url,opts);
          (async()=>{const u=new Updater({userDataDir:fs.mkdtempSync(path.join(os.tmpdir(),'turnover-update-')),packagedDir:path.resolve('app'),pkgVersion:'1.17.76',updateUrl:'https://manifest.test/latest.json'});
          assert.equal((await u.check())?.version,'1.17.80');assert(u.promote());assert.equal(u.effective().version,'1.17.80');
          console.log('Immutable public HTML downloaded, digest verified and promoted to 1.17.80');})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Require all checks
        run: |
          test "${{ steps.unit.outcome }}" = success
          test "${{ steps.browser.outcome }}" = success
      - name: Record verified manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update/latest.json
          git commit -m "Record verified 1.17.80 HTML digest"
          git push
