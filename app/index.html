<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC CHECK — Nightly Receipt Audit</title>
<style>
:root{
  --bg:#0a0e14;
  --bg2:#0f1520;
  --panel:#131b29;
  --panel2:#182234;
  --line:#233047;
  --txt:#dbe4f0;
  --dim:#9fb0c9;
  --faint:#7484a0;
  --amber:#f5b453;
  --amber-dim:#8a6528;
  --green:#4ade80;
  --green-dim:#1d5c36;
  --red:#f87171;
  --red-dim:#6b2323;
  --mono:"Consolas","Cascadia Mono","Courier New",monospace;
  --sans:"Segoe UI","Segoe UI Variable",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px}
body{min-height:100vh;background:
  radial-gradient(1200px 500px at 70% -10%, rgba(245,180,83,.05), transparent 60%),
  radial-gradient(900px 600px at -10% 110%, rgba(74,222,128,.04), transparent 55%),
  var(--bg)}
::selection{background:var(--amber);color:#000}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:80;background:rgba(10,14,20,.92);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:14px}
header h1{font-size:16px;letter-spacing:.18em;font-weight:600;color:var(--amber);font-family:var(--mono);white-space:nowrap;cursor:pointer}
#reportMeta.clickable{cursor:pointer}
header h1 span{color:var(--dim);font-weight:400}
#reportMeta{font-family:var(--mono);font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#reportMeta b{color:var(--txt);font-weight:600}
header .spacer{flex:1}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:7px 14px;border-radius:8px;
  cursor:pointer;font-family:var(--sans);font-size:13.5px;transition:border-color .15s, background .15s;white-space:nowrap}
.btn:hover{border-color:var(--amber);background:#1c2942}
.btn.amber{border-color:var(--amber-dim);color:var(--amber)}
.btn.small{padding:4px 10px;font-size:12.5px;border-radius:6px}
.kebab{position:relative}
.kebab>button{font-size:18px;line-height:1;padding:6px 11px}
.kebab-menu{display:none;position:absolute;right:0;top:110%;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;min-width:220px;box-shadow:0 12px 32px rgba(0,0,0,.55);overflow:hidden}
.kebab-menu.open{display:block}
.kebab-menu button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--txt);
  padding:11px 15px;font-size:13.5px;cursor:pointer}
.kebab-menu button:hover{background:var(--panel2)}
.kebab-menu button.danger{color:var(--red)}

/* ---------- landing: menu + files ---------- */
#landing{max-width:900px;margin:7vh auto;padding:0 20px;text-align:center}
#homeLogo{cursor:pointer}
#menuScreen{margin-top:34px}
.mNav{display:flex;flex-direction:column;gap:10px;max-width:430px;margin:0 auto}
.mItem{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;padding:15px 20px;cursor:pointer;color:var(--txt);
  transition:border-color .15s, background .15s, transform .12s}
.mItem:hover{border-color:var(--amber);background:var(--panel2);transform:translateX(4px)}
.mItem .mLabel{font-family:var(--mono);letter-spacing:.16em;font-size:15px;font-weight:600}
.mItem .mSub{font-size:12px;color:var(--faint);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mItem.primary{border-color:var(--amber-dim)}
.mItem.primary .mLabel{color:var(--amber)}
#filesScreen{text-align:left;margin-top:26px}
#fbHead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
#fbDir{font-family:var(--mono);font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:1}
.vbtn.active{border-color:var(--amber);color:var(--amber)}
#fbList.list{display:flex;flex-direction:column;gap:6px}
#fbList.list .fbItem{display:flex;align-items:center;gap:12px;padding:10px 14px}
#fbList.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:10px}
#fbList.tiles .fbItem{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 12px;text-align:center}
.fbItem{background:var(--panel);border:1px solid var(--line);border-radius:12px;cursor:pointer;transition:border-color .12s, background .12s}
.fbItem:hover{border-color:var(--amber);background:var(--panel2)}
.fbItem.open{border-color:var(--amber-dim);background:#1a2438}
.fbIcon{font-size:20px;color:var(--amber)}
#fbList.tiles .fbIcon{font-size:34px}
.fbMeta{min-width:0}
.fbName{font-family:var(--mono);font-size:13.5px;color:var(--txt);word-break:break-all}
.fbSub{font-size:11.5px;color:var(--faint);font-family:var(--mono);margin-top:2px}
#fbEmpty{color:var(--faint);font-family:var(--mono);font-size:12.5px;padding:30px;text-align:center;border:1.5px dashed var(--line);border-radius:12px}
#staleChip{display:none;background:#4a3a12;border:1px solid var(--amber-dim);color:var(--amber);border-radius:999px;
  padding:3px 10px;font-size:11.5px;font-family:var(--mono);cursor:pointer;white-space:nowrap}
/* ---------- landing (legacy bits) ---------- */
#unused-landing-old{max-width:640px;margin:9vh auto;padding:0 20px;text-align:center}
#landing .logo{font-family:var(--mono);font-size:34px;letter-spacing:.22em;color:var(--amber);margin-bottom:6px}
#landing .logo span{color:var(--faint)}
#landing p.sub{color:var(--dim);margin-bottom:34px;font-size:14px}
#drop{border:1.5px dashed var(--line);border-radius:16px;padding:56px 30px;cursor:pointer;
  transition:border-color .2s, background .2s;background:rgba(19,27,41,.5)}
#drop:hover,#drop.over{border-color:var(--amber);background:rgba(245,180,83,.05)}
#drop .big{font-size:17px;margin-bottom:8px}
#drop .hint{color:var(--faint);font-size:13px;font-family:var(--mono)}
#landing .err{color:var(--red);margin-top:18px;font-size:13.5px;min-height:1.2em}
#landData{margin-top:30px}
#landData .hint2{color:var(--faint);font-size:11.5px;margin-top:8px;font-family:var(--mono)}

/* ---------- summary strip ---------- */
main{max-width:1060px;margin:0 auto;padding:16px 18px 90px}
#summary{display:none;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card .lbl{font-size:11px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;margin-bottom:5px}
.card .val{font-family:var(--mono);font-size:19px;font-weight:600}
.card .sub{font-family:var(--mono);font-size:13.5px;color:#c3cfe2;margin-top:5px}
.card .sub b{font-size:16px;color:var(--dim)}
.card.part .sub b{color:var(--amber)}
.card.done .sub b{color:var(--green)}
.card.done{border-color:var(--green-dim)}
.card.done .val{color:var(--green)}
.tick{color:var(--green);font-weight:700;margin-left:6px}
.openPill{display:inline-block;font-size:10px;letter-spacing:.1em;padding:2px 8px;border-radius:999px;margin-left:8px;
  background:rgba(245,180,83,.13);border:1px solid var(--amber-dim);color:var(--amber);
  font-family:var(--mono);font-weight:600;animation:pillPulse 1.8s ease-in-out infinite;vertical-align:1px}
@keyframes pillPulse{0%,100%{opacity:1}50%{opacity:.4}}
.card.grand{border-color:var(--amber-dim)}
.card.grand .val{color:var(--amber)}
#parseWarn{display:none;background:rgba(248,113,113,.08);border:1px solid var(--red-dim);color:var(--red);
  border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px;font-family:var(--mono)}
#parseOk{display:none;color:var(--green);font-size:12px;font-family:var(--mono);margin:-6px 0 12px 2px}
#parseNote{display:none;color:var(--amber-dim);font-size:12px;font-family:var(--mono);margin:-6px 0 12px 2px}

/* ---------- search ---------- */
#searchWrap{display:none;position:sticky;top:52px;z-index:40;background:rgba(10,14,20,.95);backdrop-filter:blur(6px);
  padding:10px 0 12px;margin-bottom:6px;border-bottom:1px solid var(--line)}
#searchRow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#snInput{flex:0 0 220px;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;color:var(--txt);
  font-family:var(--mono);font-size:20px;letter-spacing:.08em;padding:10px 14px;outline:none;transition:border-color .15s}
#snInput:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(245,180,83,.12)}
#snInput.nomatch{color:var(--red);border-color:var(--red-dim)}
#snInput::placeholder{color:var(--faint);font-size:14px;letter-spacing:0}
#notThereBtn{display:none}
#matches{display:flex;flex-direction:column;gap:6px;flex:1;min-width:280px}
.match{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--amber-dim);
  border-radius:10px;padding:8px 12px;font-family:var(--mono);font-size:14px;animation:pop .12s ease-out}
@keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:scale(1);opacity:1}}
.match .dept{color:var(--amber);font-size:12px;letter-spacing:.08em;min-width:86px}
.match .room{color:#fff;font-weight:800;font-size:16px;min-width:56px}
.match .msn{color:var(--amber)}
.match .name{color:var(--dim);font-size:12.5px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match .amt{font-weight:800;margin-left:auto;font-size:16px;color:#fff}
.match .split{color:#c3cfe2;font-size:13px}
.match input[type=checkbox]{width:22px;height:22px;accent-color:var(--green);cursor:pointer;flex:0 0 auto}
.match .state{font-size:11px;padding:2px 7px;border-radius:5px}
.match .state.ok{background:var(--green-dim);color:var(--green)}
.match .state.missing,.match .state.extra{background:var(--red-dim);color:var(--red)}
.match .state.corr{background:#4a3a12;color:var(--amber)}
.match .state.cancelled{background:#2a3040;color:var(--dim)}
#searchHint{font-size:11.5px;color:var(--faint);margin-top:6px;font-family:var(--mono)}

/* ---------- accordions ---------- */
.acc{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.acc>.head{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;user-select:none}
.acc>.head:hover{background:var(--panel2)}
.acc>.head .bar{width:4px;height:26px;border-radius:2px;background:var(--amber);flex:0 0 auto}
.acc.extraAcc>.head .bar{background:var(--red)}
.acc>.head .name{font-weight:600;letter-spacing:.06em;font-size:15px}
.acc>.head .cnt{font-family:var(--mono);font-size:14px;color:var(--dim)}
.acc>.head .cnt b{font-size:16.5px;color:var(--txt)}
.acc.done>.head .bar{background:var(--green)}
.acc.done>.head .tot{color:var(--green)}
.acc.done>.head .cnt b{color:var(--green)}
.acc>.head .prog{font-family:var(--mono);font-size:13.5px;margin-left:auto;color:var(--dim)}
.acc>.head .prog b{color:var(--dim);font-weight:700;font-size:15px}
.acc.part>.head .prog b{color:var(--amber)}
.acc.done>.head .prog b{color:var(--green)}
.acc>.head .tot{font-family:var(--mono);font-size:16px;font-weight:700;min-width:110px;text-align:right}
.acc>.head .chev{color:var(--faint);transition:transform .15s;font-size:12px}
.acc.open>.head .chev{transform:rotate(90deg)}
.acc>.body{display:none;border-top:1px solid var(--line)}
.roomSearchWrap{display:flex;align-items:center;gap:10px;padding:9px 16px 3px}
.roomSearch{background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px 10px;font-family:var(--mono);font-size:13.5px;width:110px}
.roomSearch:focus{outline:none;border-color:var(--amber-dim)}
.rsHint{color:var(--faint);font-size:11.5px}
.rrow.khl{background:var(--panel2);box-shadow:inset 3px 0 0 var(--amber)}
.rrow.khl.act-ok .rowck{outline:2px solid var(--green);outline-offset:2px;border-radius:4px}
.rrow.khl.act-warn .warnBtn{outline:2px solid var(--amber);outline-offset:1px}
.acc.open>.body{display:block}
.rrow{display:flex;align-items:center;gap:12px;padding:9px 16px;border-bottom:1px solid rgba(35,48,71,.5);
  font-family:var(--mono);font-size:14px}
.rrow:last-child{border-bottom:none}
.rrow:hover{background:rgba(24,34,52,.5)}
.rrow .room{min-width:64px;font-weight:800;font-size:15.5px;color:#fff}
.rrow .room .adj{color:var(--faint);font-size:11px;font-weight:400}
.rrow .sn{min-width:78px;color:var(--amber)}
.rrow .name{color:var(--dim);font-size:12.5px;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .split{color:#c3cfe2;font-size:13px;flex:1}
.rrow .amt{font-weight:800;min-width:96px;text-align:right;font-size:15.5px;color:#fff}
.rrow .old{color:var(--red);text-decoration:line-through;margin-right:7px;font-weight:400}
.rrow.st-ok .amt,.rrow.st-ok .room,.rrow.st-ok .sn,.rrow.st-ok .split{color:var(--green)}
.rrow.st-missing .amt,.rrow.st-missing .room,.rrow.st-missing .sn,.rrow.st-missing .split{color:var(--red)}
.rrow.st-corrected .amt,.rrow.st-corrected .room{color:#fff}
.rrow.st-extra .amt,.rrow.st-extra .room,.rrow.st-extra .sn{color:var(--red)}
.rrow.st-cancelled{opacity:.45}
.rrow.st-cancelled .amt,.rrow.st-cancelled .room,.rrow.st-cancelled .sn{color:var(--dim)}
.rrow .tag{font-size:10.5px;padding:2px 7px;border-radius:5px;letter-spacing:.05em}
.rrow .tag.ok{background:var(--green-dim);color:var(--green)}
.rrow .tag.missing{background:var(--red-dim);color:var(--red)}
.rrow .tag.corr{background:#4a3a12;color:var(--amber)}
.rrow .tag.extra{background:var(--red-dim);color:var(--red)}
.rrow .tag.cancelled{background:#232b3b;color:var(--dim)}
.warnBtn{background:none;border:1px solid var(--line);border-radius:7px;color:var(--amber);cursor:pointer;
  font-size:14px;padding:3px 9px;flex:0 0 auto;transition:border-color .15s}
.warnBtn:hover{border-color:var(--amber)}
.rowck{width:20px;height:20px;accent-color:var(--green);cursor:pointer;flex:0 0 auto}
.rrow .tag.merged{background:#16324d;color:#7cc4ff}
.rrow .tag.void,.match .state.void{background:#2a3040;color:var(--dim)}
.rrow.st-void{opacity:.55}
.rrow.st-void .amt,.rrow.st-void .room,.rrow.st-void .sn,.rrow.st-void .split{color:var(--dim)}
.rowMenu{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:10px;z-index:60;
  box-shadow:0 12px 30px rgba(0,0,0,.6);min-width:300px;overflow:hidden}
.rowMenu button{display:block;width:100%;background:none;border:none;text-align:left;color:var(--txt);
  padding:12px 15px;font-size:13.5px;cursor:pointer;border-bottom:1px solid rgba(35,48,71,.5)}
.rowMenu button:last-child{border-bottom:none}
.rowMenu button:hover{background:var(--panel2)}
.rowMenu button .k{color:var(--amber);font-family:var(--mono);margin-right:8px}
.otherPost{padding:6px 16px 12px}
.otherPost summary{cursor:pointer;color:var(--faint);font-size:12px;font-family:var(--mono);padding:6px 0}
.otherPost .rrow{padding:6px 0;font-size:13px;color:#9fb0c9}
.otherPost .rrow .amt{color:var(--dim)}

/* ---------- modal ---------- */
#modalBg{display:none;position:fixed;inset:0;background:rgba(4,6,10,.72);z-index:100;align-items:center;justify-content:center}
#modalBg.open{display:flex}
#modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 24px;width:min(420px,92vw);
  box-shadow:0 24px 60px rgba(0,0,0,.7)}
#modal h3{font-size:15px;letter-spacing:.08em;color:var(--amber);margin-bottom:16px;font-family:var(--mono)}
#modal label{display:block;font-size:12px;color:var(--dim);margin:12px 0 4px;letter-spacing:.06em}
#modal input,#modal select{width:100%;background:var(--bg2);border:1.5px solid var(--line);border-radius:8px;
  color:var(--txt);font-family:var(--mono);font-size:16px;padding:9px 12px;outline:none}
#modal input:focus,#modal select:focus{border-color:var(--amber)}
#modal .mrow{display:flex;gap:10px}
#modal .mrow>div{flex:1}
#modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
#modal .err{color:var(--red);font-size:12.5px;margin-top:10px;min-height:1em}

/* toast */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel2);
  border:1px solid var(--green-dim);color:var(--green);font-family:var(--mono);font-size:14.5px;padding:12px 22px;
  border-radius:10px;opacity:0;pointer-events:none;transition:opacity .5s ease,transform .5s ease;z-index:120}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.red{border-color:var(--red-dim);color:var(--red)}
#toast.match{display:flex;align-items:center;gap:12px;font-family:var(--sans);max-width:min(92vw,680px)}
#toast .tick{color:var(--green);font-weight:800;font-size:17px}

/* ---------- side rail + drawer ---------- */
#rail{position:fixed;right:12px;top:66px;z-index:70;display:none;flex-direction:column;gap:8px;transition:right .18s ease}
body.drawerOpen #rail{right:342px}
.railBtn{width:44px;height:44px;border-radius:12px;background:var(--panel);border:1px solid var(--line);
  color:var(--dim);cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;
  transition:border-color .15s,color .15s,background .15s}
.railBtn:hover{border-color:var(--amber);color:var(--amber)}
.railBtn.active{border-color:var(--amber);color:var(--amber);background:#1c2942}
.railBtn .cnt{position:absolute;top:-6px;right:-6px;background:var(--amber);color:#000;font-size:10.5px;
  font-weight:700;font-family:var(--mono);border-radius:999px;padding:1px 6px;display:none}
#drawer{position:fixed;right:0;top:52px;bottom:0;width:330px;background:var(--bg2);border-left:1px solid var(--line);
  z-index:65;transform:translateX(100%);transition:transform .18s ease;display:flex;flex-direction:column}
body.drawerOpen #drawer{transform:none}
main{transition:margin-right .18s ease}
@media(min-width:900px){ body.drawerOpen main{margin-right:350px} }
.dHead{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;flex:0 0 auto;
  border-bottom:1px solid var(--line);font-family:var(--mono);letter-spacing:.14em;color:var(--amber);font-size:13px}
.dPanel{display:none}
.dPanel.active{display:block;overflow-y:auto;flex:1}
.nHint{font-size:11.5px;color:var(--faint);font-family:var(--mono);min-height:1.2em;margin:-2px 0 6px 2px}
.nHint b{color:var(--dim);font-weight:400}
.match .name.nick,.rrow .name.nick{color:#4fd1c5}
.nWho{font-family:var(--mono);font-size:13px;color:var(--dim);margin:2px 0 8px}
.nWho b{color:#ffd98a;font-size:15px}
.nWho span{color:var(--faint);font-size:12px}
.nBtns{display:flex;gap:8px}
.nBtns .btn{flex:1}
.wRow.sel{background:var(--panel2);box-shadow:inset 3px 0 0 var(--amber)}
.wRow .name .base{color:var(--faint);font-size:11px}
#nList{border-bottom:1px solid var(--line)}
.nMore{color:var(--faint);font-size:11.5px;padding:8px 14px;font-family:var(--mono)}
.wForm{padding:14px;border-bottom:1px solid var(--line)}
.wForm .wFormRow{display:flex;gap:8px}
.wForm input{width:100%;background:var(--panel);border:1.5px solid var(--line);border-radius:8px;color:var(--txt);
  font-family:var(--mono);font-size:14px;padding:8px 10px;outline:none;margin-bottom:8px}
.wForm input:focus{border-color:var(--amber)}
.wForm .btn{width:100%}
.wErr{color:var(--red);font-size:12px;min-height:1.1em;margin-top:6px;font-family:var(--mono)}
.wAcc .wHead{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none;
  font-size:11.5px;letter-spacing:.12em;color:var(--dim);font-family:var(--mono)}
.wAcc .wHead b{color:#ffd98a;font-size:13px}
.wAcc .wHead .chev{color:var(--faint);transition:transform .15s;font-size:11px;margin-left:auto}
.wAcc.open .wHead .chev{transform:rotate(90deg)}
.wAcc .wBody{display:none}
.wAcc.open .wBody{display:block}
.wRow{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid rgba(35,48,71,.5);
  font-family:var(--mono);font-size:13.5px;cursor:pointer}
.wRow:hover{background:var(--panel2)}

<script id="parser">
/* ================= PARSER (DOM-free) ================= */
"use strict";

const TARGET_DEPTS = ["RESTAURANT","CAFETERIA","TAVERNAKI","KAFENIO","BAR"];
const INTERFACE_USER = "IFC";   // POS interface — its negatives are voids; a human's negatives = consolidation → VOID
const MONEY_RE = /^-?\d{1,3}(?:\.\d{3})*,\d{2}$/;

function moneyToNum(s){ return Math.round(parseFloat(s.replace(/\./g,"").replace(",","."))*100)/100; }
function numToMoney(n){
  const neg = n < -0.004;
  n = Math.abs(n);
  const [i,d] = n.toFixed(2).split(".");
  return (neg?"-":"") + i.replace(/\B(?=(\d{3})+(?!\d))/g,".") + "," + d;
}

/* ---- ZIP reading (EOCD → central dir → deflate-raw) ---- */
async function unzipFpages(buf){
  const dv = new DataView(buf);
  const len = buf.byteLength;
  let eocd = -1;
  const stop = Math.max(0, len - 22 - 65557);
  for(let i = len - 22; i >= stop; i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error("Not a valid OXPS/ZIP file (no central directory).");
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const td = new TextDecoder("utf-8");
  const entries = [];
  for(let i = 0; i < count; i++){
    if(dv.getUint32(p, true) !== 0x02014b50) break;
    const method   = dv.getUint16(p + 10, true);
    const csize    = dv.getUint32(p + 20, true);
    const nameLen  = dv.getUint16(p + 28, true);
    const extraLen = dv.getUint16(p + 30, true);
    const cmtLen   = dv.getUint16(p + 32, true);
    const lho      = dv.getUint32(p + 42, true);
    const name = td.decode(new Uint8Array(buf, p + 46, nameLen));
    entries.push({name, method, csize, lho});
    p += 46 + nameLen + extraLen + cmtLen;
  }
  const fpages = entries
    .filter(e => /Documents\/1\/Pages\/\d+\.fpage$/i.test(e.name))
    .sort((a,b) => parseInt(a.name.match(/(\d+)\.fpage/i)[1]) - parseInt(b.name.match(/(\d+)\.fpage/i)[1]));
  if(!fpages.length) throw new Error("No page content (.fpage) found — is this a protel OXPS report?");
  const xmls = [];
  for(const e of fpages){
    const nl = dv.getUint16(e.lho + 26, true);
    const xl = dv.getUint16(e.lho + 28, true);
    const start = e.lho + 30 + nl + xl;
    const bytes = new Uint8Array(buf, start, e.csize);
    let out;
    if(e.method === 0){
      out = bytes;
    }else if(e.method === 8){
      const ds = new DecompressionStream("deflate-raw");
      const stream = new Blob([bytes]).stream().pipeThrough(ds);
      out = new Uint8Array(await new Response(stream).arrayBuffer());
    }else{
      throw new Error("Unsupported ZIP compression method: " + e.method);
    }
    xmls.push(td.decode(out));
  }
  return xmls;
}

/* ---- XML entity decode ---- */
function xmlDecode(s){
  return s.replace(/&(amp|lt|gt|quot|apos|#x[0-9a-fA-F]+|#\d+);/g, (m, e) => {
    if(e === "amp") return "&";
    if(e === "lt") return "<";
    if(e === "gt") return ">";
    if(e === "quot") return '"';
    if(e === "apos") return "'";
    if(e[0] === "#") return String.fromCodePoint(e[1] === "x" || e[1] === "X" ? parseInt(e.slice(2),16) : parseInt(e.slice(1),10));
    return m;
  });
}

/* ---- Glyphs → tokens (advance-gap splitting) ---- */
const SPLIT_GAP = 130;      // 1/100 em units — column gaps are 300+, intra-word ≤ ~60
const DEFAULT_ADV = 55;

function parseIndices(str, n){
  const advs = new Array(n).fill(null);
  if(!str) return advs;
  const parts = str.split(";");
  for(let i = 0; i < parts.length && i < n; i++){
    const e = parts[i].replace(/^\(\d+:\d+\)/, "");
    const f = e.split(",");
    if(f.length >= 2 && f[1] !== ""){
      const a = parseFloat(f[1]);
      if(!isNaN(a)) advs[i] = a;
    }
  }
  return advs;
}

function pageTokens(xml){
  const toks = [];
  const re = /<Glyphs\b[^>]*?\/>/g;
  let m;
  while((m = re.exec(xml))){
    const tag = m[0];
    const attr = n => { const mm = tag.match(new RegExp(n + '="([^"]*)"')); return mm ? mm[1] : null; };
    const us = attr("UnicodeString");
    const ox = attr("OriginX"), oy = attr("OriginY");
    if(us === null || ox === null || oy === null) continue;
    const text = xmlDecode(us);
    if(!text) continue;
    const em = parseFloat(attr("FontRenderingEmSize") || "10") || 10;
    const advs = parseIndices(attr("Indices"), text.length);
    let x = parseFloat(ox), y = parseFloat(oy);
    let cur = "", curX = x;
    for(let i = 0; i < text.length; i++){
      const a = advs[i] === null ? DEFAULT_ADV : advs[i];
      if(cur === "") curX = x;
      cur += text[i];
      if(a > SPLIT_GAP){ toks.push({x: curX, y, t: cur}); cur = ""; }
      x += a * em / 100;
    }
    if(cur) toks.push({x: curX, y, t: cur});
  }
  return toks;
}

function pageRows(xml){
  const toks = pageTokens(xml).sort((a,b) => a.y - b.y || a.x - b.x);
  const rows = [];
  // TOL must sit between the baseline jitter WITHIN one printed line (up to ~3.3
  // when a wrapped Descr: line offsets the layout) and the spacing BETWEEN lines
  // (>=10.7 in real reports). At 3 a row could split in two, orphaning its amount.
  const TOL = 6;
  for(const g of toks){
    if(rows.length && Math.abs(rows[rows.length-1].y - g.y) < TOL) rows[rows.length-1].toks.push(g);
    else rows.push({y: g.y, toks: [g]});
  }
  for(const r of rows) r.toks.sort((a,b) => a.x - b.x);
  return rows;
}

/* ---- semantic parse ---- */
const SEC_RE = /^[A-ZΑ-ΩΆΈΉΊΌΎΏΪΫ0-9][A-ZΑ-ΩΆΈΉΊΌΎΏΪΫ0-9 %&\/.\-]*$/;
const FOLIO_ROOMS = new Set(["9601","9604","9605","9608"]);

function baseDept(section){ return section.replace(/\s+\d+%$/, "").trim(); }
function rateOf(section){ const m = section.match(/(\d+)%$/); return m ? m[1] + "%" : "base"; }
function mainRoom(raw){ const m = raw.match(/^(\d+)-\d*/); return m ? m[1] : raw; }

function parseReport(xmls){
  let section = null;
  const sections = {};          // name -> {rows:[], reported:null, group:null}
  let reportDate = null, printMeta = "", reportId = null, title = null;

  for(const xml of xmls){
    for(const row of pageRows(xml)){
      const toks = row.toks;
      const joined = toks.map(t => t.t).join(" ").trim();

      if(!reportDate){
        const dm = toks.find(t => /^\d{1,2}\/\d{1,2}\/\d{4}$/.test(t.t.trim()));
        if(dm && toks.some(t => t.t.includes("protel"))) reportDate = dm.t.trim();
      }
      if(!printMeta && joined.includes("List of postings")) printMeta = joined;
      if(!reportId && toks.some(t => t.t.trim() === "protel")){
        const idTok = toks.find(t => t.t.trim() !== "protel"
                                  && !/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(t.t.trim())
                                  && /[A-Za-z]/.test(t.t));
        if(idTok) reportId = idTok.t.trim();
      }
      if(!title && joined.includes("ΕΛΕΓΧΟΣ ΤΜΗΜΑΤΩΝ")) title = joined;

      // section header: single token, left margin
      if(toks.length === 1 && toks[0].x < 60 && SEC_RE.test(joined) && !joined.startsWith("Date/time")){
        section = joined;
        if(!sections[section]) sections[section] = {rows: [], reported: null, group: null};
        continue;
      }
      if(!section) continue;
      const S = sections[section];

      const timeTok = toks.find(t => t.x >= 78 && t.x < 120 && /^\d{2}:\d{2}$/.test(t.t.trim()));
      if(timeTok){
        // detail row
        const dateTok  = toks.find(t => t.x < 78 && /^\d{1,2}\/\d{1,2}\/\d{4}$/.test(t.t.trim()));
        const userTok  = toks.find(t => t.x >= 115 && t.x < 152);
        const roomTok  = toks.find(t => t.x >= 152 && t.x < 236);
        // guest name: single token drawn at x≈240; protel itself truncates it to
        // the column width (~24 chars), so a longer name simply isn't in the file.
        // NOTE: article text can start slightly LEFT of the qty token (seen at
        // x≈406 vs qty at x≈409), so the 402 boundary must stay fixed — do not
        // anchor it to the qty position.
        const guest    = toks.filter(t => t.x >= 236 && t.x < 402).map(t => t.t.trim()).join(" ").trim();
        let qty = null, amt = null;
        for(const t of toks){
          const s = t.t.trim();
          if(t.x >= 388 && t.x < 424 && /^-?\d+$/.test(s)) qty = parseInt(s, 10);
          if(t.x > 600 && MONEY_RE.test(s)) amt = moneyToNum(s);
        }
        const textStr = toks.filter(t => t.x >= 402 && t.x < 700 && !/^-?\d+$/.test(t.t.trim()))
                            .map(t => t.t).join(" ");
        const recM = textStr.match(/Rec:\s*(\d+)/);
        if(!reportDate && dateTok) reportDate = dateTok.t.trim();
        S.rows.push({
          time: timeTok.t.trim(),
          user: userTok ? userTok.t.trim() : "",
          room: roomTok ? roomTok.t.trim() : "",
          guest, qty: qty === null ? 1 : qty,
          amount: amt === null ? 0 : amt,
          sn: recM ? recM[1] : null,
          text: textStr.trim()
        });
        continue;
      }

      // section reported total: [groupLabel, money], label starts right of centre
      if(toks.length === 2 && toks[0].x > 300 && MONEY_RE.test(toks[1].t.trim())
         && toks[0].t.trim() !== "Total" && !joined.includes("TOTAL")){
        if(S.reported === null){
          S.reported = moneyToNum(toks[1].t.trim());
          S.group = toks[0].t.trim();
        }
      }
    }
  }
  return {sections, reportDate: reportDate || "?", printMeta, reportId, title};
}

function isCheckcharge(parsed){
  return /checkcharge/i.test(parsed.reportId || "") || /ΕΛΕΓΧΟΣ ΤΜΗΜΑΤΩΝ/.test(parsed.title || "");
}

/* ---- receipt model ---- */
function buildModel(parsed){
  const {sections, reportDate} = parsed;
  const validation = [];         // {section, parsed, reported, ok}
  const depts = {};              // base -> {receipts: Map(sn -> receipt), other: [], sections: [names]}
  for(const b of TARGET_DEPTS) depts[b] = {receipts: new Map(), other: [], sections: []};

  for(const [name, S] of Object.entries(sections)){
    const base = baseDept(name);
    let sum = 0;
    for(const r of S.rows) sum += r.amount;
    sum = Math.round(sum * 100) / 100;
    const ok = S.reported === null ? null : Math.abs(sum - S.reported) < 0.005;
    validation.push({section: name, parsed: sum, reported: S.reported, ok});

    if(!TARGET_DEPTS.includes(base)) continue;
    const D = depts[base];
    D.sections.push(name);
    const rate = rateOf(name);
    for(const r of S.rows){
      if(!r.sn || FOLIO_ROOMS.has(r.room)){
        D.other.push({...r, section: name, rate});
        continue;
      }
      const rk = r.sn + "|" + mainRoom(r.room);
      let rec = D.receipts.get(rk);
      if(!rec){
        rec = {dept: base, sn: r.sn, room: r.room, roomMain: mainRoom(r.room), guest: r.guest,
               rates: {}, total: 0, entries: []};
        D.receipts.set(rk, rec);
      }
      rec.rates[rate] = Math.round(((rec.rates[rate] || 0) + r.amount) * 100) / 100;
      rec.total = Math.round((rec.total + r.amount) * 100) / 100;
      rec.entries.push({...r, section: name, rate});
      if(!rec.room && r.room){ rec.room = r.room; rec.roomMain = mainRoom(r.room); }
    }
  }

  // cross-department consolidation: same SN + same main room = one physical
  // receipt split across departments by user error at the POS -> show only one
  const byKey = new Map();
  for(const b of TARGET_DEPTS){
    for(const r of depts[b].receipts.values()){
      const k = r.sn + "|" + r.roomMain;
      if(!byKey.has(k)) byKey.set(k, []);
      byKey.get(k).push(r);
    }
  }
  for(const group of byKey.values()){
    if(group.length < 2) continue;
    group.sort((a,c) => Math.abs(c.total) - Math.abs(a.total));   // primary = largest share
    const prim = group[0];
    prim.mergedFrom = group.map(g => g.dept);
    for(const dup of group.slice(1)){
      for(const [rate, v] of Object.entries(dup.rates)){
        prim.rates[rate] = Math.round(((prim.rates[rate] || 0) + v) * 100) / 100;
      }
      prim.total = Math.round((prim.total + dup.total) * 100) / 100;
      prim.entries.push(...dup.entries);
      depts[dup.dept].receipts.delete(dup.sn + "|" + dup.roomMain);
    }
  }

  // flatten + cancelled detection
  const receipts = [];
  for(const b of TARGET_DEPTS){
    const list = [...depts[b].receipts.values()];
    list.sort((a,c) => (parseInt(a.roomMain)||0) - (parseInt(c.roomMain)||0) || a.sn.localeCompare(c.sn, undefined, {numeric:true}));
    for(const r of list){
      let pos = 0; const posRates = {};
      let paidSum = 0; const paidBy = new Set();
      for(const e of r.entries){
        if(e.amount > 0){
          pos += e.amount;
          posRates[e.rate] = Math.round(((posRates[e.rate] || 0) + e.amount) * 100) / 100;
        }else if(e.amount < 0 && e.user !== INTERFACE_USER){
          paidSum += -e.amount;
          paidBy.add(e.user);
        }
      }
      r.posTotal = Math.round(pos * 100) / 100;
      r.posRates = posRates;
      r.paidAmount = Math.round(paidSum * 100) / 100;
      r.paidBy = [...paidBy];
      const net0 = Math.abs(r.total) < 0.005;
      r.voided = net0 && r.paidBy.length > 0;      // consolidated by a person — VOID, excluded from totals
      r.cancelled = net0 && r.paidBy.length === 0; // voided by the interface — hide it
      receipts.push(r);
    }
    depts[b].list = list;
  }

  // still-open detection: the ΜΕΤΡΗΤΑ ΤΜΗΜΑΤΩΝ consolidation posting (folio 9601)
  // is written when the POS department closes for the night; until it appears the
  // department may still add receipts while the check is underway.
  for(const b of TARGET_DEPTS){
    const D = depts[b];
    const hasActivity = (D.list && D.list.length) || D.other.length;
    D.stillOpen = !!hasActivity && !D.other.some(o => /ΜΕΤΡΗΤΑ/.test(o.guest || "") || o.room === "9601");
  }
  return {reportDate, depts, receipts, validation};
}

/* node-test hook */
if(typeof module !== "undefined" && module.exports){
  module.exports = {unzipFpages, parseReport, buildModel, numToMoney, moneyToNum, mainRoom, TARGET_DEPTS, isCheckcharge};
}

const el = (tag, cls, txt) => { const e = document.createElement(tag); if(cls) e.className = cls; if(txt !== undefined) e.textContent = txt; return e; };

let MODEL = null;         // parsed model
let STATE = null;         // per-day check state
let stateKey = null;
let WATCH = [];           // persistent watchlist [{sn, room, name}] — survives days & restarts

const WATCH_KEY = "reccheck_watchlist";
function loadWatch(){
  try{
    const raw = localStorage.getItem(WATCH_KEY);
    const a = raw ? JSON.parse(raw) : [];
    WATCH = Array.isArray(a) ? a.filter(w => w && w.room) : [];
  }catch(e){ WATCH = []; }
}
function saveWatch(){
  try{ localStorage.setItem(WATCH_KEY, JSON.stringify(WATCH)); }catch(e){}
}
function watchFor(room){ return WATCH.filter(w => String(w.room) === String(room)); }

let ROOMS = {};           // persistent room database: room -> {guest, nick, seen}
const ROOMS_KEY = "reccheck_rooms";
function loadRooms(){
  try{
    const o = JSON.parse(localStorage.getItem(ROOMS_KEY) || "{}");
    ROOMS = (o && typeof o === "object" && !Array.isArray(o)) ? o : {};
  }catch(e){ ROOMS = {}; }
}
function saveRooms(){
  try{ localStorage.setItem(ROOMS_KEY, JSON.stringify(ROOMS)); }catch(e){}
}
/* feed tonight's report into the DB: rooms are the stable keys, guest names the
   changing part — a changed guest resets that room's nickname */
function syncRooms(){
  const dropped = [];
  const gm = {};
  for(const r of MODEL.receipts)
    if(r.roomMain && r.guest && gm[r.roomMain] === undefined) gm[r.roomMain] = r.guest.trim();
  for(const [room, g] of Object.entries(gm)){
    const e = ROOMS[room];
    if(!e){ ROOMS[room] = {guest: g, seen: MODEL.reportDate}; continue; }
    if(e.guest && e.guest !== g && e.nick){
      dropped.push(room + " (" + e.nick + ")");
      delete e.nick;
    }
    e.guest = g;
    e.seen = MODEL.reportDate;
  }
  saveRooms();
  if(dropped.length)
    setTimeout(() => toast(t("n.reset") + dropped.join(" · "), true), 700);
}
function nickFor(room){ const e = ROOMS[String(room)]; return (e && e.nick) ? e.nick : null; }

/* ---------- state ---------- */
function blankState(date){
  return {date, receipts: {}, extras: []};   // receipts: "DEPT|SN" -> {status, corr:{sn,v24,v13}|null}
}
function rKey(r){ return r.dept + "|" + r.sn + "|" + r.roomMain; }
function rState(r){ return STATE.receipts[rKey(r)] || {status: "pending", corr: null}; }
function setRState(r, st){ STATE.receipts[rKey(r)] = st; saveState(); }
function saveState(){
  try{ localStorage.setItem(stateKey, JSON.stringify(STATE)); }catch(e){}
}
function loadState(date){
  stateKey = "reccheck_" + date;
  try{
    const raw = localStorage.getItem(stateKey);
    if(raw){ const s = JSON.parse(raw); if(s && s.date === date) return s; }
  }catch(e){}
  return blankState(date);
}

/* ---------- helpers ---------- */
function effSN(r){ const st = rState(r); return (st.corr && st.corr.sn) ? st.corr.sn : r.sn; }
function effRoom(r){ const st = rState(r); return (st.corr && st.corr.room) ? st.corr.room : r.roomMain; }
function corrHasValues(st){ return !!(st.corr && (st.corr.v24 !== undefined || st.corr.v13 !== undefined)); }
function effRates(r){
  const st = rState(r);
  if(corrHasValues(st)) return {"24%": st.corr.v24, "13%": st.corr.v13};
  return r.rates;
}
function effTotal(r){
  const rates = effRates(r);
  let t = 0; for(const v of Object.values(rates)) if(typeof v === "number") t += v;
  return Math.round(t * 100) / 100;
}
function rateSplitStr(rates){
  const order = ["24%","13%","6%","base"];
  const parts = [];
  for(const k of order){
    if(rates[k] === undefined || rates[k] === null) continue;
    parts.push((k === "base" ? "βασ" : k) + " " + numToMoney(rates[k]));
  }
  return parts.join(" · ");
}
function statusOf(r){
  if(r.cancelled) return "cancelled";
  if(r.voided) return "void";
  return rState(r).status;
}
function toast(msg, red){
  const t = $("#toast");
  t.textContent = msg;
  t.className = red ? "show red" : "show";
  clearTimeout(t._h);
  t._h = setTimeout(() => t.className = "", 3400);
}
function toastReceipt(r){
  const t = $("#toast");
  t.innerHTML = "";
  const card = matchCard(r);                              // single source of truth for card content
  card.querySelectorAll("button,input").forEach(x => x.remove());
  const tick = document.createElement("span"); tick.className = "tick"; tick.textContent = "✓";
  t.append(tick, ...card.childNodes);
  t.className = "show match";
  clearTimeout(t._h);
  t._h = setTimeout(() => t.className = "", 3400);
}

/* ---------- screens + reports-folder browser ---------- */
let SCREEN = "menu";
let LASTFNAME = "";
const FB = {dir: null, view: (function(){ try{ return localStorage.getItem("reccheck_fbview") || "list"; }catch(e){ return "list"; } })(), open: null, stale: false};

function showScreen(which){

function paintDirSub(){
  const el2 = $("#mDirSub");

  el2.textContent = FB.dir || t("menu.dirNone");
}
function escapeHtml(x){ const d = document.createElement("div"); d.textContent = x; return d.innerHTML; }
function fmtWhen(ms){
  const d = new Date(ms), now = new Date();
  const hm = pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  if(d.toDateString() === now.toDateString()) return t("fb.today") + " " + hm;
  return pad2(d.getDate()) + "/" + pad2(d.getMonth() + 1) + "/" + d.getFullYear() + " " + hm;
}
function fmtSize(b){ return b > 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1024)) + " KB"; }

function fbPaintChrome(){

async function fbRefresh(){
  fbPaintChrome();
  if(!window.reccheckFiles || !FB.dir) return;
  let res;
  try{ res = await window.reccheckFiles.list(); }catch(e){ return; }
  if(res.dir !== FB.dir){ FB.dir = res.dir; paintDirSub(); fbPaintChrome(); }
  const box = $("#fbList");
  box.innerHTML = "";
  $("#fbEmpty").style.display = res.files.length ? "none" : "";
  for(const f of res.files){
    const it = el("div", "fbItem" + (FB.open && FB.open.path === f.path ? " open" : ""));
    it.append(el("div", "fbIcon", "▤"));
    const meta = el("div", "fbMeta");
    meta.append(el("div", "fbName", f.name));
    meta.append(el("div", "fbSub", fmtWhen(f.mtimeMs) + " · " + fmtSize(f.size)));
    it.append(meta);
    it.onclick = () => fbOpen(f);
    box.append(it);
  }
  checkOpenChanged(res.files);
}
async function fbOpen(f){
  try{
    const raw = await window.reccheckFiles.read(f.path);
    const u8 = raw instanceof Uint8Array ? raw : new Uint8Array(raw);
    const buf = u8.buffer.slice(u8.byteOffset, u8.byteOffset + u8.byteLength);
    FB.open = {path: f.path, name: f.name, mtimeMs: f.mtimeMs};
    FB.stale = false;
    paintStaleChip();
    await loadReport(buf, f.name);
  }catch(err){
    toast("✗ " + (err.message || err), true);
  }
}
function paintStaleChip(){ $("#staleChip").style.display = (FB.stale && MODEL) ? "inline-block" : "none"; }
function checkOpenChanged(files){
  if(!FB.open) return;
  const cur = files.find(x => x.path === FB.open.path);
  if(!cur || cur.mtimeMs <= FB.open.mtimeMs + 500) return;
  FB.open.mtimeMs = cur.mtimeMs;          // one prompt per change
  FB.stale = true;
  paintStaleChip();
  if(SCREEN !== "app") return;            // browsing — the list refresh is enough
  showLivePrompt(cur);
}
function showLivePrompt(cur){
  openModal(`
    <h3>${t("live.title")}</h3>
    <div style="font-size:14px;line-height:1.65">${t("live.body", {name: "<b style=\"font-family:var(--mono)\">" + escapeHtml(FB.open.name) + "</b>", when: escapeHtml(fmtWhen(cur.mtimeMs))})}</div>
    <div class="actions">
      <button class="btn" id="chKeep">${t("live.keep")}</button>
      <button class="btn amber" id="chLive">${t("live.load")}</button>
    </div>`);
  $("#chKeep").onclick = () => { closeModal(); paintStaleChip(); };
  $("#chLive").onclick = () => { closeModal(); fbOpen(cur); };
}
async function fbPickDir(){
  if(!window.reccheckFiles) return;
  const dir = await window.reccheckFiles.pickDir();
  if(dir){ FB.dir = dir; paintDirSub(); if(SCREEN === "files") fbRefresh(); }
}

/* ---------- file load ---------- */
async function loadFile(file){
  const buf = await file.arrayBuffer();
  return loadReport(buf, file.name);
}
async function loadReport(buf, fname){
  $("#landErr").textContent = "";
  try{
    const xmls = await unzipFpages(buf);
    const parsed = parseReport(xmls);
    if(!isCheckcharge(parsed)){
      throw new Error(t("err.wrongreport") +
        (parsed.reportId ? " The file identifies as: \u201C" + parsed.reportId + "\u201D." : " No protel report id found in it."));
    }
    MODEL = buildModel(parsed);
    STATE = loadState(MODEL.reportDate);
    loadWatch();
    loadRooms();
    syncRooms();
    renderAll(fname);
    if(!MODEL.receipts.length){
      const w = $("#parseWarn");
      w.style.display = "block";
      w.textContent = t("warn.noreceipts");
    }
  }catch(err){
    const msg = "✗ " + (err.message || err);
    if($("#landing").style.display !== "none") $("#landErr").textContent = msg;
    else toast(msg, true);
  }
}

  const dm = MODEL.reportDate.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(dm){
    // pre-EOD check: business day = calendar today (pulled before midnight)
    // or calendar yesterday (pulled after midnight, EOD not yet run) — both fine
    const sameDay = (d) => +dm[1] === d.getDate() && +dm[2] === d.getMonth() + 1 && +dm[3] === d.getFullYear();
    const today = new Date();
    const yest = new Date(); yest.setDate(yest.getDate() - 1);
    if(!sameDay(today) && !sameDay(yest)){
      const w = el("span","", t("meta.older"));
      w.style.color = "var(--amber)";
      meta.append(w);

function renderValidation(){
  const warn = $("#parseWarn"), ok = $("#parseOk"), note = $("#parseNote");
  warn.style.display = "none";
  const target = MODEL.validation.filter(v => TARGET_DEPTS.includes(v.section.replace(/\s+\d+%$/,"").trim()));
  const bad = target.filter(v => v.ok === false);
  if(bad.length){
    // section totals include the cash/card (folio) rows, which are checked by
    // hand outside this tool — a small difference there is informational only
    ok.style.display = "none";
    note.style.display = "block";
    note.textContent = t("note.parse") +
      bad.map(v => `${v.section} ${numToMoney(v.parsed)} vs ${numToMoney(v.reported)} (Δ ${numToMoney(Math.round((v.reported - v.parsed)*100)/100)})`).join("  ·  ");
  }else{
    note.style.display = "none";
    ok.style.display = "block";
    ok.textContent = t("ok.parse", {n: target.length});
  }
}

function checkableList(){
  return MODEL.receipts.filter(r => !r.cancelled && !r.voided);
}

function renderSummary(){
  const s = $("#summary");
  s.style.display = "grid";
  s.innerHTML = "";
  const list = checkableList();
  const grand = list.reduce((a,r) => a + effTotal(r), 0);
  const done = list.filter(r => ["ok"].includes(rState(r).status)).length;
  const flags = list.filter(r => rState(r).status === "missing").length
              + list.filter(r => rState(r).status === "corrected").length
              + STATE.extras.length;

  const stCls = (dn, n) => (n && dn === n) ? " done" : (dn > 0 ? " part" : "");

  const g = el("div","card grand" + stCls(done, list.length));
  const gl = el("div","lbl", t("sum.grand"));
  if(list.length && done === list.length) gl.append(el("span","tick","✓"));
  g.append(gl);
  g.append(el("div","val", numToMoney(Math.round(grand*100)/100)));
  const gs = el("div","sub");
  gs.append(el("b","", String(done)));
  gs.append(` / ${list.length}` + t("sum.checked") + (flags ? ` · ${flags}` + t("sum.flagged") : ""));
  g.append(gs);
  s.append(g);

  for(const b of TARGET_DEPTS){
    const dl = (MODEL.depts[b].list || []).filter(r => !r.cancelled && !r.voided);
    if(!dl.length && !STATE.extras.some(x => x.dept === b)) continue;
    const tot = dl.reduce((a,r) => a + effTotal(r), 0);
    const dn = dl.filter(r => rState(r).status === "ok").length;
    const c = el("div","card" + stCls(dn, dl.length));
    const cl = el("div","lbl", b);
    if(dl.length && dn === dl.length) cl.append(el("span","tick","✓"));
    if(MODEL.depts[b].stillOpen){
      const op = el("span","openPill", t("tag.open"));
      op.title = "No ΜΕΤΡΗΤΑ ΤΜΗΜΑΤΩΝ close-out posting in the report — this department had not closed when the report was pulled and may still add receipts. Re-pull the report after it closes.";
      cl.append(op);
    }
    c.append(cl);
    c.append(el("div","val", numToMoney(Math.round(tot*100)/100)));
    const cs = el("div","sub");
    cs.append(el("b","", String(dn)));
    cs.append(` / ${dl.length} · `);
    cs.append(el("b","", String(dl.length)));
    cs.append(t("sum.rec"));
    c.append(cs);
    s.append(c);
  }
}

function tagFor(status){
  switch(status){
    case "ok": return ["ok", t("tag.ok")];
    case "missing": return ["missing", t("tag.missing")];
    case "corrected": return ["corr", t("tag.corr")];
    case "cancelled": return ["cancelled", t("tag.cancelled")];
    case "void": return ["void", t("tag.void")];
    case "extra": return ["extra", t("tag.extra")];
    default: return null;
  }
}

function renderAccordions(){
  const wrap = $("#accordions");
  const openSet = new Set([...wrap.querySelectorAll(".acc.open")].map(a => a.dataset.dept));
  wrap.innerHTML = "";

  for(const b of TARGET_DEPTS){
    const D = MODEL.depts[b];
    const list = (D.list || []);
    const extras = STATE.extras.filter(x => x.dept === b);
    if(!list.length && !extras.length) continue;
    wrap.append(buildAcc(b, list, extras, D.other, openSet.has(b)));
  }
  const unass = STATE.extras.filter(x => !TARGET_DEPTS.includes(x.dept));
  if(unass.length) wrap.append(buildAcc("UNASSIGNED — not in report", [], unass, [], true, true));
  for(const a of wrap.querySelectorAll(".acc")) applyRoomFilter(a, a.dataset.dept);
  knavPaint();
  if(RS_FOCUS){ const f = wrap.querySelector(`.roomSearch[data-dept="${CSS.escape(RS_FOCUS)}"]`); if(f) f.focus(); RS_FOCUS = null; }
}

function buildAcc(name, list, extras, other, open, isExtraAcc){
  const checkable = list.filter(r => !r.cancelled && !r.voided);
  const done = checkable.filter(r => rState(r).status === "ok").length;
  const tot = checkable.reduce((a,r) => a + effTotal(r), 0);

  const dyn = isExtraAcc ? "" :
    (checkable.length && done === checkable.length) ? " done" : (done > 0 ? " part" : "");
  const acc = el("div","acc" + (open ? " open" : "") + (isExtraAcc ? " extraAcc" : "") + dyn);
  acc.dataset.dept = name;
  const head = el("div","head");
  head.append(el("div","bar"));
  const nm = el("div","name", name);
  if(dyn === " done") nm.append(el("span","tick","✓"));
  const DD = MODEL.depts[name];
  if(DD && DD.stillOpen){
    const op = el("span","openPill", t("tag.open"));
    op.title = t("open.title");
    nm.append(op);
  }
  head.append(nm);
  const cnt = el("div","cnt");
  const voidCnt = list.filter(r => r.voided).length;
  cnt.append(el("b","", String(checkable.length)));
  cnt.append(t("sum.rec") + (voidCnt ? t("acc.void", {n: voidCnt}) : "") + (extras.length ? t("acc.extra", {n: extras.length}) : ""));
  head.append(cnt);
  const prog = el("div","prog");
  const pb = el("b","", String(done)); prog.append(pb); prog.append(` / ${checkable.length}`);
  head.append(prog);
  head.append(el("div","tot", numToMoney(Math.round(tot*100)/100)));
  head.append(el("div","chev","▶"));
  head.onclick = () => acc.classList.toggle("open");
  acc.append(head);

  const body = el("div","body");
  if(!isExtraAcc && checkable.length){
    const sw = el("div","roomSearchWrap");
    const rs = document.createElement("input");
    rs.className = "roomSearch"; rs.placeholder = t("room.ph");
    rs.autocomplete = "off"; rs.inputMode = "numeric";
    rs.dataset.dept = name;
    rs.value = ROOMF[name] || "";
    rs.oninput = () => { rs.value = rs.value.replace(/\D/g,""); ROOMF[name] = rs.value; applyRoomFilter(acc, name); };
    rs.onkeydown = e => roomSearchKeys(e, acc, name, rs);
    sw.append(rs, el("span","rsHint", t("room.hint")));
    body.append(sw);
  }
  for(const r of list){
    if(r.cancelled) continue;              // voided at the POS — hidden from lists
    body.append(receiptRow(r));
  }
  for(const x of extras) body.append(extraRow(x));
  if(other && other.length){
    const det = document.createElement("details");
    det.className = "otherPost";
    const sm = document.createElement("summary");
    sm.textContent = t("acc.other", {n: other.length});
    det.append(sm);
    for(const o of other){
      const rr = el("div","rrow");
      rr.append(el("div","room", o.room || "—"));
      rr.append(el("div","sn", o.rate === "base" ? "" : o.rate));
      rr.append(el("div","split", (o.guest || "") + " " + o.time));
      rr.append(el("div","amt", numToMoney(o.amount)));
      det.append(rr);
    }
    body.append(det);
  }
  acc.append(body);
  return acc;
}

function receiptRow(r){
  const st = rState(r);
  const status = statusOf(r);
  const row = el("div","rrow st-" + status);
  row.dataset.key = rKey(r);
  row.dataset.room = effRoom(r);
  row.onclick = () => { KNAV.key = rKey(r); KNAV.act = "ok"; knavPaint(); };

  const room = el("div","room");
  if(st.corr && st.corr.room){
    const old = el("span","old", r.roomMain); room.append(old);
    room.append(document.createTextNode(" " + st.corr.room));
  }else{
    room.textContent = r.roomMain;
    if(r.roomMain !== r.room) room.append(el("span","adj"," (" + r.room + ")"));
  }
  row.append(room);

  const sn = el("div","sn");
  if(st.corr && st.corr.sn){
    const old = el("span","old", r.sn); sn.append(old);
    sn.append(document.createTextNode(" " + st.corr.sn));
  }else sn.textContent = r.sn;
  row.append(sn);

  const nick = nickFor(effRoom(r));
  const nm = el("div","name" + (nick ? " nick" : ""), nick || r.guest || "");
  nm.title = nick ? ((r.guest || "") + t("n.nickedTitle")) : (r.guest || "");
  row.append(nm);

  const split = el("div","split");
  if(corrHasValues(st)){
    const old = el("span","old", rateSplitStr(r.rates)); split.append(old);
    split.append(document.createTextNode(" " + rateSplitStr(effRates(r))));
  }else{
    split.textContent = rateSplitStr(r.voided ? r.posRates : r.rates);
    if(!r.voided && r.paidAmount > 0)
      split.textContent += " · paid −" + numToMoney(r.paidAmount);
  }
  row.append(split);

  const ws = watchFor(effRoom(r));
  if(ws.length){
    row.classList.add("watch");
    const wt = el("span","tag watch", t("tag.watch"));
    wt.title = ws.map(w => (w.name || "?") + (w.sn ? " · SN " + w.sn : "")).join("  |  ");
    row.append(wt);
  }
  if(r.mergedFrom && r.mergedFrom.length > 1)
    row.append(el("span","tag merged", t("tag.merged") + r.mergedFrom.join("+")));
  if(r.voided){
    row.append(el("span","tag void", t("tag.void") + " · " + r.paidBy.join("+")));
  }else{
    const t = tagFor(status);
    if(t) row.append(Object.assign(el("span","tag " + t[0], t[1])));
  }

  const amt = el("div","amt");
  if(corrHasValues(st)){
    const old = el("span","old", numToMoney(r.total)); amt.append(old);
    amt.append(document.createTextNode(numToMoney(effTotal(r))));
  }else amt.textContent = numToMoney(r.voided ? r.posTotal : r.total);
  row.append(amt);

  if(!r.cancelled && !r.voided){
    const wb = el("button","warnBtn","⚠");
    wb.title = "Flag a problem with this receipt";
    wb.onclick = e => { e.stopPropagation(); openRowMenu(wb, r); };
    row.append(wb);

    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.className = "rowck";
    cb.checked = st.status === "ok";
    cb.title = "Checked by eye";
    cb.onclick = e => e.stopPropagation();
    cb.onchange = () => {
      const cur = rState(r);
      if(cb.checked){
        setRState(r, {status: "ok", corr: cur.corr || null});
        toastReceipt(r);
      }else{
        setRState(r, {status: cur.corr ? "corrected" : "pending", corr: cur.corr || null});
      }
      refresh();
    };
    row.append(cb);
  }
  return row;
}

/* ---------- keyboard navigation (room search · arrows · Enter) ---------- */
const ROOMF = {};                       // per-department room filter text
let KNAV = {key: null, act: "ok"};      // highlighted row + selected action
let RS_FOCUS = null;                    // room input to refocus after a refresh

function applyRoomFilter(acc, dept){
  const q = ROOMF[dept] || "";
  for(const row of acc.querySelectorAll(".body .rrow")){
    if(!("room" in row.dataset)) continue;
    row.style.display = (!q || String(row.dataset.room).startsWith(q)) ? "" : "none";
  }
  if(KNAV.key){
    const hl = acc.querySelector(`.rrow[data-key="${CSS.escape(KNAV.key)}"]`);
    if(hl && hl.style.display === "none"){ KNAV.key = null; knavPaint(); }
  }
}
function navRows(root){
  const rows = root ? root.querySelectorAll(".body .rrow") : document.querySelectorAll(".acc.open .body .rrow");
  return [...rows].filter(r => r.style.display !== "none" && r.querySelector(".rowck") && r.offsetParent !== null);
}
function knavPaint(){
  document.querySelectorAll(".rrow.khl").forEach(r => r.classList.remove("khl","act-ok","act-warn"));
  if(!KNAV.key) return;
  const row = document.querySelector(`.rrow[data-key="${CSS.escape(KNAV.key)}"]`);
  if(!row){ KNAV.key = null; return; }
  row.classList.add("khl","act-" + KNAV.act);
}
function knavMove(dir, root){
  const rows = navRows(root); if(!rows.length) return;
  let i = rows.findIndex(r => r.dataset.key === KNAV.key);
  i = i === -1 ? (dir > 0 ? 0 : rows.length - 1) : Math.min(rows.length - 1, Math.max(0, i + dir));
  KNAV.key = rows[i].dataset.key; KNAV.act = "ok"; knavPaint();
  rows[i].scrollIntoView({block: "nearest"});
}
function knavCommit(){
  if(!KNAV.key) return false;
  const row = document.querySelector(`.rrow[data-key="${CSS.escape(KNAV.key)}"]`);
  if(!row) return false;
  if(KNAV.act === "warn"){ const wb = row.querySelector(".warnBtn"); if(wb){ wb.click(); return true; } return false; }
  const cb = row.querySelector(".rowck"); if(!cb) return false;
  const rows = navRows(); const i = rows.indexOf(row);
  const nextKey = (!cb.checked && i > -1 && i < rows.length - 1) ? rows[i + 1].dataset.key : KNAV.key;
  cb.click();                                        // reuses the checkbox logic: state, toast, refresh
  KNAV.key = nextKey; KNAV.act = "ok"; knavPaint();
  return true;
}
function receiptByKey(key){
  for(const b of TARGET_DEPTS){
    const D = MODEL.depts[b]; if(!D || !D.list) continue;
    for(const r of D.list) if(rKey(r) === key) return r;
  }
  return null;
}
function roomSearchKeys(e, acc, dept, rs){
  if(e.key === "ArrowDown"){ knavMove(1, acc); e.preventDefault(); return; }
  if(e.key === "ArrowUp"){ knavMove(-1, acc); e.preventDefault(); return; }
  if(e.key === "Escape"){ rs.value = ""; ROOMF[dept] = ""; applyRoomFilter(acc, dept); rs.blur(); e.preventDefault(); return; }
  if(e.key !== "Enter") return;
  e.preventDefault();
  const rows = navRows(acc); if(!rows.length) return;
  const q = rs.value.trim();
  let target = KNAV.key ? rows.find(r => r.dataset.key === KNAV.key) : null;
  if(!target && q) target = rows.find(r => r.dataset.room === q);
  if(!target) target = rows[0];
  ROOMF[dept] = ""; RS_FOCUS = dept; KNAV.key = null;
  const cb = target.querySelector(".rowck");
  if(cb && !cb.checked) cb.click();                  // confirm only — Enter never un-checks
  else {
    const r = receiptByKey(target.dataset.key);
    if(r) toastReceipt(r);
    rs.value = ""; applyRoomFilter(acc, dept); knavPaint();
  }
}
document.addEventListener("keydown", e => {
  if(menuEl){ if(e.key === "Escape"){ closeMenu(); e.preventDefault(); } return; }
  if($("#modalBg").classList.contains("open")) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if(e.target.classList && e.target.classList.contains("roomSearch")) return;   // handled by the field itself
  if(tag === "input" || tag === "textarea" || tag === "select") return;
  switch(e.key){
    case "ArrowDown": knavMove(1); e.preventDefault(); break;
    case "ArrowUp":   knavMove(-1); e.preventDefault(); break;
    case "ArrowLeft":  if(KNAV.key){ KNAV.act = "warn"; knavPaint(); e.preventDefault(); } break;
    case "ArrowRight": if(KNAV.key){ KNAV.act = "ok";   knavPaint(); e.preventDefault(); } break;
    case "Enter":  if(knavCommit()) e.preventDefault(); break;
    case "Escape": KNAV.key = null; knavPaint(); break;
  }
});

/* ---------- search ---------- */
const inp = () => $("#snInput");
let ntTimer = null;
let currentMatches = [];

function findMatches(q){
  if(!q) return [];
  const out = [];
  for(const r of MODEL.receipts){
    const sn = effSN(r);
    if(sn === q) out.push({r, exact: true});
  }
  if(!out.length && q.length >= 3){
    for(const r of MODEL.receipts){
      const sn = effSN(r);
      if(sn.endsWith(q)) out.push({r, exact: false});
    }
  }
  return out;
}

function searchInput(){
  const f = inp();
  const clean = f.value.replace(/\D/g, "");
  if(clean !== f.value) f.value = clean;
  const q = clean;
  clearTimeout(ntTimer);
  $("#notThereBtn").style.display = "none";
  const box = $("#matches");
  box.innerHTML = "";
  currentMatches = [];
  inp().classList.remove("nomatch");
  if(!q) return;

  const ms = findMatches(q);
  currentMatches = ms;
  if(!ms.length){
    inp().classList.add("nomatch");
    ntTimer = setTimeout(() => { if(inp().value.trim() === q) $("#notThereBtn").style.display = ""; }, 900);
    return;
  }
  for(const m of ms) box.append(matchCard(m.r));
}

function matchCard(r){
  const c = el("div","match");
  c.append(el("span","dept", r.dept));
  c.append(el("span","room", effRoom(r) + (r.roomMain !== r.room && !(rState(r).corr && rState(r).corr.room) ? " ⧉" : "")));
  c.append(el("span","msn", effSN(r)));
  const nick = nickFor(effRoom(r));
  const nm = el("span","name" + (nick ? " nick" : ""), nick || r.guest || "");
  nm.title = nick ? ((r.guest || "") + t("n.nickedTitle")) : (r.guest || "");
  c.append(nm);
  c.append(el("span","split", rateSplitStr(r.voided ? r.posRates : effRates(r))));
  c.append(el("span","amt", numToMoney(r.voided ? r.posTotal : effTotal(r))));

  const ws = watchFor(effRoom(r));
  if(ws.length){
    c.classList.add("watch");
    const wt = el("span","state watch", t("tag.watch") + " · " + ws.map(w => w.name || ("SN " + w.sn)).join(" / "));
    wt.title = t("watch.compare", {room: effRoom(r)});
    c.append(wt);
  }
  if(r.voided) c.append(el("span","state void", t("tag.void") + " · " + r.paidBy.join("+")));
  if(r.mergedFrom && r.mergedFrom.length > 1)
    c.append(el("span","state corr", t("tag.merged") + r.mergedFrom.join("+")));
  const status = statusOf(r);
  if(status !== "pending" && status !== "corrected" && status !== "void"){
    const t = tagFor(status);
    c.append(el("span","state " + t[0], t[1]));
  }
  if(status === "corrected") c.append(el("span","state corr", t("tag.corr2")));

  if(!r.cancelled && !r.voided){
    const wb = el("button","warnBtn","⚠");
    wb.title = "Flag a problem with this receipt";
    wb.onclick = e => { e.stopPropagation(); openRowMenu(wb, r); };
    c.append(wb);
  }
  if(status !== "cancelled" && status !== "void"){
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = status === "ok";
    cb.onchange = () => confirmReceipt(r, cb.checked);
    c.append(cb);
  }
  return c;
}

function confirmReceipt(r, on){
  const st = rState(r);
  if(on){
    setRState(r, {status: "ok", corr: st.corr || null});
    refresh();
    inp().value = "";
    searchInput();
    inp().focus();
    toastReceipt(r);
  }else{
    setRState(r, {status: st.corr ? "corrected" : "pending", corr: st.corr || null});
    refresh();
  }
}

document.addEventListener("keydown", e => {
  if(e.key === "Enter" && document.activeElement === inp()){
    if(currentMatches.length === 1){
      const mr = currentMatches[0].r;
      if(mr.cancelled){ toast(t("search.reversed"), true); return; }
      if(mr.voided){ toast(t("search.void", {by: mr.paidBy.join("+")}), true); return; }
      confirmReceipt(mr, true);
    }else if(currentMatches.length > 1){
      toast(currentMatches.length + t("search.many"), true);
    }
  }
});

let WFILL = {room: "", name: ""};       // what we autofilled — never overwrite manual typing
function watchAutofill(){
  const q = $("#wSN").value.trim();
  const roomF = $("#wRoom"), nameF = $("#wName"), hint = $("#wHint");
  const canRoom = roomF.value === "" || roomF.value === WFILL.room;
  const canName = nameF.value === "" || nameF.value === WFILL.name;
  let r = null;
  if(q && MODEL){
    const ms = findMatches(q);                      // same rules as the main search
    const ex = ms.find(m => m.exact);
    if(ex) r = ex.r;
    else if(ms.length === 1) r = ms[0].r;
  }
  if(r){
    const room = String(effRoom(r));
    const nick = nickFor(room);
    const name = nick || r.guest || "";
    if(canRoom){ roomF.value = room; WFILL.room = room; }
    if(canName && name){ nameF.value = name; WFILL.name = name; }
    hint.textContent = "↳ " + r.dept + " · room " + room + (r.guest ? " · " + r.guest : "") + (nick ? " · “" + nick + "”" : "");
  }else{
    if(canRoom) roomF.value = "";
    if(canName) nameF.value = "";
    WFILL = {room: "", name: ""};
    hint.textContent = "";
  }
}
function addWatch(){
  const sn = $("#wSN").value.trim(), room = $("#wRoom").value.trim(), name = $("#wName").value.trim();
  const err = $("#wErr");
  if(!/^\d+$/.test(room)){ err.textContent = t("w.errRoom"); return; }
  if(sn && !/^\d+$/.test(sn)){ err.textContent = t("w.errSn"); return; }
  if(!sn && !name){ err.textContent = t("w.errNeed"); return; }
  err.textContent = "";
  let snFinal = sn;
  if(sn && MODEL){
    const ms = findMatches(sn);
    const ex = ms.find(m => m.exact);
    const r = ex ? ex.r : (ms.length === 1 ? ms[0].r : null);
    if(r) snFinal = effSN(r);            // typed a suffix — store the full serial
  }
  WATCH.push({sn: snFinal, room, name});
  saveWatch();
  $("#wSN").value = ""; $("#wRoom").value = ""; $("#wName").value = "";
  WFILL = {room: "", name: ""};
  $("#wHint").textContent = "";
  refresh();
  $("#wSN").focus();
}

function nickRow(room, e, showBase){
  const row = el("div","wRow" + (NSEL === room ? " sel" : ""));
  row.append(el("span","room", room));
  const nm = el("span","name");
  if(e && e.nick){
    const nk = el("span","", e.nick); nk.style.color = "#4fd1c5"; nm.append(nk);
    if(showBase && e.guest) nm.append(el("span","base", "  " + e.guest));
  }else{
    nm.append(document.createTextNode(e && e.guest ? e.guest : "—"));
    nm.style.color = "var(--dim)";
  }
  nm.title = (e && e.guest) || "";
  row.append(nm);
  row.onclick = () => { NSEL = room; renderNickPanel(); setTimeout(() => $("#nNick").focus(), 30); };
  return row;
}
function renderNickPanel(){
  const cnt = document.querySelector("#railNick .cnt");
  const n = nickCount();
  cnt.style.display = n ? "" : "none";
  cnt.textContent = n;
  $("#nCnt").textContent = n;

  const q = $("#nSearch").value.trim().toLowerCase();
  const list = $("#nList");
  list.innerHTML = "";
  const rooms = Object.keys(ROOMS).sort((a,b) => (parseInt(a)||0) - (parseInt(b)||0));
  const hits = rooms.filter(room => {
    if(!q) return true;
    const e = ROOMS[room];
    return room.startsWith(q)
        || (e.guest && e.guest.toLowerCase().includes(q))
        || (e.nick && e.nick.toLowerCase().includes(q));
  });
  const CAP = 40;
  for(const room of hits.slice(0, CAP)) list.append(nickRow(room, ROOMS[room], false));
  if(hits.length > CAP) list.append(el("div","nMore", t("n.more", {n: hits.length - CAP})));
  if(!hits.length){
    if(/^\d+$/.test(q)){
      const mk = el("div","wRow");
      mk.append(el("span","room", q));
      const tt = el("span","name", t("n.create"));
      tt.style.color = "var(--faint)";
      mk.append(tt);
      mk.onclick = () => { if(!ROOMS[q]) ROOMS[q] = {guest: null, seen: null}; NSEL = q; renderNickPanel(); setTimeout(() => $("#nNick").focus(), 30); };
      list.append(mk);
    }else{
      list.append(el("div","wEmpty", t("n.noMatch")));
    }
  }
  const body = $("#nBody");
  body.innerHTML = "";
  const nicked = rooms.filter(r => ROOMS[r].nick);
  if(!nicked.length) body.append(el("div","wEmpty", t("n.none")));
  for(const room of nicked) body.append(nickRow(room, ROOMS[room], true));
  renderNickEditor();
}
function saveNick(){
  if(!NSEL) return;
  const v = $("#nNick").value.trim();
  if(!v){ $("#nErr").textContent = t("n.errEmpty"); return; }
  if(!ROOMS[NSEL]) ROOMS[NSEL] = {guest: null, seen: null};
  ROOMS[NSEL].nick = v;
  saveRooms();
  toast(t("n.room") + " " + NSEL + " → “" + v + "”");
  refresh();
}
function removeNick(){
  if(!NSEL || !ROOMS[NSEL]) return;
  delete ROOMS[NSEL].nick;
  saveRooms();
  refresh();
}

/* ---------- data export / import (sync browser file ⇄ installed app) ---------- */
function exportData(){
  const out = {app: "reccheck", exported: new Date().toISOString(), data: {}};
  for(let i = 0; i < localStorage.length; i++){
    const k = localStorage.key(i);
    if(k && k.indexOf("reccheck") === 0) out.data[k] = localStorage.getItem(k);
  }
  const n = Object.keys(out.data).length;
  if(!n){ toast(t("exp.none"), true); return; }
  const blob = new Blob([JSON.stringify(out, null, 1)], {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  const d = new Date();
  a.download = "reccheck-data-" + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + ".json";
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast(t("exp.done", {n}));
}
function importData(file){
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const j = JSON.parse(rd.result);
      const data = (j && j.app === "reccheck" && j.data && typeof j.data === "object" && !Array.isArray(j.data)) ? j.data : null;
      if(!data) throw new Error(t("imp.notours"));
      let n = 0;
      for(const k of Object.keys(data)){
        const v = data[k];
        if(k.indexOf("reccheck") !== 0 || typeof v !== "string") continue;
        try{ JSON.parse(v); }catch(e){ continue; }        // only well-formed entries
        localStorage.setItem(k, v); n++;
      }
      if(!n) throw new Error(t("imp.nodata"));
      loadWatch(); loadRooms();
      if(MODEL){
        STATE = loadState(MODEL.reportDate);
        syncRooms();
        refresh();
      }
      toast(t("imp.done", {n}) + (MODEL ? "" : t("imp.loadhint")));
    }catch(err){
      toast(t("imp.fail") + (err.message || err), true);
    }
  };
  rd.onerror = () => toast(t("imp.noread"), true);
  rd.readAsText(file);
}

/* ---------- print (Greek, corrections only) ---------- */
function pad2(n){ return (n < 10 ? "0" : "") + n; }
function nowStamp(){
  const d = new Date();
  return pad2(d.getDate()) + "/" + pad2(d.getMonth() + 1) + "/" + d.getFullYear() +
         " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
}
function grSplit(rates){
  const order = ["24%","13%","6%","base"];
  const parts = [];
  for(const k of order){
    if(rates[k] === undefined || rates[k] === null) continue;
    parts.push((k === "base" ? "βασικό" : k) + ": " + numToMoney(rates[k]));
  }
  return parts.join("  ·  ");
}
function buildPrintSheet(force){
  const missing = [], corrected = [];
  for(const r of MODEL.receipts){
    if(r.cancelled || r.voided) continue;    // void / settled receipts don't go on paper
    const st = rState(r);
    if(st.status === "missing") missing.push(r);
    if(st.corr) corrected.push({r, st});
  }
  const extras = STATE.extras.slice();
  if(!missing.length && !extras.length && !corrected.length && !force) return null;

  const sheet = $("#printSheet");
  sheet.innerHTML = "";
  const esc = t => { const d = document.createElement("div"); d.textContent = t; return d.innerHTML; };

  let h = `<h1>ΕΛΕΓΧΟΣ ΑΠΟΔΕΙΞΕΩΝ — ΔΙΟΡΘΩΣΕΙΣ</h1>
  <div class="meta">Βραδιά: ${esc(MODEL.reportDate)} &nbsp;·&nbsp; Εκτυπώθηκε: ${nowStamp()} &nbsp;·&nbsp; Kernos Hotel</div>`;

  h += `<h2>1. ΔΕΝ ΠΑΡΕΛΗΦΘΗΣΑΝ — καταχωρημένες στο protel, χωρίς φυσική απόδειξη (${missing.length})</h2>`;
  if(missing.length){
    h += `<table><tr><th>ΤΜΗΜΑ</th><th>ΔΩΜ.</th><th>Σ.Ν.</th><th>ΑΝΑΛΥΣΗ</th><th class="num">ΠΟΣΟ</th></tr>`;
    for(const r of missing){
      h += `<tr><td>${esc(r.dept)}</td><td>${esc(r.roomMain)}</td><td>${esc(r.sn)}</td>
            <td>${esc(grSplit(r.rates))}</td>
            <td class="num">${numToMoney(r.total)}</td></tr>`;
    }
    h += `</table>`;
  }else h += `<div class="none">— καμία —</div>`;

  h += `<h2>2. ΕΚΤΟΣ ΑΝΑΦΟΡΑΣ — αποδείξεις που δεν βρέθηκαν στο protel, χειροκίνητη καταχώρηση (${extras.length})</h2>`;
  if(extras.length){
    h += `<table><tr><th>ΤΜΗΜΑ</th><th>ΔΩΜ.</th><th>Σ.Ν.</th><th class="num">24%</th><th class="num">13%</th><th class="num">ΣΥΝΟΛΟ</th></tr>`;
    for(const x of extras){
      h += `<tr><td>${esc(x.dept === "UNASSIGNED" ? "ΑΤΑΞΙΝΟΜΗΤΟ" : x.dept)}</td><td>${esc(x.room)}</td><td>${esc(x.sn)}</td>
            <td class="num">${numToMoney(x.v24 || 0)}</td><td class="num">${numToMoney(x.v13 || 0)}</td>
            <td class="num">${numToMoney(Math.round(((x.v24 || 0) + (x.v13 || 0)) * 100) / 100)}</td></tr>`;
    }
    h += `</table>`;
  }else h += `<div class="none">— καμία —</div>`;

  h += `<h2>3. ΔΙΟΡΘΩΣΕΙΣ — Σ.Ν. / ΔΩΜΑΤΙΟ / ΠΟΣΑ (${corrected.length})</h2>`;
  if(corrected.length){
    h += `<table><tr><th>ΤΜΗΜΑ</th><th>ΔΩΜΑΤΙΟ</th><th>Σ.Ν.</th><th>ΠΟΣΑ</th><th>ΚΑΤΑΣΤΑΣΗ</th></tr>`;
    const arrow = (oldV, newV) => `<span class="old">${esc(oldV)}</span> → ${esc(newV)}`;
    for(const {r, st} of corrected){
      const roomCell = st.corr.room ? arrow(r.roomMain, st.corr.room) : esc(r.roomMain);
      const snCell   = st.corr.sn ? arrow(r.sn, st.corr.sn) : esc(r.sn);
      const valCell  = (st.corr.v24 !== undefined || st.corr.v13 !== undefined)
        ? arrow(grSplit(r.rates), grSplit({"24%": st.corr.v24, "13%": st.corr.v13}))
        : esc(grSplit(r.rates));
      h += `<tr><td>${esc(r.dept)}</td><td>${roomCell}</td><td>${snCell}</td><td>${valCell}</td>
            <td>${st.status === "ok" ? "ΔΙΟΡΘΩΘΗΚΕ ✓" : "ΕΚΚΡΕΜΕΙ"}</td></tr>`;
    }
    h += `</table>`;
  }else h += `<div class="none">— καμία —</div>`;

  sheet.innerHTML = h;
  return sheet;
}

/* ---------- auto-update (active only inside the desktop app) ---------- */
(async function(){
  if(window.reccheckFiles){
    try{ FB.dir = await window.reccheckFiles.getDir(); }catch(e){}
  }
  applyLang();
  showScreen("menu");
  const ver = $("#appVer");
  if(ver) ver.textContent = "v" + APP_VERSION;
  if(!window.reccheckUpdate) return;             // plain browser — nothing to do
  window.reccheckUpdate.version().then(v => { if(ver && v) ver.textContent = "v" + v; }).catch(() => {});
  window.reccheckUpdate.onReady(info => {
    if(document.getElementById("updateBtn")) return;
    const b = document.createElement("button");
    b.id = "updateBtn";
    b.title = info.full ? t("upd.full", {v: info.version}) : t("upd.ready", {v: info.version});
    b.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none">' +
      '<path d="M12 20V5.5 M5.5 12 L12 5.5 L18.5 12" stroke="#4da6ff" stroke-width="2.8" ' +
      'stroke-linecap="round" stroke-linejoin="round"/></svg>';
    b.onclick = () => {
      b.classList.add("busy");
      window.reccheckUpdate.apply().then(ok => { if(!ok) b.classList.remove("busy"); });
    };
    document.body.append(b);
  });
})();
})();
