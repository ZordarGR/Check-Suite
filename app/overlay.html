<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html,body{margin:0;background:transparent;overflow:hidden;-webkit-user-select:none;pointer-events:none}
#box{opacity:.5;font:600 14px "Segoe UI","Segoe UI Variable",system-ui,sans-serif;padding:10px 12px;text-align:right;
  border-radius:12px}
.t{margin:6px 0;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 2px rgba(0,0,0,.95);line-height:1.35;word-wrap:break-word}
.t.done{color:#4ade80}
.t .b{display:inline-block;width:.55em;height:.55em;border-radius:50%;margin:0 0 0 8px;vertical-align:1px;
  box-shadow:0 1px 2px rgba(0,0,0,.8)}
body.left .t .b{margin:0 8px 0 0}
.b.low{background:#2e9e57}.b.med{background:#e08a2e}.b.high{background:#e04747}
</style>
</head>
<body><div id="box"></div>
<script>
var FONTS = {
  segoe: '"Segoe UI","Segoe UI Variable",system-ui,sans-serif',
  mono: 'Consolas,"Cascadia Mono","Courier New",monospace',
  serif: 'Georgia,"Times New Roman",serif'
};
window.overlayBridge.onData(function(d){
  var cfg = d.cfg || {};
  var pos = cfg.pos || "tr";
  var left = pos === "tl" || pos === "bl";
  document.body.className = left ? "left" : "";
  var box = document.getElementById("box");
  box.style.opacity = (cfg.txt !== undefined ? cfg.txt : 50) / 100;
  box.style.background = "rgba(72,76,84," + ((cfg.bg || 0) / 100) + ")";
  box.style.fontFamily = FONTS[cfg.font] || FONTS.segoe;
  box.style.fontSize = (cfg.size || 14) + "px";
  box.style.fontWeight = cfg.bold === false ? "400" : "600";
  box.style.textAlign = left ? "left" : "right";
  box.innerHTML = "";
  (d.tasks || []).forEach(function(t){
    var div = document.createElement("div");
    div.className = "t" + (t.done ? " done" : "");
    var b = document.createElement("span");
    b.className = "b " + (t.tier || "low");
    var txt = document.createTextNode((t.done ? "✓ " : "") + t.text);
    if(left){ div.appendChild(b); div.appendChild(txt); }
    else{ div.appendChild(txt); div.appendChild(b); }
    box.appendChild(div);
  });
});
</script>
</body>
</html>
