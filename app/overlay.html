<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html,body{margin:0;background:transparent;overflow:hidden;-webkit-user-select:none;pointer-events:none}
#box{opacity:.5;font:600 14px "Segoe UI","Segoe UI Variable",system-ui,sans-serif;padding:10px 12px;text-align:right;
  border-radius:12px}
.t{margin:6px 0;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 2px rgba(0,0,0,.95);line-height:1.35;word-wrap:break-word}
.t.done{color:#4ade80}
.t .b{display:inline-block;width:.55em;height:.55em;border-radius:50%;margin:0 0 0 8px;vertical-align:1px;
  box-shadow:0 1px 2px rgba(0,0,0,.8)}
body.left .t .b{margin:0 8px 0 0}
.b.low{background:#2e9e57}.b.med{background:#e08a2e}.b.high{background:#e04747}
/* highlighter behind the text, tinted like the severity dot */
.t .txt{padding:1px 7px;border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.t.low .txt{background:rgba(46,158,87,.30)}
.t.med .txt{background:rgba(224,138,46,.32)}
.t.high .txt{background:rgba(224,71,71,.34)}
.t.done.low .txt{background:rgba(46,158,87,.12)}
.t.done.med .txt{background:rgba(224,138,46,.12)}
.t.done.high .txt{background:rgba(224,71,71,.12)}
/* interact mode: the window catches the mouse — rows become tickable */
body.interact{pointer-events:auto}
body.interact #box{opacity:1;outline:1.5px solid rgba(240,180,60,.85);outline-offset:-1px;background:rgba(20,24,32,.85) !important}
body.interact .t{cursor:pointer;border-radius:7px;padding:2px 6px;margin:4px -6px}
body.interact .t:hover{background:rgba(255,255,255,.12)}
#hint{display:none;font-size:11px;font-weight:400;color:rgba(255,255,255,.55);margin-top:7px;
  text-shadow:0 1px 3px rgba(0,0,0,.95)}
body.interact #hint{display:block}
/* ---- all tasks finished: green rises from the bottom, a white tick lands, gone ---- */
#celebrate{position:fixed;inset:0;display:none;border-radius:12px;overflow:hidden;pointer-events:none;opacity:1}
#celebrate.on{display:block}
#fill{position:absolute;inset:0;background:linear-gradient(180deg,#43e08c 0%,#1f9d55 100%);
  transform:scaleY(0);transform-origin:50% 100%;transition:transform .70s cubic-bezier(.22,.9,.3,1)}
#celebrate.rise #fill{transform:scaleY(1)}
#tick{position:absolute;left:50%;top:50%;width:52%;height:52%;
  transform:translate(-50%,-50%) scale(.45);opacity:0;
  transition:opacity .28s ease,transform .40s cubic-bezier(.2,1.55,.4,1)}
#celebrate.tick #tick{opacity:1;transform:translate(-50%,-50%) scale(1)}
#tick path{fill:none;stroke:#fff;stroke-width:12;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
#celebrate.fade{opacity:0;transition:opacity .45s ease}
/* While the celebration plays the overlay must never catch the mouse — the last task
   is often ticked from the overlay itself in interact mode, and protel is underneath.
   The class guarantees it locally even before the main process drops interact mode. */
body.celebrating{pointer-events:none !important}
body.celebrating #box{visibility:hidden}
body.celebrating #hint{display:none}
/* asked for again after the night is finished — a short reminder, then away */
#donemsg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  border-radius:12px;background:rgba(24,110,62,.94);color:#fff;text-align:center;
  font:600 14px "Segoe UI","Segoe UI Variable",system-ui,sans-serif;padding:12px 16px;
  opacity:0;transition:opacity .32s ease;pointer-events:none;line-height:1.4}
#donemsg.on{display:flex}
#donemsg.show{opacity:1}
</style>
</head>
<body><div id="box"></div>
<div id="celebrate"><div id="fill"></div>
<svg id="tick" viewBox="0 0 100 100"><path d="M20 53 L41 74 L80 28"/></svg></div>
<div id="donemsg"></div>
<script>
var FONTS = {
  segoe: '"Segoe UI","Segoe UI Variable",system-ui,sans-serif',
  mono: 'Consolas,"Cascadia Mono","Courier New",monospace',
  serif: 'Georgia,"Times New Roman",serif'
};
var LAST = null;
function paint(d){
  var cfg = d.cfg || {};
  var pos = cfg.pos || "tr";
  var left = pos === "tl" || pos === "bl";
  document.body.classList.toggle("left", left);
  var box = document.getElementById("box");
  box.style.opacity = document.body.classList.contains("interact") ? 1 : (cfg.txt !== undefined ? cfg.txt : 50) / 100;
  box.style.background = "rgba(72,76,84," + ((cfg.bg || 0) / 100) + ")";
  box.style.fontFamily = FONTS[cfg.font] || FONTS.segoe;
  box.style.fontSize = (cfg.size || 14) + "px";
  box.style.fontWeight = cfg.bold === false ? "400" : "600";
  box.style.textAlign = left ? "left" : "right";
  box.innerHTML = "";
  (d.tasks || []).forEach(function(t){
    var div = document.createElement("div");
    div.className = "t " + (t.tier || "low") + (t.done ? " done" : "");
    div.dataset.id = t.id || "";
    var b = document.createElement("span");
    b.className = "b " + (t.tier || "low");
    var txt = document.createElement("span");
    txt.className = "txt";
    txt.textContent = (t.done ? "✓ " : "") + t.text;
    if(left){ div.appendChild(b); div.appendChild(txt); }
    else{ div.appendChild(txt); div.appendChild(b); }
    div.addEventListener("click", function(){
      if(document.body.classList.contains("interact") && t.id) window.overlayBridge.tick(t.id);
    });
    box.appendChild(div);
  });
  var hint = document.createElement("div");
  hint.id = "hint";
  hint.textContent = (d.lang === "gr") ? "κλικ = ✓ · Esc = έξοδος" : "click = ✓ · Esc = leave";
  box.appendChild(hint);
}
/* Celebrate only the MOMENT the last task is ticked — not every repaint, and not
   when the overlay is switched on to a list that was already finished. */
var SEEN_INCOMPLETE = false, CELEBRATED = false;
function allDone(d){
  var ts = (d && d.tasks) || [];
  if(!ts.length) return false;                 // an empty list has not been "finished"
  for(var i = 0; i < ts.length; i++) if(!ts[i].done) return false;
  return true;
}
function celebrate(){
  var c = document.getElementById("celebrate");
  document.body.classList.add("celebrating");        // click-through from this instant
  try{ window.overlayBridge.busy(true); }catch(e){}       // hold the window open until we finish
  try{ window.overlayBridge.exitInteract(); }catch(e){}   // and drop interact mode for real
  c.className = "on";
  // let the interact exit resize the window before the fill starts, or it jumps mid-rise
  setTimeout(function(){ c.className = "on rise"; }, 90);          // green rises
  setTimeout(function(){ c.className = "on rise tick"; }, 800);    // tick lands
  setTimeout(function(){ c.className = "on rise tick fade"; }, 1900);
  setTimeout(function(){
    c.className = "";
    document.body.classList.remove("celebrating");
    try{ window.overlayBridge.complete(); }catch(e){}   // main hides the window for the night
  }, 2400);
}
window.overlayBridge.onData(function(d){
  LAST = d;
  paint(d);
  if(!allDone(d)){ SEEN_INCOMPLETE = true; CELEBRATED = false; return; }
  if(CELEBRATED) return;
  CELEBRATED = true;
  /* Being put away is a STATE — it follows from the list being complete, however we got
     there. The animation is the separate thing that needs a transition to be worth
     playing. Tying both to SEEN_INCOMPLETE meant a client that started up (or updated)
     on an already-finished night never put itself away, so the reminder was unreachable. */
  if(SEEN_INCOMPLETE) celebrate();
  else try{ window.overlayBridge.complete(); }catch(e){}
});
window.overlayBridge.onMode(function(m){
  document.body.classList.toggle("interact", !!(m && m.interact));
  if(LAST) paint(LAST);
});
window.overlayBridge.onDoneMsg(function(){
  var c = document.getElementById("donemsg");
  document.body.classList.add("celebrating");          // click-through while it shows
  try{ window.overlayBridge.busy(true); }catch(e){}
  c.textContent = (LAST && LAST.lang === "gr")
    ? "✓ Όλες οι εργασίες ολοκληρώθηκαν απόψε"
    : "✓ All tasks are done for tonight";
  c.className = "on";
  requestAnimationFrame(function(){ c.className = "on show"; });
  setTimeout(function(){ c.className = "on"; }, 2100);
  setTimeout(function(){
    c.className = "";
    document.body.classList.remove("celebrating");
    try{ window.overlayBridge.complete(); }catch(e){}   // back out of sight
  }, 2500);
});

window.addEventListener("keydown", function(e){
  if(e.key === "Escape") window.overlayBridge.exitInteract();
});
</script>
</body>
</html>
