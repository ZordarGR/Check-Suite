<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
/* The keyboard has no Caps Lock light and this machine draws nothing, so this does.
   Dead centre, 35% opacity, 1.5 s, then gone: nothing sits on screen while it does not
   matter, and at that opacity protel stays readable straight through it.
   The glyph is the one the laptop OSDs use — a capital A, struck through for off.
   (There is no standardised OSD icon; ISO/IEC 9995-7's caps symbol is the keycap mark
   U+21EA, not this. The A pair is what Windows and the OEM utilities actually draw.) */
html,body{margin:0;background:transparent;overflow:hidden;pointer-events:none;
  -webkit-user-select:none}
#osd{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.94);
  opacity:0;transition:opacity .14s ease,transform .20s cubic-bezier(.2,1.45,.4,1)}
#osd.show{opacity:.35;transform:translate(-50%,-50%) scale(1)}
#osd.out{opacity:0;transition:opacity .38s ease}
#slash{opacity:0}
body.off #slash{opacity:1}
</style>
</head>
<body class="off">
<svg id="osd" width="150" height="150" viewBox="0 0 150 150">
  <!-- Outlined, with no panel behind it. A filled panel at 35% turns into a grey block
       over protel's light screen: it hides the row underneath and washes the letter out.
       Dark fill + white outline reads solid on protel and outlined on a dark window,
       and either way the text beneath it stays readable. Verified in Chromium on both. -->
  <path d="M75 20 L118 122 L100 122 L90.4 99 L59.6 99 L50 122 L32 122 Z
           M66.2 83 L83.8 83 L75 62 Z"
        fill="#101216" fill-rule="evenodd" stroke="#ffffff" stroke-width="9"
        stroke-linejoin="round" paint-order="stroke"/>
  <!-- off: the same glyph struck through, the way the laptop OSDs draw it -->
  <g id="slash">
    <line x1="22" y1="128" x2="128" y2="22" stroke="#ffffff" stroke-width="17" stroke-linecap="round"/>
    <line x1="22" y1="128" x2="128" y2="22" stroke="#101216" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
<script>
(function(){
  var osd = document.getElementById("osd");
  var hideT = 0, goneT = 0;
  /* Each change cancels the one before it: hammering the key must not queue a backlog
     of icons that keep reappearing after the keyboard has gone quiet. */
  window.capsBridge.onFlash(function(s){
    var on = !!(s && s.on);
    document.body.className = on ? "on" : "off";
    clearTimeout(hideT); clearTimeout(goneT);
    osd.classList.remove("out");
    osd.classList.remove("show");
    void osd.getBoundingClientRect();          /* restart the entrance even mid-flight */
    osd.classList.add("show");
    hideT = setTimeout(function(){
      osd.classList.remove("show");
      osd.classList.add("out");
      /* tell the main process only once the fade has finished, or the window is hidden
         with the icon still painted and the next change starts half-faded */
      goneT = setTimeout(function(){
        osd.classList.remove("out");
        try{ window.capsBridge.gone(); }catch(e){}
      }, 420);
    }, 1500);
  });
})();
</script>
</body>
</html>
