     is a line — it interrupts nothing. Nothing came back is the only case that is genuinely
     ordinary, and it is the only one that says so. */
  const quiet = (m) => { say.textContent = m; LIVE_SIG = ""; };
  if(!p){ quiet(t('live_idle')); return "empty"; }
  if(p.err){ quiet(t('live_err') + p.err); return "err"; }
  if(!p.rows.length){ quiet(t('live_none')); return "empty"; }
  if(!isInhouseTitle(p.title)){ quiet(t('live_wrong', p.title || '?')); return "wrong"; }
  const biz = inhouseDate(p.title);
  /* The caption is the only place the live path can learn the night from. Filing 250
     stays under a guessed date is exactly the kind of helpful deduction that put 83
     departures on his panel, so it does not happen: it refuses and says why. */
  if(!biz){ quiet(t('live_nodate', p.title || '?')); return "nodate"; }
  const rate = inhouseToRate(p.rows, biz);
  if(!rate.count){ quiet(t('live_none')); return "none"; }
  /* Nothing has moved in protel since the last tick. Writing the same ledger again and
     redrawing the page under him twenty times a minute is not faithfulness, it is a
     fault. But it used to return in SILENCE, and it is the only refusal in this function
     that did — every other one says why. With all four lists sharing one line, silence
     here means the last thing he sees is whatever other list wrote there, which is how
     opening the in-house list showed him a departure report. So it says so and still
     writes nothing. */
  /* A READ THE HELPER ITSELF CALLS INCOMPLETE MUST NOT BE WRITTEN.
     ReadTagged abandons the list at READ_BUDGET_MS and says `cut-short`. saveMoves and
     detectMoves both reason from ABSENCE — a room not in tonight's list is a room the
     guest has left — so a list missing its tail reads as a hundred people checking out at
     once. That is the phantom-departure failure, arriving unattended every five seconds.
     He can still force one by pressing the button, where the "stopped early" line tells
     him what he is looking at. */
  if(auto && p.done && p.done.cut){ quiet(t('live_rcut', t('rpt_IH'), p.title || '?')); return "cut"; }
  const sig = p.title + "\u0000" + p.rows.length + "\u0000" + p.rows.map(r => r.join("\u0001")).join("\u0002");
  if(auto && sig === LIVE_SIG){ say.textContent = t('live_same', rate.count, biz || '?'); return "ok"; }
  RATE = rate;
  const saved = saveMoves(rate);
  /* A move can only be written onto a stay that exists, and the in-house list is what
     creates them. So the last moves capture is offered again here — the applied set makes
     a second attempt on one already written free, and a move whose stay is still unknown
     simply waits for the next census. */
  try{ if(MOVES_ROWS) recordMoves(MOVES_ROWS, MOVES_NIGHT); }catch(e){}
  const named = window.__rcLiveNames ? window.__rcLiveNames(rate) : 0;
  /* Only a read HE asked for clears these. They hold decisions he made by clicking —
     which adjoining pair to treat as one, which prompt he dismissed — and wiping them
     from a five-second timer would undo his answer and put the prompt back on top of the
     audit he is in the middle of. */
  if(!auto){ PAIR_OVERRIDE = null; ADJ_OPEN_OVERRIDE = null; }
  el('fn-rate').textContent = p.title || biz;
  showMoveSave(saved);
  const d = p.done || {};
  say.textContent = t('live_got', d.got || p.rows.length, d.rows || p.rows.length,
                      rate.count, (saved && saved.res) || 0, biz || '?', d.msgs || 0, d.ms || 0)
                  + (d.cut ? t('live_cut') : '')
                  + (rate.cancelled ? t('live_cancel', rate.cancelled) : '')
                  + (named ? t('live_named', named) : '');
  /* STAMPED LAST, not first. It used to be set before saveMoves, __rcLiveNames and the
     line itself — none of which is inside a try, and whose caller swallows everything
     with a bare catch. One throw anywhere in there and the line was never written, the
     error vanished, and every later capture of the same list hit the guard above and
     returned: the in-house list could not report again for the rest of the session. The
     same trap applyReport documents at RPT_SIG and avoids. */
  LIVE_SIG = sig;
  /* the census writes the ledger too, so the panel is stale until told */
  LEDGER_TICK++;
  try{ if(window.__rcMovesChanged) window.__rcMovesChanged(); }catch(e){}
  render();
  return "ok";
}
async function loadRate(file){clearErr();el('fn-rate').textContent=file?file.name:'';el('mv-rate').textContent='';if(!file)return;try{const pages=await readOxps(file);const r=parseRate(pages);if(!r.count){showErr(t('err_norooms'));return;}RATE=r;showMoveSave(saveMoves(r));PAIR_OVERRIDE=null;ADJ_OPEN_OVERRIDE=null;el('slot-rate').classList.add('loaded');render();}catch(e){showErr(e.message==='notxps'?t('err_notxps'):t('err_read')+e.message);}}
async function loadTax(file){clearErr();el('fn-tax').textContent=file?file.name:'';if(!file)return;try{const pages=await readOxps(file);const tokens=pagesToTokens(pages);const r=parseTax(tokens);if(!r.totalRooms){showErr(t('err_norooms'));return;}TAX=r;PAIR_OVERRIDE=null;ADJ_OPEN_OVERRIDE=null;ingestTax(r);if(r.fileDate)EXPANDED.add(r.fileDate);el('slot-tax').classList.add('loaded');render();}catch(e){showErr(e.message==='notxps'?t('err_notxps'):t('err_read')+e.message);}}
/* Only where there is a helper to ask. In a browser, or on a machine without it, the row
   is not there at all rather than there and dead. */
/* The button that used to sit here is gone, on his word: "when im asking for auto-scanning
   i am thinking of the button which prompts the tool to retrieve the inhouse list to be
   out since that was an expirimental way of seeing if this would work". It was the
   experiment that proved the read worked at all; the helper now captures every list the
   moment protel opens it, so there is nothing left to press.

   The LINE stays, and is the only thing on screen that says the feeding is alive: it
   reports each capture as it lands. */
let LIVE_OK = false;
try{
  if(window.reccheckShortcuts && window.reccheckShortcuts.listFile) LIVE_OK = true;
}catch(e){}
el('file-rate').addEventListener('change',e=>loadRate(e.target.files[0]));
el('file-tax').addEventListener('change',e=>loadTax(e.target.files[0]));
[['slot-rate','file-rate',loadRate],['slot-tax','file-tax',loadTax]].forEach(([sid,fid,fn])=>{const s=el(sid);['dragenter','dragover'].forEach(ev=>s.addEventListener(ev,e=>{e.preventDefault();s.classList.add('over');}));['dragleave','drop'].forEach(ev=>s.addEventListener(ev,e=>{e.preventDefault();s.classList.remove('over');}));s.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f){el(fid).files=e.dataTransfer.files;fn(f);}});});

/* slots feed from the shared reports-folder picker when the app provides one */
[['slot-rate',loadRate],['slot-tax',loadTax]].forEach(([sid,fn])=>{
  el(sid).addEventListener('click',e=>{
    if(window.rcPickReport && window.rcPickReport(f=>fn(f))) e.preventDefault();
  });
});
el('taxBack').addEventListener('click',()=>{ if(window.rcShowAudit) window.rcShowAudit(); });
window.__taSetLang=function(l){ if(l!==LANG) setLang(l); el('taxBack').textContent='← '+(l==='el'?'ΕΛΕΓΧΟΣ':'AUDIT'); };
/* ---- legacy mode: whether the Rate Check slot is on screen ----
   Owned by the settings toggle in the other half, which writes the key and calls this so
   the change lands without a reload. Read at boot too, because this half is a separate
   scope that starts on its own. Hiding it is all this does — no file, no ledger and no
   parsed list is touched, so ticking it again restores the screen exactly. */
function applyLegacy(on){
  const s = el('slot-rate');
  if(s) s.style.display = on ? '' : 'none';
  /* His instruction, 04/09: legacy is the INITIAL STATE of all the tools — both checks
     fed from xps files, not from protel. So legacy also decides whether the live read is
     on offer at all, and it is the inverse of the slot: files in, protel out. The button
     still needs a helper to talk to, so both have to be true. */
  const lr = el('liveRow');
  if(lr) lr.style.display = (!on && LIVE_OK) ? 'flex' : 'none';
}
function legacyOn(){
  try{ return localStorage.getItem('reccheck_legacy') !== '0'; }catch(e){ return true; }
}
window.__taLegacy = function(on){
  applyLegacy(!!on);
  /* Switching legacy off while standing on the Tax Check should start reading, not wait
     for him to leave and come back. */
  try{ if(on) liveStop(); else liveEnsure(); }catch(e){}
};
/* It runs for the life of the app now, not while a screen is open, so this only makes
   sure it is running — arriving at the Tax Check is no longer what starts it. */
let TAX_SCREEN = "";
window.__taScreen = function(which){
  TAX_SCREEN = String(which || "");
  try{ liveEnsure(); }catch(e){}
};

/* time safeguard: warn when a loaded report is for a past working night. Separate scope
   from the audit half, so the 03:30 boundary is repeated here rather than shared. */
function bnk(){const d=new Date();if(d.getHours()<3||(d.getHours()===3&&d.getMinutes()<30))d.setDate(d.getDate()-1);return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();}
function timeGuardHTML(){
  let h='';const B=bnk();
  if(RATE&&RATE.dateKey&&RATE.dateKey<B)h+=`<div class="banner warn">⚠ ${t('tw_pastrate',dfmt(RATE.dateKey),dfmt(B))}</div>`;
  if(TAX&&TAX.dateKey&&TAX.dateKey<B)h+=`<div class="banner warn">⚠ ${t('tw_pasttax',dfmt(TAX.dateKey),dfmt(B))}</div>`;
  return h;
}
const __renderCore=render;
render=function(){__renderCore();const g=timeGuardHTML();if(g)el('banner').insertAdjacentHTML('afterbegin',g);};
window.__taSimulate=function(rk,tk){RATE=rk?{kind:'rate',dateKey:rk,bizDate:dfmt(rk),rooms:{},count:0}:null;TAX=tk?{kind:'tax',dateKey:tk,fileDate:dfmt(tk),rooms:{},totalRooms:0,totalArrangements:0}:null;render();};

/* ============ boot ============ */
function pruneZeroMem(){const mem=loadMem();let ch=false;for(const room of Object.keys(mem)){const rec=mem[room];for(const d of Object.keys(rec)){const e=rec[d];if(((e.arr||0)+(e.auto||0)+(e.man||0))===0){delete rec[d];ch=true;}}if(!Object.keys(rec).length){delete mem[room];ch=true;}}if(ch)saveMem(mem);}
(function boot(){liveEnsure();el('taxBack').textContent='← '+(LANG==='el'?'ΕΛΕΓΧΟΣ':'AUDIT');applyLegacy(legacyOn());pruneZeroMem();const mem=loadMem();const ds=recentDates(mem,7);if(ds.length)EXPANDED.add(ds[0]);applyStatic();renderMemory();el('memsec').style.display=ds.length?'block':'none';})();
})();
</script>
