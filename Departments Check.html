<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC CHECK — Nightly Receipt Audit</title>
<style>
:root{
  --bg:#0a0e14;
  --bg2:#0f1520;
  --panel:#131b29;
  --panel2:#182234;
  --line:#233047;
  --txt:#dbe4f0;
  --dim:#9fb0c9;
  --faint:#7484a0;
  --amber:#f5b453;
  --amber-dim:#8a6528;
  --green:#4ade80;
  --green-dim:#1d5c36;
  --red:#f87171;
  --red-dim:#6b2323;
  --mono:"Consolas","Cascadia Mono","Courier New",monospace;
  --sans:"Segoe UI","Segoe UI Variable",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px}
body{min-height:100vh;background:
  radial-gradient(1200px 500px at 70% -10%, rgba(245,180,83,.05), transparent 60%),
  radial-gradient(900px 600px at -10% 110%, rgba(74,222,128,.04), transparent 55%),
  var(--bg)}
::selection{background:var(--amber);color:#000}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:80;background:rgba(10,14,20,.92);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:14px}
header h1{font-size:16px;letter-spacing:.18em;font-weight:600;color:var(--amber);font-family:var(--mono);white-space:nowrap;cursor:pointer}
#reportMeta.clickable{cursor:pointer}
header h1 span{color:var(--dim);font-weight:400}
#reportMeta{font-family:var(--mono);font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#reportMeta b{color:var(--txt);font-weight:600}
header .spacer{flex:1}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:7px 14px;border-radius:8px;
  cursor:pointer;font-family:var(--sans);font-size:13.5px;transition:border-color .15s, background .15s;white-space:nowrap}
.btn:hover{border-color:var(--amber);background:#1c2942}
.btn.amber{border-color:var(--amber-dim);color:var(--amber)}
.btn.small{padding:4px 10px;font-size:12.5px;border-radius:6px}
.kebab{position:relative}
.kebab>button{font-size:18px;line-height:1;padding:6px 11px}
.kebab-menu{display:none;position:absolute;right:0;top:110%;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;min-width:220px;box-shadow:0 12px 32px rgba(0,0,0,.55);overflow:hidden}
.kebab-menu.open{display:block}
.kebab-menu button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--txt);
  padding:11px 15px;font-size:13.5px;cursor:pointer}
.kebab-menu button:hover{background:var(--panel2)}
.kebab-menu button.danger{color:var(--red)}

/* ---------- landing: menu + files ---------- */
#landing{max-width:900px;margin:7vh auto;padding:0 20px;text-align:center}
#homeLogo{cursor:pointer}
#menuScreen{margin-top:10px}
#homeBar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:640px;margin:0 auto 20px;position:relative;z-index:60}

/* ---------- the home screen fits the window, whatever is on it ----------
   It keeps growing: menu categories come and go, the checklist is as long as the night
   needs, and the screen it runs on is whatever the desk has. A fixed 7vh margin and a
   list free to run past the fold meant the one button that starts the audit could end up
   below it.

   The chain has to be definite the whole way down or nothing shrinks: min-height gives a
   flex child nothing to shrink AGAINST, so the column grows and the overflow just moves
   somewhere else. So the body itself becomes the column — header, then the page — and
   every link from there down is flex with min-height:0. Only two of the body's children
   are ever in flow on this screen; the rest are display:none or fixed.

   Everything above the checklist keeps its natural size. The checklist is the only part
   that can be arbitrarily long, so it is the only part that gives: the card shrinks and
   the list scrolls inside it. A short list on a big screen looks exactly as it always
   did. Scoped by a body class — the audit and files screens have their own shapes. */
body.onMenu{display:flex;flex-direction:column;height:100vh}
body.onMenu>header{flex:0 0 auto}
body.onMenu #landing{
  flex:1 1 auto;
  min-height:0;
  width:100%;
  margin:0 auto;
  padding:clamp(10px,4vh,52px) 20px clamp(12px,2.5vh,30px);
  display:flex;
  flex-direction:column;
}
body.onMenu #landing .logo{font-size:clamp(23px,4.4vh,34px);margin-bottom:clamp(2px,.7vh,6px)}
body.onMenu #landing p.sub{margin-bottom:clamp(8px,3vh,34px)}
body.onMenu #menuScreen{
  margin-top:clamp(2px,.8vh,10px);
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
}
/* width:100% because auto side margins stop a flex item stretching to the column, and
   both of these are centred with margin:0 auto. Without it the bar and the card shrink
   to their contents and stop lining up with the button below them — and the bar, being
   only as wide as its buttons, would never wrap however many categories it grew. */
body.onMenu #homeBar{margin-bottom:clamp(7px,1.8vh,20px);flex:0 0 auto;width:100%}
body.onMenu #welcomeLine{margin:clamp(2px,.4vh,4px) 0 clamp(6px,1.6vh,18px);flex:0 0 auto}
/* 0 1 auto: its natural height when the list is short, shrinking when there is not room */
body.onMenu #checklist{flex:0 1 auto;min-height:0;width:100%;display:flex;flex-direction:column;
  margin-bottom:clamp(8px,1.8vh,22px);padding:clamp(10px,1.6vh,16px) 18px}
body.onMenu #clHead,body.onMenu #clAddWrap,body.onMenu #clHelp{flex:0 0 auto}
body.onMenu #clList{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  scrollbar-width:thin;scrollbar-color:var(--line) transparent}
body.onMenu #clList::-webkit-scrollbar{width:8px}
body.onMenu #clList::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
/* A list that scrolls has to SAY it scrolls, or the tasks below the fold are simply
   gone as far as anyone at the desk is concerned — which is worse than a long page.
   The bottom row fades out while there is more under it, and stops fading at the end. */
body.onMenu #clList.moreBelow{
  -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 30px),transparent);
          mask-image:linear-gradient(to bottom,#000 calc(100% - 30px),transparent);
}
/* the card's padding shrinks on a short window, so the button parked in the gutter
   follows it rather than drifting off the row it belongs to */
body.onMenu #userBtn{top:clamp(10px,1.6vh,16px)}
/* the one button that starts the night never gives up its place */
body.onMenu #auditBtn,body.onMenu #alertsBtn,body.onMenu #statusBtn{flex:0 0 auto}

/* ---------- and it uses the width it has ----------
   Fitting the window is not the same as showing everything at once: a 640px strip down
   the middle of a 1600px screen still hid twenty tasks behind a scroll. The list now
   flows into as many columns as the room allows — down one column, then across, the way
   a list is read — and the block widens to match. One column is exactly the old 640px
   layout, so a short list on any screen looks untouched.

   --homeW and --clRows are set by layoutChecklist() from the space actually measured;
   the CSS only says what to do with them. */
body.onMenu{--homeW:640px}
body.onMenu #landing{max-width:min(1560px,96vw)}
body.onMenu #homeBar,body.onMenu #checklist,body.onMenu #auditBtn,body.onMenu #alertsBtn,body.onMenu #statusBtn{max-width:var(--homeW)}
body.onMenu #clList{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;
  grid-template-rows:repeat(var(--clRows,999),auto);column-gap:22px;align-content:start}
.mcat{position:relative}
.mcatBtn{background:var(--panel);border:1px solid var(--line);border-radius:9px;color:var(--dim);cursor:pointer;
  font-family:var(--mono);font-size:12px;letter-spacing:.1em;padding:8px 14px;transition:border-color .15s,color .15s}
.mcat:hover .mcatBtn,.mcat.open .mcatBtn{border-color:var(--amber);color:var(--amber)}
.msub{display:none;position:absolute;left:0;top:100%;padding-top:6px;min-width:270px;z-index:61}
.mcat:hover .msub,.mcat.open .msub{display:block}
.msub::before{content:"";position:absolute;inset:6px 0 0;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.55);z-index:-1}
.msubItem{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;background:none;
  border:none;color:var(--txt);padding:10px 14px;cursor:pointer;border-radius:10px}
.msubItem:hover{background:var(--panel2)}
.msubItem .mLabel{font-family:var(--mono);letter-spacing:.1em;font-size:12.5px;font-weight:600}
.msubItem .mSub{font-size:11px;color:var(--faint);max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#welcomeLine{color:var(--dim);font-size:13.5px;margin:4px 0 18px}
.scIntro{color:var(--dim);font-size:12.5px;line-height:1.5;margin:2px 0 14px}
.scRow{border:1px solid var(--line);border-radius:9px;padding:12px 13px;margin-top:12px;background:var(--panel2)}
.scHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
.scName{font-family:var(--mono);letter-spacing:.09em;font-size:12.5px;font-weight:600;color:var(--amber)}
.scBind{width:100%;font-family:var(--mono);letter-spacing:.08em}
.scWhy{color:var(--faint);font-size:11.5px;line-height:1.55;margin:9px 0 0}
.scWarn:empty{display:none}
.scKeys{display:inline-block;margin-top:5px;font-family:var(--mono);font-size:11px;color:var(--amber)}
#scDiag{margin:10px 0 0;padding:10px 12px;max-height:230px;overflow:auto;background:#0b1017;
  border:1px solid var(--line);border-radius:8px;font-family:var(--mono);font-size:10.5px;
  line-height:1.5;color:#b9c6d8;white-space:pre-wrap;overflow-wrap:anywhere}

#checklist{position:relative;max-width:640px;margin:0 auto 22px;background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:16px 18px;text-align:left}
#clHead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
/* "Switch user" sits in the gutter to the RIGHT of the card, level with the overlay
   button. #landing is 900px and the card 640px, so there is ~130px of room each side.
   Below that the gutter disappears and it falls back into the header row. */
#userBtn{position:absolute;left:100%;top:16px;margin-left:14px;max-width:118px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:1000px){ #userBtn{position:static;margin-left:0;max-width:none} }
#userTip{position:fixed;z-index:120;max-width:250px;background:var(--panel2);color:var(--txt);
  border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:11.5px;line-height:1.5;
  box-shadow:0 8px 24px rgba(0,0,0,.5);opacity:0;transition:opacity .18s ease;pointer-events:none}
#userTip.on{opacity:1}
.upRow{display:flex;align-items:center;gap:8px;padding:9px 10px;border-top:1px solid var(--line);cursor:pointer}
.upRow:first-of-type{border-top:none}
.upRow:hover{background:var(--panel2)}
.upRow.sel{color:var(--amber)}
.upName{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upTick{font-family:var(--mono);font-size:12px}
#clTitle{font-family:var(--mono);letter-spacing:.14em;font-size:13px;color:var(--amber)}
#clCount{font-family:var(--mono);font-size:12px;color:var(--faint);flex:1}
#clAddWrap{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
#clText{flex:1;min-width:180px;background:var(--bg2);border:1.5px solid var(--line);border-radius:9px;color:var(--txt);
  font-size:14px;padding:9px 12px;outline:none}
#clText:focus{border-color:var(--amber)}
#clSev{position:relative}
#clSevBtn{display:flex;align-items:center;gap:7px;white-space:nowrap}
#clSevBtn .sv{font-weight:700}
#clSevMenu{position:absolute;top:calc(100% + 6px);right:0;min-width:150px;background:var(--bg2);border:1.5px solid var(--line);
  border-radius:9px;display:none;z-index:60;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.5)}
#clSevMenu.open{display:block}
#clSevMenu button{display:block;width:100%;background:none;border:none;text-align:left;padding:9px 14px;cursor:pointer;
  font-family:inherit;font-size:13px;font-weight:700;letter-spacing:.02em}
#clSevMenu button:hover{background:rgba(255,255,255,.07)}
#clSevMenu button.sel{background:rgba(255,255,255,.04)}
#clSevMenu button .chk{float:right;color:var(--faint);font-weight:400}
.sv-low{color:#2e9e57}.sv-med{color:#e08a2e}.sv-high{color:#e04747}
.clRow{display:flex;align-items:center;gap:11px;padding:10px 6px;border-top:1px solid rgba(35,48,71,.55);font-size:15px}
.clRow:first-child{border-top:none}
.clRow .tier{width:11px;height:11px;border-radius:50%;flex:0 0 auto;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.clRow.tl .tier{background:#2e9e57}.clRow.tm .tier{background:#e08a2e}.clRow.th .tier{background:#e04747}
.clRow input[type=checkbox]{width:19px;height:19px;accent-color:var(--green);cursor:pointer;flex:0 0 auto}
.clRow .txt{flex:1;line-height:1.4;overflow-wrap:anywhere}
.clRow.done .txt{color:var(--faint);text-decoration:line-through}
.clRow.th:not(.done) .txt{color:#ffd7d7;font-weight:600}
.clRow .clBtns{display:none;gap:6px}
#checklist.editing .clRow .clBtns{display:flex}
.clRow .clBtns button{background:var(--panel2);border:1px solid var(--line);border-radius:7px;color:var(--dim);cursor:pointer;
  font-size:12.5px;padding:4px 9px}
.clRow .clBtns button:hover{border-color:var(--amber);color:var(--amber)}
.clRow .clBtns button.clMove{padding:2px 7px;font-size:10px;line-height:1.5}
.clRow .clBtns button.clMove:disabled{opacity:.28;cursor:default;border-color:var(--line);color:var(--dim)}
.clEmpty{color:var(--faint);font-size:13px;font-family:var(--mono);padding:14px 4px}
#auditBtn,#alertsBtn,#statusBtn{max-width:640px;margin:0 auto;width:100%}
#alertsBtn,#statusBtn{margin-top:8px}
/* STATUS: what protel has told the tool. Every rule scoped — the bare-selector leak is a
   landmine here (see the notes). The tables want more room than the menu column. */
#statusListScreen .mNav{max-width:960px}
#statusListScreen .stNote{font-size:12px;color:var(--faint);padding:4px 2px}
#statusListScreen .stNote.warn{color:#fbbf24}
#statusListScreen .stBlock{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel)}
#statusListScreen .stHead{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-bottom:6px}
#statusListScreen .stName{font-family:var(--mono);letter-spacing:.12em;font-size:13px;font-weight:600;color:var(--amber)}
#statusListScreen .stMeta{font-size:12px;color:var(--faint)}
#statusListScreen .stState{font-size:12px}
#statusListScreen .stState.good{color:#4ade80}
#statusListScreen .stState.bad{color:#f87171}
#statusListScreen .stWrap{overflow-x:auto;max-height:520px;overflow-y:auto}
#statusListScreen table.st{width:100%;border-collapse:collapse;font-size:12px}
#statusListScreen table.st th,#statusListScreen table.st td{text-align:left;padding:3px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
#statusListScreen table.st th{color:var(--faint);font-weight:500;position:sticky;top:0;background:var(--panel)}
#statusListScreen table.st td.mIn{color:#4ade80}
#statusListScreen table.st td.mOut{color:#f87171}
#statusListScreen table.st td.mStay{color:#fbbf24}
#statusListScreen table.st td.mNone{color:var(--faint)}
#statusListScreen table.st tr.gone td{opacity:.6}
#auditScreen{margin-top:60px}
.mNav{display:flex;flex-direction:column;gap:10px;max-width:430px;margin:0 auto}
.mItem{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;padding:15px 20px;cursor:pointer;color:var(--txt);
  transition:border-color .15s, background .15s, transform .12s}
.mItem:hover{border-color:var(--amber);background:var(--panel2);transform:translateX(4px)}
.mItem .mLabel{font-family:var(--mono);letter-spacing:.16em;font-size:15px;font-weight:600}
.mItem .mSub{font-size:12px;color:var(--faint);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mItem.primary{border-color:var(--amber-dim)}
.mItem.primary .mLabel{color:var(--amber)}
#filesScreen{text-align:left;margin-top:26px}
#fbHead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
#fbDir{font-family:var(--mono);font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:1}
#fbTool{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--amber);border:1px solid var(--amber-dim);
  border-radius:6px;padding:3px 8px;white-space:nowrap;flex-shrink:0}
.vbtn.active{border-color:var(--amber);color:var(--amber)}
#fbList.list{display:flex;flex-direction:column;gap:6px}
#fbList.list .fbItem{display:flex;align-items:center;gap:12px;padding:10px 14px}
#fbList.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:10px}
#fbList.tiles .fbItem{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 12px;text-align:center}
.fbItem{background:var(--panel);border:1px solid var(--line);border-radius:12px;cursor:pointer;transition:border-color .12s, background .12s}
.fbItem:hover{border-color:var(--amber);background:var(--panel2)}
.fbItem.open{border-color:var(--amber-dim);background:#1a2438}
.fbIcon{font-size:20px;color:var(--amber)}
.fbItem.dir .fbIcon,.fbItem.up .fbIcon{color:var(--dim)}
.fbItem.dir:hover .fbIcon{color:var(--amber)}
.fbTonight{display:inline-block;margin-left:8px;background:var(--green-dim);color:var(--green);border-radius:999px;
  padding:1px 8px;font-size:10.5px;letter-spacing:.06em;vertical-align:1px}
#fbList.tiles .fbIcon{font-size:34px}
.fbMeta{min-width:0}
.fbName{font-family:var(--mono);font-size:13.5px;color:var(--txt);word-break:break-all}
.fbSub{font-size:11.5px;color:var(--faint);font-family:var(--mono);margin-top:2px}
#fbEmpty{color:var(--faint);font-family:var(--mono);font-size:12.5px;padding:30px;text-align:center;border:1.5px dashed var(--line);border-radius:12px}
#staleChip{display:none;background:#4a3a12;border:1px solid var(--amber-dim);color:var(--amber);border-radius:999px;
  padding:3px 10px;font-size:11.5px;font-family:var(--mono);cursor:pointer;white-space:nowrap}
/* An alert nobody has looked at yet pulses. Red, and on the button itself, because the
   home screen is the one place he passes through every time. It stops the moment the
   list is opened — read is not the same as resolved, and only resolving removes it. */
@keyframes alPulse{
  0%,100%{ border-color:#7a2230; box-shadow:0 0 0 0 rgba(220,60,70,.0); }
  50%    { border-color:#e04452; box-shadow:0 0 14px 2px rgba(220,60,70,.30); }
}
#alertsBtn.unread{ animation: alPulse 1.5s ease-in-out infinite; }
#alertsBtn.unread .mLabel{ color:#ff8a94; }
#alList{ display:flex; flex-direction:column; gap:10px; width:100%; }
.alDay{ font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:#8892a6; margin:6px 0 2px; }
.alRow{ display:flex; align-items:flex-start; gap:10px; padding:9px 11px; border:1px solid #2a3142;
        border-radius:9px; background:#151a24; }
.alRow .alTxt{ flex:1; min-width:0; font-size:13px; line-height:1.45; word-break:break-word; }
.alRow .alWhen{ color:#8892a6; font-size:11px; margin-top:2px; }
.alNone{ color:#8892a6; font-size:13px; padding:10px 2px; }
/* ---------- landing (legacy bits) ---------- */
#unused-landing-old{max-width:640px;margin:9vh auto;padding:0 20px;text-align:center}
#landing .logo{font-family:var(--mono);font-size:34px;letter-spacing:.22em;color:var(--amber);margin-bottom:6px}
#landing .logo span{color:var(--faint)}
#landing p.sub{color:var(--dim);margin-bottom:34px;font-size:14px}
#drop{border:1.5px dashed var(--line);border-radius:16px;padding:56px 30px;cursor:pointer;
  transition:border-color .2s, background .2s;background:rgba(19,27,41,.5)}
#drop:hover,#drop.over{border-color:var(--amber);background:rgba(245,180,83,.05)}
#drop .big{font-size:17px;margin-bottom:8px}
#drop .hint{color:var(--faint);font-size:13px;font-family:var(--mono)}
#landing .err{color:var(--red);margin-top:18px;font-size:13.5px;min-height:1.2em}
#landData{margin-top:30px}
#landData .hint2{color:var(--faint);font-size:11.5px;margin-top:8px;font-family:var(--mono)}

/* ---------- summary strip ---------- */
main{max-width:1060px;margin:0 auto;padding:16px 18px 90px}
#summary{display:none;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card .lbl{font-size:11px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;margin-bottom:5px}
.card .val{font-family:var(--mono);font-size:19px;font-weight:600}
.card .sub{font-family:var(--mono);font-size:13.5px;color:#c3cfe2;margin-top:5px}
.card .sub b{font-size:16px;color:var(--dim)}
.card.part .sub b{color:var(--amber)}
.card.done .sub b{color:var(--green)}
.card.done{border-color:var(--green-dim)}
.card.done .val{color:var(--green)}
.tick{color:var(--green);font-weight:700;margin-left:6px}
.openPill{display:inline-block;font-size:10px;letter-spacing:.1em;padding:2px 8px;border-radius:999px;margin-left:8px;
  background:rgba(245,180,83,.13);border:1px solid var(--amber-dim);color:var(--amber);
  font-family:var(--mono);font-weight:600;animation:pillPulse 1.8s ease-in-out infinite;vertical-align:1px}
@keyframes pillPulse{0%,100%{opacity:1}50%{opacity:.4}}
.card.grand{border-color:var(--amber-dim)}
.card.grand .val{color:var(--amber)}
#parseWarn{display:none;background:rgba(248,113,113,.08);border:1px solid var(--red-dim);color:var(--red);
  border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px;font-family:var(--mono)}
#parseOk{display:none;color:var(--green);font-size:12px;font-family:var(--mono);margin:-6px 0 12px 2px}
#parseNote{display:none;color:var(--amber-dim);font-size:12px;font-family:var(--mono);margin:-6px 0 12px 2px}

/* ---------- search ---------- */
#searchWrap{display:none;position:sticky;top:52px;z-index:40;background:rgba(10,14,20,.95);backdrop-filter:blur(6px);
  padding:10px 0 12px;margin-bottom:6px;border-bottom:1px solid var(--line)}
#searchRow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#snInput{flex:0 0 220px;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;color:var(--txt);
  font-family:var(--mono);font-size:20px;letter-spacing:.08em;padding:10px 14px;outline:none;transition:border-color .15s}
#snInput:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(245,180,83,.12)}
#snInput.nomatch{color:var(--red);border-color:var(--red-dim)}
#snInput::placeholder{color:var(--faint);font-size:14px;letter-spacing:0}
/* Shown by adding .show, never by clearing style.display — clearing an inline style
   removes the override and lets this rule win, which is exactly how this prompt spent
   its whole life invisible while the code around it looked correct. */
/* The movements panel sits to the right of the departments list and scrolls with it,
   five rooms to a line. main only widens while there is something to show, so a night
   with no rate list looks exactly as it always did. */
#bodyRow{display:flex;gap:18px;align-items:flex-start}
#accordions{flex:1;min-width:0}
#moves{display:none;flex:0 0 auto;width:250px;position:sticky;top:66px;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 13px 11px}
body.hasMoves #moves{display:block}
body.hasMoves main{max-width:1330px}
.mvTitle{font-size:11px;letter-spacing:.09em;color:var(--faint);font-family:var(--mono);margin-bottom:9px}
.mvGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mvPill{font-family:var(--mono);font-size:12.5px;font-weight:700;text-align:center;
  padding:5px 0;border-radius:7px;border:1px solid transparent;cursor:default;user-select:none}
.mvPill.mv-dep{background:rgba(248,113,113,.14);border-color:var(--red-dim);color:var(--red)}
.mvPill.mv-arr{background:rgba(74,222,128,.13);border-color:#1f6b3d;color:var(--green)}
.mvPill.mv-turn{background:rgba(245,180,83,.15);border-color:#7a5522;color:var(--amber)}
/* A move is not an arrival. protel prints one as a new stay on the new room dated today,
   so the report cannot tell them apart — this is the only thing on the panel worked out
   rather than read, and it gets its own colour so that is never in doubt. */
.mvPill.mv-move{background:rgba(96,165,250,.14);border-color:#2c4f7c;color:#93c5fd}
/* a departure whose room also has receipts tonight — the paper to throw away */
.mvPill.rec{position:relative}
.mvPill.rec::after{content:"";position:absolute;top:3px;right:4px;width:5px;height:5px;
  border-radius:50%;background:currentColor;opacity:.95}
.mvPill.guess{border-style:dashed;opacity:.72}
/* a heading per colour, so the eye reads three short blocks instead of a chequerboard */
.mvGroup{display:flex;align-items:baseline;gap:7px;margin:12px 0 6px;font-family:var(--mono);
  font-size:10.5px;letter-spacing:.12em}
.mvGroup:first-of-type{margin-top:2px}
.mvGroupN{font-size:10px;opacity:.7}
.mvGroup.mv-dep{color:var(--red)}
.mvGroup.mv-arr{color:var(--green)}
.mvGroup.mv-turn{color:var(--amber)}
.mvGroup.mv-move{color:#93c5fd}
.mvNote{margin-top:9px;font-size:10.5px;line-height:1.45;color:var(--faint)}
@media (max-width:1180px){
  #bodyRow{flex-direction:column}
  #moves{width:100%;position:static}
  body.hasMoves main{max-width:1060px}
  .mvGrid{grid-template-columns:repeat(10,1fr)}
}
/* the protel-only gate, under the bind rows in PROTEL SHORTCUTS */
.scFocus{margin-top:14px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#0b1017}
.scFocusTop{display:flex;align-items:center;gap:9px;font-size:13px;cursor:pointer}
.scFocusTop input{width:15px;height:15px;accent-color:var(--amber);cursor:pointer}
.scFocusSub{margin:7px 0 9px;font-size:11.5px;line-height:1.5;color:var(--dim);font-family:var(--mono)}
#notThereBtn{display:none}
#notThereBtn.show{display:inline-block}
.xWho{margin:-6px 0 10px;font-size:12px;color:#4fd1c5;font-family:var(--mono)}
#matches{display:flex;flex-direction:column;gap:6px;flex:1;min-width:280px}
.match{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--amber-dim);
  border-radius:10px;padding:8px 12px;font-family:var(--mono);font-size:14px;animation:pop .12s ease-out}
@keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:scale(1);opacity:1}}
.match .dept{color:var(--amber);font-size:12px;letter-spacing:.08em;min-width:86px}
.match .room{color:#fff;font-weight:800;font-size:16px;min-width:56px}
.match .msn{color:var(--amber)}
.match .name{color:var(--dim);font-size:12.5px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match .amt{font-weight:800;margin-left:auto;font-size:16px;color:#fff}
.match .split{color:#c3cfe2;font-size:13px}
.match input[type=checkbox]{width:22px;height:22px;accent-color:var(--green);cursor:pointer;flex:0 0 auto}
.match .state{font-size:11px;padding:2px 7px;border-radius:5px}
.match .state.ok{background:var(--green-dim);color:var(--green)}
.match .state.missing,.match .state.extra{background:var(--red-dim);color:var(--red)}
.match .state.corr{background:#4a3a12;color:var(--amber)}
.match .state.cancelled{background:#2a3040;color:var(--dim)}
#searchHint{font-size:11.5px;color:var(--faint);margin-top:6px;font-family:var(--mono)}

/* ---------- accordions ---------- */
.acc{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.acc>.head{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;user-select:none}
.acc>.head:hover{background:var(--panel2)}
.acc>.head .bar{width:4px;height:26px;border-radius:2px;background:var(--amber);flex:0 0 auto}
.acc.extraAcc>.head .bar{background:var(--red)}
.acc>.head .name{font-weight:600;letter-spacing:.06em;font-size:15px}
.acc>.head .cnt{font-family:var(--mono);font-size:14px;color:var(--dim)}
.acc>.head .cnt b{font-size:16.5px;color:var(--txt)}
.acc.done>.head .bar{background:var(--green)}
.acc.done>.head .tot{color:var(--green)}
.acc.done>.head .cnt b{color:var(--green)}
.acc>.head .prog{font-family:var(--mono);font-size:13.5px;margin-left:auto;color:var(--dim)}
.acc>.head .prog b{color:var(--dim);font-weight:700;font-size:15px}
.acc.part>.head .prog b{color:var(--amber)}
.acc.done>.head .prog b{color:var(--green)}
.acc>.head .tot{font-family:var(--mono);font-size:16px;font-weight:700;min-width:110px;text-align:right}
.acc>.head .chev{color:var(--faint);transition:transform .15s;font-size:12px}
.acc.open>.head .chev{transform:rotate(90deg)}
.acc>.body{display:none;border-top:1px solid var(--line)}
.roomSearchWrap{display:flex;align-items:center;gap:10px;padding:9px 16px 3px}
.roomSearch{background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px 10px;font-family:var(--mono);font-size:13.5px;width:110px}
.roomSearch:focus{outline:none;border-color:var(--amber-dim)}
.rsHint{color:var(--faint);font-size:11.5px}
.rrow.khl{background:var(--panel2);box-shadow:inset 3px 0 0 var(--amber)}
.rrow.khl.act-ok .rowck{outline:2px solid var(--green);outline-offset:2px;border-radius:4px}
.rrow.khl.act-warn .warnBtn{outline:2px solid var(--amber);outline-offset:1px}
.acc.open>.body{display:block}
.rrow{display:flex;align-items:center;gap:12px;padding:9px 16px;border-bottom:1px solid rgba(35,48,71,.5);
  font-family:var(--mono);font-size:14px}
.rrow:last-child{border-bottom:none}
.rrow:hover{background:rgba(24,34,52,.5)}
.rrow .room{min-width:64px;font-weight:800;font-size:15.5px;color:#fff}
.rrow .room .adj{color:var(--faint);font-size:11px;font-weight:400}
.rrow .sn{min-width:78px;color:var(--amber)}
.rrow .name{color:var(--dim);font-size:12.5px;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .split{color:#c3cfe2;font-size:13px;flex:1}
.rrow .amt{font-weight:800;min-width:96px;text-align:right;font-size:15.5px;color:#fff}
.rrow .old{color:var(--red);text-decoration:line-through;margin-right:7px;font-weight:400}
.rrow.st-ok .amt,.rrow.st-ok .room,.rrow.st-ok .sn,.rrow.st-ok .split{color:var(--green)}
.rrow.st-missing .amt,.rrow.st-missing .room,.rrow.st-missing .sn,.rrow.st-missing .split{color:var(--red)}
.rrow.st-corrected .amt,.rrow.st-corrected .room{color:#fff}
.rrow.st-extra .amt,.rrow.st-extra .room,.rrow.st-extra .sn{color:var(--red)}
.rrow.st-cancelled{opacity:.45}
.rrow.st-cancelled .amt,.rrow.st-cancelled .room,.rrow.st-cancelled .sn{color:var(--dim)}
.rrow .tag{font-size:10.5px;padding:2px 7px;border-radius:5px;letter-spacing:.05em}
.rrow .tag.ok{background:var(--green-dim);color:var(--green)}
.rrow .tag.missing{background:var(--red-dim);color:var(--red)}
.rrow .tag.corr{background:#4a3a12;color:var(--amber)}
.rrow .tag.extra{background:var(--red-dim);color:var(--red)}
.rrow .tag.cancelled{background:#232b3b;color:var(--dim)}
.warnBtn{background:none;border:1px solid var(--line);border-radius:7px;color:var(--amber);cursor:pointer;
  font-size:14px;padding:3px 9px;flex:0 0 auto;transition:border-color .15s}
.warnBtn:hover{border-color:var(--amber)}
.rowck{width:20px;height:20px;accent-color:var(--green);cursor:pointer;flex:0 0 auto}
.rrow .tag.merged{background:#16324d;color:#7cc4ff}
.rrow .tag.void,.match .state.void{background:#2a3040;color:var(--dim)}
.rrow.st-void{opacity:.55}
.rrow.st-void .amt,.rrow.st-void .room,.rrow.st-void .sn,.rrow.st-void .split{color:var(--dim)}
.rowMenu{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:10px;z-index:60;
  box-shadow:0 12px 30px rgba(0,0,0,.6);min-width:300px;overflow:hidden}
.rowMenu button{display:block;width:100%;background:none;border:none;text-align:left;color:var(--txt);
  padding:12px 15px;font-size:13.5px;cursor:pointer;border-bottom:1px solid rgba(35,48,71,.5)}
.rowMenu button:last-child{border-bottom:none}
.rowMenu button:hover{background:var(--panel2)}
.rowMenu button .k{color:var(--amber);font-family:var(--mono);margin-right:8px}
.otherPost{padding:6px 16px 12px}
.otherPost summary{cursor:pointer;color:var(--faint);font-size:12px;font-family:var(--mono);padding:6px 0}
.otherPost .rrow{padding:6px 0;font-size:13px;color:#9fb0c9}
.otherPost .rrow .amt{color:var(--dim)}

/* ---------- modal ---------- */
#modalBg{display:none;position:fixed;inset:0;background:rgba(4,6,10,.72);z-index:100;align-items:center;justify-content:center;padding:16px}
#modalBg.open{display:flex}
/* A dialog taller than the window used to be centred and simply cut off at BOTH ends —
   no max-height, no scroll — so PROTEL SHORTCUTS lost its Done button as it grew, and
   there was no way to reach it. It was already 970px tall at 1.17.2, past every window
   height here. Now it never exceeds the window and scrolls inside itself instead. */
#modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 24px;width:min(420px,92vw);
  max-height:calc(100vh - 32px);overflow-y:auto;overscroll-behavior:contain;
  box-shadow:0 24px 60px rgba(0,0,0,.7)}
#modal.wide{width:min(780px,94vw)}
/* The 1.17.4-1.17.5 work made the HOME SCREEN flow into columns and fixed the modal's
   HEIGHT; dialog WIDTH was never in scope, so this one stayed a 420 px strip with a
   scrollbar on a wide window. The cards flow now, the same way the checklist does. */
#modal.cards{width:min(1100px,95vw)}
#modal.cards .scCards{display:grid;gap:12px;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start}
/* the cards carry their own top margin for the old single-column stack; inside the grid
   the gap does that job and the margin would double it */
#modal.cards .scCards > .scRow,
#modal.cards .scCards > * > .scFocus{margin-top:0}
@media (max-width:760px){ #modal.cards .scCards{grid-template-columns:1fr} }
/* DEBUG's buttons carry whole sentences ("Why the room pills say what they say") and
   .btn is white-space:nowrap, so a flex row of them had no min-content it could shrink
   to: in the 420 px dialog the row ran 183 px past the edge and the whole dialog
   side-scrolled, clipping its own text. A grid reflows instead of overflowing, at any
   width, however long a label gets. */
#modal .dbgGrid{display:grid;gap:8px;align-items:start;margin-top:12px;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
#modal .dbgGrid .btn{width:100%;white-space:normal}
/* on-screen print preview — mirrors the @media print sheet styling on white paper */
#pvPaper{background:#fff;color:#000;border-radius:6px;max-height:62vh;overflow:auto;padding:20px 22px;
  font-family:"Segoe UI",Arial,sans-serif;font-size:12px;box-shadow:inset 0 0 0 1px #ccc}
#pvPaper h1{font-size:16px;letter-spacing:.06em;margin:0 0 2px;font-weight:700;color:#000}
#pvPaper .meta{font-size:11px;margin-bottom:14px;color:#000}
#pvPaper h2{font-size:12.5px;margin:16px 0 6px;font-weight:700;border-bottom:1.2px solid #000;padding-bottom:3px;color:#000}
#pvPaper table{width:100%;border-collapse:collapse;font-size:11.5px}
#pvPaper th,#pvPaper td{border:0.6px solid #000;padding:4px 7px;text-align:left;vertical-align:top;color:#000}
#pvPaper th{font-weight:700}
#pvPaper td.num,#pvPaper th.num{text-align:right;font-family:Consolas,monospace}
#pvPaper .none{font-style:italic;margin:4px 0 0}
#pvPaper .old{text-decoration:line-through}
#modal h3{font-size:15px;letter-spacing:.08em;color:var(--amber);margin-bottom:16px;font-family:var(--mono)}
#modal label{display:block;font-size:12px;color:var(--dim);margin:12px 0 4px;letter-spacing:.06em}
#modal input,#modal select{width:100%;background:var(--bg2);border:1.5px solid var(--line);border-radius:8px;
  color:var(--txt);font-family:var(--mono);font-size:16px;padding:9px 12px;outline:none}
#modal input:focus,#modal select:focus{border-color:var(--amber)}
#modal .mrow{display:flex;gap:10px}
#modal .mrow>div{flex:1}
/* and the buttons stay put while the rest of it scrolls: the way out of a dialog should
   never be something you have to go looking for. The negative bottom margin lets the
   sticky row's own padding stand in for the modal's, so it sits flush at the bottom. */
/* The dialog's own bottom padding is handed to the sticky row instead, so the row sits
   flush against the bottom edge rather than floating 22px above it with the content
   still showing underneath. Dialogs without an actions row keep their padding. */
#modal:has(.actions){padding-bottom:0}
#modal .actions{display:flex;gap:10px;justify-content:flex-end;
  position:sticky;bottom:0;z-index:2;background:var(--panel);
  padding:12px 0 22px;margin-top:20px;
  box-shadow:0 -14px 18px -14px rgba(4,6,10,.95)}
#modal .err{color:var(--red);font-size:12.5px;margin-top:10px;min-height:1em}

/* toast */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel2);
  border:1px solid var(--green-dim);color:var(--green);font-family:var(--mono);font-size:14.5px;padding:12px 22px;
  border-radius:10px;opacity:0;pointer-events:none;transition:opacity .5s ease,transform .5s ease;z-index:120}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.red{border-color:var(--red-dim);color:var(--red)}
#toast.match{display:flex;align-items:center;gap:12px;font-family:var(--sans);max-width:min(92vw,680px)}
#toast .tick{color:var(--green);font-weight:800;font-size:17px}

/* ---------- side rail + drawer ---------- */
#rail{position:fixed;right:12px;top:66px;z-index:70;display:none;flex-direction:column;gap:8px;transition:right .18s ease}
body.drawerOpen #rail{right:342px}
.railBtn{width:44px;height:44px;border-radius:12px;background:var(--panel);border:1px solid var(--line);
  color:var(--dim);cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;
  transition:border-color .15s,color .15s,background .15s}
.railBtn:hover{border-color:var(--amber);color:var(--amber)}
.railBtn.active{border-color:var(--amber);color:var(--amber);background:#1c2942}
.railBtn .cnt{position:absolute;top:-6px;right:-6px;background:var(--amber);color:#000;font-size:10.5px;
  font-weight:700;font-family:var(--mono);border-radius:999px;padding:1px 6px;display:none}
#drawer{position:fixed;right:0;top:52px;bottom:0;width:330px;background:var(--bg2);border-left:1px solid var(--line);
  z-index:65;transform:translateX(100%);transition:transform .18s ease;display:flex;flex-direction:column}
body.drawerOpen #drawer{transform:none}
main{transition:margin-right .18s ease}
@media(min-width:900px){ body.drawerOpen main{margin-right:350px} }

/* first-timer help: step-by-step guide pinned to the left inside each audit tool */
#helpPanel{position:fixed;left:12px;top:64px;bottom:14px;width:274px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;z-index:35;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 28px rgba(0,0,0,.35)}
#helpHead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 10px 10px 14px;border-bottom:1px solid var(--line);flex-shrink:0}
#helpTitle{font-family:var(--mono);font-size:12px;letter-spacing:.11em;color:var(--amber)}
#helpBody{padding:4px 15px 16px;overflow-y:auto;font-size:13px;line-height:1.55}
#helpBody h4{margin:15px 0 5px;font-size:11.5px;letter-spacing:.09em;color:var(--amber);font-family:var(--mono);font-weight:600}
#helpBody ol{margin:4px 0 4px;padding-left:19px}
#helpBody li{margin:5px 0}
#helpBody b{color:#f0c877;font-weight:600}
#helpBody .hnote{color:var(--dim);font-size:12.5px;margin-top:12px;border-top:1px dashed var(--line);padding-top:9px}
#helpTab{position:fixed;left:0;top:42%;z-index:35;writing-mode:vertical-rl;transform:rotate(180deg);cursor:pointer;
  background:var(--panel);border:1px solid var(--line);border-radius:8px 0 0 8px;padding:12px 6px;color:var(--amber);
  font-family:var(--mono);font-size:11px;letter-spacing:.15em}
#helpTab:hover{border-color:var(--amber-dim)}
body.helpOn main{margin-left:300px;margin-right:12px}
body.helpOn #taxScreen .wrap{margin-left:300px;margin-right:12px;max-width:none}
@media(max-width:900px){ body.helpOn main,body.helpOn #taxScreen .wrap{margin-left:auto;margin-right:auto} #helpPanel{width:86vw;max-width:340px} }

/* checklist help — appears while editing the list */
#clHelp{font-size:13px;line-height:1.6;color:var(--dim);background:rgba(35,48,71,.28);border:1px dashed var(--line);
  border-radius:10px;padding:11px 14px;margin-bottom:12px}
#clHelp b{color:#f0c877;font-weight:600}
.dHead{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;flex:0 0 auto;
  border-bottom:1px solid var(--line);font-family:var(--mono);letter-spacing:.14em;color:var(--amber);font-size:13px}
.dPanel{display:none}
.dPanel.active{display:block;overflow-y:auto;flex:1}
.nHint{font-size:11.5px;color:var(--faint);font-family:var(--mono);min-height:1.2em;margin:-2px 0 6px 2px}
.nHint b{color:var(--dim);font-weight:400}
.match .name.nick,.rrow .name.nick{color:#4fd1c5}
.nWho{font-family:var(--mono);font-size:13px;color:var(--dim);margin:2px 0 8px}
.nWho b{color:#ffd98a;font-size:15px}
.nWho span{color:var(--faint);font-size:12px}
.nBtns{display:flex;gap:8px}
.nBtns .btn{flex:1}
.wRow.sel{background:var(--panel2);box-shadow:inset 3px 0 0 var(--amber)}
.wRow .name .base{color:var(--faint);font-size:11px}
#nList{border-bottom:1px solid var(--line)}
.nMore{color:var(--faint);font-size:11.5px;padding:8px 14px;font-family:var(--mono)}
.wForm{padding:14px;border-bottom:1px solid var(--line)}
.wForm .wFormRow{display:flex;gap:8px}
.wForm input{width:100%;background:var(--panel);border:1.5px solid var(--line);border-radius:8px;color:var(--txt);
  font-family:var(--mono);font-size:14px;padding:8px 10px;outline:none;margin-bottom:8px}
.wForm input:focus{border-color:var(--amber)}
.wForm .btn{width:100%}
.wErr{color:var(--red);font-size:12px;min-height:1.1em;margin-top:6px;font-family:var(--mono)}
.wAcc .wHead{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none;
  font-size:11.5px;letter-spacing:.12em;color:var(--dim);font-family:var(--mono)}
.wAcc .wHead b{color:#ffd98a;font-size:13px}
.wAcc .wHead .chev{color:var(--faint);transition:transform .15s;font-size:11px;margin-left:auto}
.wAcc.open .wHead .chev{transform:rotate(90deg)}
.wAcc .wBody{display:none}
.wAcc.open .wBody{display:block}
.wRow{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid rgba(35,48,71,.5);
  font-family:var(--mono);font-size:13.5px;cursor:pointer}
.wRow:hover{background:var(--panel2)}
.wRow .room{font-weight:800;color:#ffd98a;min-width:46px}
.wRow .sn{color:var(--amber);min-width:64px}
.wRow .name{color:var(--dim);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wEmpty{color:var(--faint);font-size:12.5px;padding:16px 14px;font-family:var(--mono)}

/* watch highlighting — yellow container to compare the signature closely */
.match.watch{background:rgba(245,180,83,.16);border-color:var(--amber);
  box-shadow:0 0 0 1px var(--amber),0 4px 20px rgba(245,180,83,.28)}
.match .state.watch,.rrow .tag.watch{background:#4a3a12;color:#ffd98a;border:1px solid var(--amber-dim)}
/* A receipt on a room that is leaving today. The charge was made before they came to
   the desk, so it has to be settled before they walk — the one thing on this screen you
   must never skim past. Marked on the whole bar, not just a corner of it. */
.match.left{background:linear-gradient(90deg,rgba(248,113,113,.20),rgba(248,113,113,.06) 65%);
  border-color:var(--red);box-shadow:inset 4px 0 0 var(--red),0 4px 20px rgba(248,113,113,.22)}
.match.left .room{color:#ffd7d7}
.match .leftArrow{color:var(--red);font-size:19px;font-weight:800;line-height:1;flex:0 0 auto;
  margin-left:2px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
/* the watch highlight is amber and would fight it — departing wins, it is the harder fact */
.match.left.watch{background:linear-gradient(90deg,rgba(248,113,113,.20),rgba(248,113,113,.06) 65%);
  border-color:var(--red);box-shadow:inset 4px 0 0 var(--red),0 4px 20px rgba(248,113,113,.22)}
.rrow.watch{background:linear-gradient(90deg,rgba(245,180,83,.13),rgba(245,180,83,.03) 70%)}

/* ---------- update button (Electron only) ---------- */
#updateBtn{position:fixed;right:22px;bottom:22px;z-index:90;width:50px;height:50px;border-radius:50%;
  background:#101d33;border:1.5px solid #2f5f9e;cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 22px rgba(40,110,220,.35);
  animation:updIn .3s ease-out;transition:transform .15s, box-shadow .15s, opacity .15s}
#updateBtn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(40,110,220,.55)}
#updateBtn.busy{opacity:.55;pointer-events:none}
#updateBtn svg{display:block}
#updBox{position:fixed;right:22px;bottom:22px;z-index:89;background:#101d33;border:1.5px solid #2f5f9e;border-radius:12px;
  color:#9cc4f8;font-family:var(--mono);font-size:12.5px;padding:10px 14px;display:none;
  box-shadow:0 6px 22px rgba(40,110,220,.3);animation:updIn .25s ease-out}
@keyframes updIn{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}

#printSheet{display:none}
@media print{
  html,body{height:auto !important;min-height:0 !important;overflow:visible !important}
  body{background:#fff !important;margin:0;padding:0}
  @page{margin:12mm}
  header,main,#landing,#modalBg,#toast,#updateBtn,#updBox,#rail,#drawer,#taxScreen,#helpPanel,#helpTab{display:none !important}
  #printSheet{display:block !important;color:#000;font-family:"Segoe UI",Arial,sans-serif;padding:0;font-size:12px}

  #printSheet .meta{font-size:11px;margin-bottom:14px;color:#000}
  #printSheet h2{font-size:12.5px;margin:16px 0 6px;font-weight:700;border-bottom:1.2px solid #000;padding-bottom:3px}
  #printSheet table{width:100%;border-collapse:collapse;font-size:11.5px}
  #printSheet th,#printSheet td{border:0.6px solid #000;padding:4px 7px;text-align:left;vertical-align:top}
  #printSheet th{font-weight:700}
  #printSheet td.num,#printSheet th.num{text-align:right;font-family:Consolas,monospace}
  #printSheet .none{font-style:italic;margin:4px 0 0}
  #printSheet .old{text-decoration:line-through}
}

  #snInput{flex:1 1 100%}
  .rrow .split{display:none}
  .rrow .name{max-width:110px}
}
/* ================= TAX CHECK (namespaced) ================= */
  #taxScreen{
    --bg:#0b0f14;--panel:#131a22;--panel2:#0f151c;--line:#243140;--txt:#d7e0ea;--muted:#8595a6;--dim:#5d6b7a;
    --accent:#4aa3ff;--ok:#2ea043;--okbg:#12331d;--red:#f2544d;--redbg:#3a1512;--amber:#e0a13a;--amberbg:#3a2a10;
    --blue2:#93c5fd;--bluebg:#12283f;--violet:#b58cf0;--violetbg:#241a38;--grey:#5d6b7a;--greybg:#1b232c;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  }
#taxScreen *{box-sizing:border-box}
#taxScreen{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
/* The audit half styles its app chrome on the bare `header` selector, and the tax screen
   has a <header> of its own — so the tax page's title block has been rendering as a
   sticky, blurred, bordered flex BAR all along, laying its title and its sentence out
   side by side instead of stacked. That is what pushed the page past the window between
   901 and ~1090 px, where the help panel takes 300 px of the width. It is a title and a
   paragraph; nothing else. */
#taxScreen header{display:block;position:static;top:auto;z-index:auto;gap:0;
  background:none;border:0;backdrop-filter:none;padding:0;}
#taxScreen .wrap{max-width:1080px;margin:0 auto;padding:22px 20px 60px;}
/* The help panel pushes this page 300 px right from 901 px up, which leaves a 909 px
   window 597 px of column. The topbar could not shrink into that — no wrap, and a
   flex-shrink:0 language switcher — so the whole tax page side-scrolled between
   901 and ~1090 px. Wrapping costs nothing at full width and cannot overflow. */
#taxScreen .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
#taxScreen .topbar > header{min-width:0;flex:1 1 320px;}
/* Same leak as the header itself: the audit's `header h1` is amber, monospace, 600 and
   white-space:nowrap, and only the properties re-declared here were ever overriding it.
   So the tax page's title has been rendering in the audit's identity, on one unbreakable
   line that ran under the menu button. It states them all now. */
#taxScreen header h1{font-size:19px;margin:0 0 3px;letter-spacing:.2px;
  font-family:inherit;font-weight:600;color:var(--txt);white-space:normal;cursor:default;}
#taxScreen header h1 span{color:var(--accent);font-weight:inherit;}
#taxScreen header p{margin:0;color:var(--muted);font-size:13px;max-width:720px;}
#taxScreen .langsw{display:flex;gap:6px;flex-shrink:0;}
#taxScreen .langsw button{padding:4px;border:1px solid var(--line);background:var(--panel2);border-radius:7px;cursor:pointer;line-height:0;opacity:.5;transition:.15s;}
#taxScreen .langsw button:hover{opacity:.85;}#taxScreen .langsw button.active{opacity:1;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;}
#taxScreen .flag{width:26px;height:auto;display:block;border-radius:2px;}
#taxScreen .menu{position:relative;}
#taxScreen .menu-btn{width:30px;height:30px;border:1px solid var(--line);background:var(--panel2);border-radius:7px;color:var(--muted);cursor:pointer;font-size:17px;line-height:1;padding:0;}
#taxScreen .menu-btn:hover{color:var(--txt);border-color:var(--accent);}
#taxScreen .menu-drop{position:absolute;right:0;top:36px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:190px;box-shadow:0 8px 24px rgba(0,0,0,.45);display:none;z-index:40;}
#taxScreen .menu-drop.show{display:block;}
#taxScreen .menu-item{display:block;width:100%;text-align:left;font:inherit;font-size:13px;background:none;border:none;color:var(--txt);padding:8px 10px;border-radius:7px;cursor:pointer;}
#taxScreen .menu-item:hover{background:var(--panel2);}
#taxScreen .menu-item.danger{color:#ff9a94;}#taxScreen .menu-item.danger:hover{background:var(--redbg);color:#ffb4b0;}
#taxScreen #liveRow{display:flex;align-items:center;gap:10px;margin:18px 0 0;flex-wrap:wrap;}
/* its own line under the last capture, and quieter than it: this is standing state,
   not news, and it must never compete with the line that reports an arrival */
#taxScreen #liveHeld{flex-basis:100%;opacity:.7;font-size:12px;margin-top:2px}
#taxScreen .slots{display:flex;gap:10px;margin:20px 0 6px;flex-wrap:wrap;}
#taxScreen .slot{flex:1;min-width:240px;border:1.5px dashed var(--line);border-radius:10px;padding:16px;text-align:center;cursor:pointer;transition:.15s;background:var(--panel2);display:block;}
#taxScreen .slot:hover, #taxScreen .slot.over{border-color:var(--accent);background:#101a26;}
#taxScreen .slot.loaded{border-style:solid;border-color:#2c4257;}
#taxScreen .slot .num{font-family:var(--mono);font-size:11px;color:var(--dim);}
#taxScreen .slot b{color:var(--accent);display:block;margin:2px 0;}#taxScreen .slot small{color:var(--dim);font-size:11.5px;}
#taxScreen .slot .fn{color:var(--muted);font-family:var(--mono);font-size:11px;margin-top:6px;min-height:14px;word-break:break-all;}
#taxScreen .slot.loaded b{color:var(--ok);}
#taxScreen input[type=file]{display:none;}
#taxScreen .banner{margin:8px 0;border-radius:10px;padding:11px 14px;font-size:13px;border:1px solid var(--line);background:var(--panel);}
#taxScreen .banner.ok{border-color:#1c4a2b;background:var(--okbg);color:#a6e5ba;}
#taxScreen .banner.warn{border-color:#5a4113;background:var(--amberbg);color:#f0c877;}
#taxScreen .banner b{font-family:var(--mono);}
#taxScreen .err{color:var(--red);background:var(--redbg);border:1px solid #5a201c;border-radius:8px;padding:9px 12px;margin-top:8px;font-size:13px;display:none;}
#taxScreen .summary{display:none;gap:10px;margin:14px 0 6px;flex-wrap:wrap;}
#taxScreen .stat{flex:1;min-width:120px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px;}
#taxScreen .stat .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;}#taxScreen .stat .v{font-family:var(--mono);font-size:23px;margin-top:2px;}#taxScreen .stat .v.sm{font-size:16px;}
#taxScreen section{margin-top:16px;}#taxScreen h2{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:0 0 8px;display:flex;align-items:center;gap:8px;}
#taxScreen .count{font-family:var(--mono);background:var(--greybg);color:var(--txt);border:1px solid var(--line);border-radius:20px;padding:0 8px;font-size:12px;}
#taxScreen .dgroup.seg{margin-top:16px;background:var(--violetbg);border-color:#3a2b57;}
#taxScreen .seg .segtitle{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--violet);font-weight:600;}
#taxScreen .dgroup.seg .caret{color:var(--violet) !important;}
#taxScreen .seg .dhead:hover{background:#2d2350;}
#taxScreen .seg .dhead.static{cursor:default;}
#taxScreen .seg .dhead.static:hover{background:none;}
#taxScreen .seg .dbody{padding-bottom:4px;border-top-color:#3a2b57;}
#taxScreen .seg .dbody .row{border-top-color:#3a2b57;}
#taxScreen .seg .dbody .legend{padding:8px 14px 6px;margin:0;}
#taxScreen .t-ok{color:var(--ok) !important;}
#taxScreen .t-warn{color:var(--amber) !important;}
#taxScreen .count.c-none{color:var(--muted);}
#taxScreen .count.c-ok{color:var(--ok);border-color:var(--ok);}
#taxScreen .count.c-warn{color:var(--amber);border-color:var(--amber);font-size:17px;font-weight:700;padding:2px 12px;}
#taxScreen .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 0;}
#taxScreen .row{display:flex;align-items:center;gap:12px;padding:9px 14px;border-top:1px solid var(--line);}#taxScreen .row:first-child{border-top:none;}
#taxScreen .rm{font-family:var(--mono);font-size:15px;min-width:78px;}#taxScreen .nm{color:var(--muted);font-size:12px;min-width:120px;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#taxScreen .tag{font-family:var(--mono);font-size:11px;padding:1px 8px;border-radius:20px;border:1px solid;white-space:nowrap;}
#taxScreen .tag.red{color:var(--red);background:var(--redbg);border-color:#5a201c;}#taxScreen .tag.amber{color:var(--amber);background:var(--amberbg);border-color:#5a4113;}
#taxScreen .tag.grey{color:#9fb0c0;background:var(--greybg);border-color:var(--line);}#taxScreen .tag.ok{color:var(--ok);background:var(--okbg);border-color:#1c4a2b;}
#taxScreen .tag.blue{color:var(--blue2);background:var(--bluebg);border-color:#1d4266;}#taxScreen .tag.violet{color:var(--violet);background:var(--violetbg);border-color:#3a2b57;}
#taxScreen .tag.click{cursor:pointer;}#taxScreen .tag.click:hover{filter:brightness(1.25);}
#taxScreen .meta{color:var(--muted);font-size:12.5px;flex:1;}#taxScreen .empty{color:var(--dim);padding:12px 14px;font-size:13px;}
#taxScreen .btns{display:flex;gap:6px;}#taxScreen button.mini{font:inherit;font-size:12px;cursor:pointer;border-radius:7px;padding:5px 10px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);transition:.12s;}
#taxScreen button.mini:hover{border-color:var(--accent);color:#fff;}#taxScreen button.on-arr{background:var(--okbg);border-color:#1c4a2b;color:#8fe3a6;}#taxScreen button.on-out{background:var(--bluebg);border-color:#1d4266;color:#93c5fd;}#taxScreen button.on-prob{background:var(--redbg);border-color:#5a201c;color:#ffb4b0;}
#taxScreen .acc{display:flex;flex-direction:column;gap:8px;}#taxScreen .dgroup{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
#taxScreen .dhead{display:flex;align-items:center;gap:12px;padding:11px 14px;cursor:pointer;user-select:none;transition:.12s;}#taxScreen .dhead:hover{background:#172029;}
#taxScreen .caret{color:var(--dim);font-family:var(--mono);width:12px;transition:transform .15s;flex-shrink:0;}#taxScreen .dgroup.open .caret{transform:rotate(90deg);color:var(--accent);}
#taxScreen .ddate{font-family:var(--mono);font-size:15px;min-width:92px;}#taxScreen .chips{display:flex;gap:6px;flex-wrap:wrap;flex:1;}
#taxScreen .chip{font-family:var(--mono);font-size:11px;padding:1px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted);}
#taxScreen .chip.red{color:var(--red);background:var(--redbg);border-color:#5a201c;}#taxScreen .chip.amber{color:var(--amber);background:var(--amberbg);border-color:#5a4113;}
#taxScreen .chip.grey{color:#9fb0c0;background:var(--greybg);}#taxScreen .chip.blue{color:var(--blue2);background:var(--bluebg);border-color:#1d4266;}
#taxScreen .dbody{display:none;border-top:1px solid var(--line);}#taxScreen .dgroup.open .dbody{display:block;}
#taxScreen .toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;}
#taxScreen .clear{color:var(--dim);font-size:12px;background:none;border:none;padding:0;text-decoration:underline;cursor:pointer;}#taxScreen .clear:hover{color:var(--red);}
#taxScreen .legend{color:var(--dim);font-size:12px;margin:8px 2px 0;line-height:1.7;}
#taxScreen footer{color:var(--dim);font-size:11.5px;margin-top:30px;line-height:1.7;border-top:1px solid var(--line);padding-top:14px;}
  /* modal */
#taxScreen .backdrop{position:fixed;inset:0;background:rgba(4,7,11,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
#taxScreen .backdrop.show{display:flex;}
#taxScreen .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:460px;width:100%;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.5);}
#taxScreen .modal h3{margin:0 0 8px;font-size:16px;}#taxScreen .modal p{color:var(--muted);font-size:13px;margin:6px 0;}
#taxScreen .modal .datebox{display:flex;gap:8px;align-items:center;margin:12px 0;}
#taxScreen .modal input[type=text]{font:inherit;font-family:var(--mono);background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:8px 10px;width:130px;text-align:center;}
#taxScreen .modal .mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap;}
#taxScreen .modal button{font:inherit;font-size:13px;cursor:pointer;border-radius:8px;padding:8px 14px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);}
#taxScreen .modal button.primary{background:#12324f;border-color:#1d4266;color:#cfe3ff;}#taxScreen .modal button.primary:hover{background:#163a5c;}
#taxScreen .modal button.ghost:hover{border-color:var(--red);color:#ffb4b0;}
#taxScreen .mono{font-family:var(--mono);color:var(--txt);}
  /* toner-friendly print: only the report, black on white */
@media screen{ #print-mount{display:none;} }
      body.taxPrint #print-mount{display:block;color:#000;font-family:Arial,Helvetica,sans-serif;}
      body.taxPrint #print-mount h1{font-size:15pt;margin:0 0 4pt;color:#000;}
      body.taxPrint #print-mount .prmeta{font-size:9pt;color:#000;margin-bottom:10pt;}
      body.taxPrint #print-mount table{border-collapse:collapse;width:100%;font-size:10pt;color:#000;}
      body.taxPrint #print-mount th,#print-mount td{border:1px solid #000;padding:3pt 6pt;text-align:left;vertical-align:top;}
      body.taxPrint #print-mount thead th{background:#fff;font-weight:bold;}
      body.taxPrint #print-mount tbody tr{page-break-inside:avoid;}
      body.taxPrint #print-mount .prfoot{margin-top:10pt;font-size:8pt;color:#000;}
  @page{margin:12mm;}
@media print{
  body.taxPrint #print-mount{display:block !important}
  body.taxPrint #printSheet{display:none !important}
}

<script id="parser">
/* ================= PARSER (DOM-free) ================= */
"use strict";

const TARGET_DEPTS = ["RESTAURANT","CAFETERIA","TAVERNAKI","KAFENIO","BAR"];
const INTERFACE_USER = "IFC";   // POS interface — its negatives are voids; a human's negatives = consolidation → VOID
const MONEY_RE = /^-?\d{1,3}(?:\.\d{3})*,\d{2}$/;

function moneyToNum(s){ return Math.round(parseFloat(s.replace(/\./g,"").replace(",","."))*100)/100; }
function numToMoney(n){
  const neg = n < -0.004;
  n = Math.abs(n);
  const [i,d] = n.toFixed(2).split(".");
  return (neg?"-":"") + i.replace(/\B(?=(\d{3})+(?!\d))/g,".") + "," + d;
}

/* ---- ZIP reading (EOCD → central dir → deflate-raw) ---- */
async function unzipFpages(buf){
  const dv = new DataView(buf);
  const len = buf.byteLength;
  let eocd = -1;
  const stop = Math.max(0, len - 22 - 65557);
  for(let i = len - 22; i >= stop; i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error("Not a valid OXPS/ZIP file (no central directory).");
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const td = new TextDecoder("utf-8");
  const entries = [];
  for(let i = 0; i < count; i++){
    if(dv.getUint32(p, true) !== 0x02014b50) break;
    const method   = dv.getUint16(p + 10, true);
    const csize    = dv.getUint32(p + 20, true);
    const nameLen  = dv.getUint16(p + 28, true);
    const extraLen = dv.getUint16(p + 30, true);
    const cmtLen   = dv.getUint16(p + 32, true);
    const lho      = dv.getUint32(p + 42, true);
    const name = td.decode(new Uint8Array(buf, p + 46, nameLen));
    entries.push({name, method, csize, lho});
    p += 46 + nameLen + extraLen + cmtLen;
  }
  const fpages = entries
    .filter(e => /Documents\/1\/Pages\/\d+\.fpage$/i.test(e.name))
    .sort((a,b) => parseInt(a.name.match(/(\d+)\.fpage/i)[1]) - parseInt(b.name.match(/(\d+)\.fpage/i)[1]));
  if(!fpages.length) throw new Error("No page content (.fpage) found — is this a protel OXPS report?");
  const xmls = [];
  for(const e of fpages){
    const nl = dv.getUint16(e.lho + 26, true);
    const xl = dv.getUint16(e.lho + 28, true);
    const start = e.lho + 30 + nl + xl;
    const bytes = new Uint8Array(buf, start, e.csize);
    let out;
    if(e.method === 0){
      out = bytes;
    }else if(e.method === 8){
      const ds = new DecompressionStream("deflate-raw");
      const stream = new Blob([bytes]).stream().pipeThrough(ds);
      out = new Uint8Array(await new Response(stream).arrayBuffer());
    }else{
      throw new Error("Unsupported ZIP compression method: " + e.method);
    }
    xmls.push(td.decode(out));
  }
  return xmls;
}

/* ---- XML entity decode ---- */
function xmlDecode(s){
  return s.replace(/&(amp|lt|gt|quot|apos|#x[0-9a-fA-F]+|#\d+);/g, (m, e) => {
    if(e === "amp") return "&";
    if(e === "lt") return "<";
    if(e === "gt") return ">";
    if(e === "quot") return '"';
    if(e === "apos") return "'";
    if(e[0] === "#") return String.fromCodePoint(e[1] === "x" || e[1] === "X" ? parseInt(e.slice(2),16) : parseInt(e.slice(1),10));
    return m;
  });
}

/* ---- Glyphs → tokens (advance-gap splitting) ---- */
const SPLIT_GAP = 130;      // 1/100 em units — column gaps are 300+, intra-word ≤ ~60
const DEFAULT_ADV = 55;

function parseIndices(str, n){
  const advs = new Array(n).fill(null);
  if(!str) return advs;
  const parts = str.split(";");
  for(let i = 0; i < parts.length && i < n; i++){
    const e = parts[i].replace(/^\(\d+:\d+\)/, "");
    const f = e.split(",");
    if(f.length >= 2 && f[1] !== ""){
      const a = parseFloat(f[1]);
      if(!isNaN(a)) advs[i] = a;
    }
  }
  return advs;
}

function pageTokens(xml){
  const toks = [];
  const re = /<Glyphs\b[^>]*?\/>/g;
  let m;
  while((m = re.exec(xml))){
    const tag = m[0];
    const attr = n => { const mm = tag.match(new RegExp(n + '="([^"]*)"')); return mm ? mm[1] : null; };
    const us = attr("UnicodeString");
    const ox = attr("OriginX"), oy = attr("OriginY");
    if(us === null || ox === null || oy === null) continue;
    const text = xmlDecode(us);
    if(!text) continue;
    const em = parseFloat(attr("FontRenderingEmSize") || "10") || 10;
    const advs = parseIndices(attr("Indices"), text.length);
    let x = parseFloat(ox), y = parseFloat(oy);
    let cur = "", curX = x;
    for(let i = 0; i < text.length; i++){
      const a = advs[i] === null ? DEFAULT_ADV : advs[i];
      if(cur === "") curX = x;
      cur += text[i];
      if(a > SPLIT_GAP){ toks.push({x: curX, y, t: cur}); cur = ""; }
      x += a * em / 100;
    }
    if(cur) toks.push({x: curX, y, t: cur});
  }
  return toks;
}

function pageRows(xml){
  const toks = pageTokens(xml).sort((a,b) => a.y - b.y || a.x - b.x);
  const rows = [];
  // TOL must sit between the baseline jitter WITHIN one printed line (up to ~3.3
  // when a wrapped Descr: line offsets the layout) and the spacing BETWEEN lines
  // (>=10.7 in real reports). At 3 a row could split in two, orphaning its amount.
  const TOL = 6;
  for(const g of toks){
    if(rows.length && Math.abs(rows[rows.length-1].y - g.y) < TOL) rows[rows.length-1].toks.push(g);
    else rows.push({y: g.y, toks: [g]});
  }
  for(const r of rows) r.toks.sort((a,b) => a.x - b.x);
  return rows;
}

/* ---- semantic parse ---- */
const SEC_RE = /^[A-ZΑ-ΩΆΈΉΊΌΎΏΪΫ0-9][A-ZΑ-ΩΆΈΉΊΌΎΏΪΫ0-9 %&\/.\-]*$/;
const FOLIO_ROOMS = new Set(["9601","9604","9605","9608"]);

function baseDept(section){ return section.replace(/\s+\d+%$/, "").trim(); }
function rateOf(section){ const m = section.match(/(\d+)%$/); return m ? m[1] + "%" : "base"; }
function mainRoom(raw){ const m = raw.match(/^(\d+)-\d*/); return m ? m[1] : raw; }

function parseReport(xmls){
  let section = null;
  const sections = {};          // name -> {rows:[], reported:null, group:null}
  let reportDate = null, printMeta = "", reportId = null, title = null;

  for(const xml of xmls){
    for(const row of pageRows(xml)){
      const toks = row.toks;
      const joined = toks.map(t => t.t).join(" ").trim();

      if(!reportDate){
        const dm = toks.find(t => /^\d{1,2}\/\d{1,2}\/\d{4}$/.test(t.t.trim()));
        if(dm && toks.some(t => t.t.includes("protel"))) reportDate = dm.t.trim();
      }
      if(!printMeta && joined.includes("List of postings")) printMeta = joined;
      if(!reportId && toks.some(t => t.t.trim() === "protel")){
        const idTok = toks.find(t => t.t.trim() !== "protel"
                                  && !/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(t.t.trim())
                                  && /[A-Za-z]/.test(t.t));
        if(idTok) reportId = idTok.t.trim();
      }
      if(!title && joined.includes("ΕΛΕΓΧΟΣ ΤΜΗΜΑΤΩΝ")) title = joined;

      // section header: single token, left margin
      if(toks.length === 1 && toks[0].x < 60 && SEC_RE.test(joined) && !joined.startsWith("Date/time")){
        section = joined;
        if(!sections[section]) sections[section] = {rows: [], reported: null, group: null};
        continue;
      }
      if(!section) continue;
      const S = sections[section];

      const timeTok = toks.find(t => t.x >= 78 && t.x < 120 && /^\d{2}:\d{2}$/.test(t.t.trim()));
      if(timeTok){
        // detail row
        const dateTok  = toks.find(t => t.x < 78 && /^\d{1,2}\/\d{1,2}\/\d{4}$/.test(t.t.trim()));
        const userTok  = toks.find(t => t.x >= 115 && t.x < 152);
        const roomTok  = toks.find(t => t.x >= 152 && t.x < 236);
        // guest name: single token drawn at x≈240; protel itself truncates it to
        // the column width (~24 chars), so a longer name simply isn't in the file.
        // NOTE: article text can start slightly LEFT of the qty token (seen at
        // x≈406 vs qty at x≈409), so the 402 boundary must stay fixed — do not
        // anchor it to the qty position.
        const guest    = toks.filter(t => t.x >= 236 && t.x < 402).map(t => t.t.trim()).join(" ").trim();
        let qty = null, amt = null;
        for(const t of toks){
          const s = t.t.trim();
          if(t.x >= 388 && t.x < 424 && /^-?\d+$/.test(s)) qty = parseInt(s, 10);
          if(t.x > 600 && MONEY_RE.test(s)) amt = moneyToNum(s);
        }
        const textStr = toks.filter(t => t.x >= 402 && t.x < 700 && !/^-?\d+$/.test(t.t.trim()))
                            .map(t => t.t).join(" ");
        const recM = textStr.match(/Rec:\s*(\d+)/);
        if(!reportDate && dateTok) reportDate = dateTok.t.trim();
        S.rows.push({
          time: timeTok.t.trim(),
          user: userTok ? userTok.t.trim() : "",
          room: roomTok ? roomTok.t.trim() : "",
          guest, qty: qty === null ? 1 : qty,
          amount: amt === null ? 0 : amt,
          sn: recM ? recM[1] : null,
          text: textStr.trim()
        });
        continue;
      }

      // section reported total: [groupLabel, money], label starts right of centre
      if(toks.length === 2 && toks[0].x > 300 && MONEY_RE.test(toks[1].t.trim())
         && toks[0].t.trim() !== "Total" && !joined.includes("TOTAL")){
        if(S.reported === null){
          S.reported = moneyToNum(toks[1].t.trim());
          S.group = toks[0].t.trim();
        }
      }
    }
  }
  return {sections, reportDate: reportDate || "?", printMeta, reportId, title};
}

function isCheckcharge(parsed){
  return /checkcharge/i.test(parsed.reportId || "") || /ΕΛΕΓΧΟΣ ΤΜΗΜΑΤΩΝ/.test(parsed.title || "");
}

/* ---- receipt model ---- */
function buildModel(parsed){
  const {sections, reportDate} = parsed;
  const validation = [];         // {section, parsed, reported, ok}
  const depts = {};              // base -> {receipts: Map(sn -> receipt), other: [], sections: [names]}
  for(const b of TARGET_DEPTS) depts[b] = {receipts: new Map(), other: [], sections: []};

  for(const [name, S] of Object.entries(sections)){
    const base = baseDept(name);
    let sum = 0;
    for(const r of S.rows) sum += r.amount;
    sum = Math.round(sum * 100) / 100;
    const ok = S.reported === null ? null : Math.abs(sum - S.reported) < 0.005;
    validation.push({section: name, parsed: sum, reported: S.reported, ok});

    if(!TARGET_DEPTS.includes(base)) continue;
    const D = depts[base];
    D.sections.push(name);
    const rate = rateOf(name);
    for(const r of S.rows){
      if(!r.sn || FOLIO_ROOMS.has(r.room)){
        D.other.push({...r, section: name, rate});
        continue;
      }
      const rk = r.sn + "|" + mainRoom(r.room);
      let rec = D.receipts.get(rk);
      if(!rec){
        rec = {dept: base, sn: r.sn, room: r.room, roomMain: mainRoom(r.room), guest: r.guest,
               rates: {}, total: 0, entries: []};
        D.receipts.set(rk, rec);
      }
      rec.rates[rate] = Math.round(((rec.rates[rate] || 0) + r.amount) * 100) / 100;
      rec.total = Math.round((rec.total + r.amount) * 100) / 100;
      rec.entries.push({...r, section: name, rate});
      if(!rec.room && r.room){ rec.room = r.room; rec.roomMain = mainRoom(r.room); }
    }
  }

  // cross-department consolidation: same SN + same main room = one physical
  // receipt split across departments by user error at the POS -> show only one
  const byKey = new Map();
  for(const b of TARGET_DEPTS){
    for(const r of depts[b].receipts.values()){
      const k = r.sn + "|" + r.roomMain;
      if(!byKey.has(k)) byKey.set(k, []);
      byKey.get(k).push(r);
    }
  }
  for(const group of byKey.values()){
    if(group.length < 2) continue;
    group.sort((a,c) => Math.abs(c.total) - Math.abs(a.total));   // primary = largest share
    const prim = group[0];
    prim.mergedFrom = group.map(g => g.dept);
    for(const dup of group.slice(1)){
      for(const [rate, v] of Object.entries(dup.rates)){
        prim.rates[rate] = Math.round(((prim.rates[rate] || 0) + v) * 100) / 100;
      }
      prim.total = Math.round((prim.total + dup.total) * 100) / 100;
      prim.entries.push(...dup.entries);
      depts[dup.dept].receipts.delete(dup.sn + "|" + dup.roomMain);
    }
  }

  // flatten + cancelled detection
  const receipts = [];
  for(const b of TARGET_DEPTS){
    const list = [...depts[b].receipts.values()];
    list.sort((a,c) => (parseInt(a.roomMain)||0) - (parseInt(c.roomMain)||0) || a.sn.localeCompare(c.sn, undefined, {numeric:true}));
    for(const r of list){
      let pos = 0; const posRates = {};
      let paidSum = 0; const paidBy = new Set();
      for(const e of r.entries){
        if(e.amount > 0){
          pos += e.amount;
          posRates[e.rate] = Math.round(((posRates[e.rate] || 0) + e.amount) * 100) / 100;
        }else if(e.amount < 0 && e.user !== INTERFACE_USER){
          paidSum += -e.amount;
          paidBy.add(e.user);
        }
      }
      r.posTotal = Math.round(pos * 100) / 100;
      r.posRates = posRates;
      r.paidAmount = Math.round(paidSum * 100) / 100;
      r.paidBy = [...paidBy];
      const net0 = Math.abs(r.total) < 0.005;
      r.voided = net0 && r.paidBy.length > 0;      // consolidated by a person — VOID, excluded from totals
      r.cancelled = net0 && r.paidBy.length === 0; // voided by the interface — hide it
      receipts.push(r);
    }
    depts[b].list = list;
  }

  // still-open detection: the ΜΕΤΡΗΤΑ ΤΜΗΜΑΤΩΝ consolidation posting (folio 9601)
  // is written when the POS department closes for the night; until it appears the
  // department may still add receipts while the check is underway.
  for(const b of TARGET_DEPTS){
    const D = depts[b];
    const hasActivity = (D.list && D.list.length) || D.other.length;
    D.stillOpen = !!hasActivity && !D.other.some(o => /ΜΕΤΡΗΤΑ/.test(o.guest || "") || o.room === "9601");
  }
  return {reportDate, depts, receipts, validation};
}

if(typeof module !== "undefined" && module.exports){

  "fb.back": "← Μενού", "fb.empty": "δεν υπάρχουν αναφορές στον φάκελο — τα νέα .oxps εμφανίζονται εδώ αυτόματα. Στο protel: βγάλτε τη λίστα, Printer setup → Microsoft XPS Document Writer → Print, και αποθηκεύστε τη σε αυτόν τον φάκελο.",
  "help.tab": "ΟΔΗΓΙΕΣ", "help.close": "απόκρυψη οδηγιών",
  "help.deptTitle": "ΟΔΗΓΙΕΣ — ΕΛΕΓΧΟΣ ΤΜΗΜΑΤΩΝ",
  "help.deptBody": "<h4>1 · Εξαγωγή της αναφοράς από το protel</h4><ol><li>Στο protel βγάλτε τη λίστα <b>ΕΛΕΓΧΟΣ ΤΜΗΜΑΤΩΝ BY ROOM</b> για τη βραδιά (εσωτερικά το protel τη λέει checkcharge1).</li><li>Πατήστε <b>Printer setup</b> και διαλέξτε <b>Microsoft XPS Document Writer</b>.</li><li>Πατήστε <b>Print</b> και αποθηκεύστε το αρχείο στον φάκελο αναφορών του Ελέγχου Τμημάτων.</li></ol><h4>2 · Άνοιγμα εδώ</h4><ol><li>Μενού → <b>ΕΛΕΓΧΟΣ</b> → <b>ΕΛΕΓΧΟΣ ΤΜΗΜΑΤΩΝ</b> και κλικ στο αρχείο — το πιο φρέσκο έχει σήμανση <b>αποψινό</b>.</li></ol><h4>3 · Έλεγχος αποδείξεων</h4><ol><li>Πάρτε τις τυπωμένες αποδείξεις POS και πληκτρολογήστε κάθε σειριακό αριθμό στην αναζήτηση.</li><li>Το ταίριασμα δείχνει δωμάτιο, όνομα και ποσά — αν το χαρτί συμφωνεί, σημειώστε OK.</li><li>Κάτι λάθος; Τα κουμπιά της κάρτας διορθώνουν λάθος ποσό ή δωμάτιο, ή προσθέτουν απόδειξη που λείπει από την αναφορά.</li></ol><h4>4 · Κλείσιμο βραδιάς</h4><ol><li>Τμήμα χωρίς το κλείσιμο ταμείου δείχνει ένδειξη <b>OPEN</b> — κυνηγήστε το πριν το audit.</li><li>Με <b>Ctrl+P</b> τυπώνεται το φύλλο διορθώσεων για τη reception.</li></ol><div class='hnote'>Το συρτάρι δεξιά κρατά λίστα παρακολούθησης (σειριακός / δωμάτιο / υπογραφή) και ψευδώνυμα δωματίων — τα ταιριάσματα σε δωμάτια υπό παρακολούθηση φωτίζονται κίτρινα.</div>",
  "help.taxTitle": "ΟΔΗΓΙΕΣ — ΕΛΕΓΧΟΣ ΤΑ",
  "help.taxBody": "<h4>1 · Εξαγωγή των αναφορών από το protel</h4><ol><li>Βγάλτε τη λίστα πληρότητας <b>Rate Check</b> για τη βραδιά.</li><li>Για τη λίστα τέλους διαμονής: <b>Office → Internal reporting → Room charges (history)</b>.</li><li>Για καθεμία: <b>Printer setup</b> → <b>Microsoft XPS Document Writer</b> → <b>Print</b>, και αποθήκευση στον φάκελο του Ελέγχου ΤΑ.</li></ol><h4>2 · Φόρτωμα στις δύο θέσεις</h4><ol><li>Κλικ σε κάθε θέση και επιλογή του αρχείου της. Με τα δύο μαζί γίνεται διασταύρωση· μόνο το Tax δουλεύει κι αυτό, με λιγότερους ελέγχους.</li></ol><h4>3 · Οι ενότητες</h4><ol><li><b>Κατειλημμένο χωρίς arrangement</b> — το δωμάτιο χρωστά ΤΑ αλλά δεν έχει καταχώρηση.</li><li><b>Λείπει το αυτόματο ΤΑ</b> — δεν έτρεξε η αυτόματη καταχώρηση.</li><li><b>Υπερχρέωση ΤΑ</b> — περισσότερα ΤΑ από νύχτες. Το <b>Το είδα</b> το κρύβει οριστικά· ξαναεμφανίζεται μόνο αν αλλάξει κάτι στο δωμάτιο.</li><li><b>Συγκοινωνούντα δωμάτια</b> — έλεγχος στο χέρι και σήμανση Εντάξει / Λείπει.</li></ol><h4>4 · Οι νύχτες από κάτω</h4><ol><li>Η μνήμη κρατά τις τελευταίες νύχτες ανά δωμάτιο. Χαρακτηρίστε δωμάτια χωρίς άφιξη ως <b>άφιξη</b> / <b>αναχώρηση</b> για να σταματούν οι ψεύτικοι συναγερμοί.</li><li>Η λίστα ⚠ τυπώνεται για τη reception.</li></ol>",
  "cl.help": "Γράψτε τι πρέπει να γίνει απόψε, διαλέξτε <b>ΣΟΒΑΡΟΤΗΤΑ</b> (το χρώμα της κουκκίδας) και πατήστε <b>Προσθήκη</b>. Με <b>αλλαγή</b> / <b>διαγραφή</b> σε κάθε γραμμή τη διορθώνετε, και με <b>\u25B2</b> / <b>\u25BC</b> την ανεβοκατεβάζετε. Τα τικ μηδενίζουν μόνα τους στις 07:00 — οι εργασίες μένουν. Το κουμπί ⧉ βάζει τη λίστα στην επιφάνεια εργασίας: η μία συντόμευση την εμφανίζει/κρύβει, η άλλη τη φέρνει σε εστίαση για τικ πάνω της (και οι δύο στο ΕΠΕΞΕΡΓΑΣΙΑ ΑΡΧΙΚΗΣ → ΠΡΟΣΑΡΜΟΓΗ ΕΠΙΚΑΛΥΨΗΣ).",

/* THE PROTEL NAMES, straight into the room database. His call, 04/09.

   whose name has changed as a room that has turned over: it stamps `movedOn` and DELETES
   the nickname. Every room would trip it the first time this ran, because the uncut name
   is by definition different from the cut one — and marking two hundred rooms as having
   changed guest is exactly the shape of the 30/08 damage. A longer form of the same name
   is not a change of guest. So this writes the name and the night it came from, and
   touches nothing else: no movedOn, no nickname, no seen-date guard.

   `liveKey` is what lets guestFor prefer this over the receipt's truncated name, and only
   for the night it belongs to. */
function ingestLiveNames(rate){
  if(!rate || !rate.rooms || !rate.dateKey) return 0;
  let wrote = 0;
  for(const room of Object.keys(rate.rooms)){
    const name = String(rate.rooms[room].name || "").trim();
    if(!name) continue;
    const e = ROOMS[room];
    if(!e){ ROOMS[room] = {guest: name, seen: null, liveKey: rate.dateKey}; wrote++; continue; }

/* feed tonight's report into the DB: rooms are the stable keys, guest names the
   changing part — a changed guest resets that room's nickname.
   Two guards keep this honest:
   – time: viewing an OLDER report must never rewrite newer knowledge (it used to
     silently kill fresh nicknames and plant stale guest names);
   – ambiguity: if one night shows TWO different guests for a room (same-day
     changeover), skip that room until a night speaks with one voice. */
function dateNum(d){
  const m = String(d || "").match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  return m ? (+m[3]) * 10000 + (+m[2]) * 100 + (+m[1]) : 0;
}
/* the calendar day before, right across month and year ends */
function prevNightKey(k){
  if(!k) return 0;
  const dt = new Date(Date.UTC(Math.floor(k / 10000), Math.floor(k / 100) % 100 - 1, k % 100));
  dt.setUTCDate(dt.getUTCDate() - 1);
  return dt.getUTCFullYear() * 10000 + (dt.getUTCMonth() + 1) * 100 + dt.getUTCDate();

/* The same person, spelled the same way. Deliberately NOT the forgiving sameGuest() the
