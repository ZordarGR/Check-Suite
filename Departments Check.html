   question when SHORTENING a stay and the wrong one here. Carrying a nickname onto the
   wrong guest is worse than not carrying it, so this demands the same name — trimmed and
   case-folded, which cannot make two different names match. */
function sameName(a, b){
  const n = x => String(x || "").trim().replace(/\s+/g, " ").toUpperCase();
  const A = n(a);
  return !!A && A === n(b);
}
function syncRooms(){
  const dropped = [], watchHit = [], moved = [];
  const gm = {};                                  // roomMain -> Set of guest names
  for(const r of MODEL.receipts){
    if(!r.roomMain || !r.guest) continue;
    (gm[r.roomMain] = gm[r.roomMain] || new Set()).add(r.guest.trim());
  }
  const rd = dateNum(MODEL.reportDate);
  /* Worked out in full before anything is written: a room change is a question about two
     rooms at once, and the second one cannot be answered halfway through updating the
     first. Same reason for the snapshot below. */
  const tonight = {};                             // room -> the one guest charging to it
  for(const [room, guests] of Object.entries(gm)){
    if(guests.size > 1) continue;                 // changeover night — leave the room alone
    tonight[room] = guests.values().next().value;
  }
  const before = {};                              // ROOMS as it stood before tonight
  for(const [room, e] of Object.entries(ROOMS))
    before[room] = {guest: e.guest, nick: e.nick, seen: e.seen};

  for(const [room, g] of Object.entries(tonight)){
    const e = ROOMS[room];
    if(!e){ ROOMS[room] = {guest: g, seen: MODEL.reportDate}; continue; }
    if(rd && e.seen && dateNum(e.seen) > rd) continue;   // older report — read-only
    /* A NAME THAT CAME LIVE FROM PROTEL IS NOT A CHANGED GUEST.
       It is the same person, in full; the receipt's is the truncation, and truncation is
       the entire reason the live read exists. Without this, the first night both sources
       are used every room looks "changed" at once, and the block below would mark them
       all movedOn, delete every nickname, fire the watchlist on each, and then overwrite
       the good name with the cut one. Four kinds of silent damage out of one comparison,
       on his real data — the 30/08 shape exactly.

       Two independent ways of recognising it, either sufficient: the stored name was read
       for THIS night, or the receipt's name is that name's opening (which is what a cut
       name is). The better name stays and nothing is inferred from the difference. */
    /* isCutOf, not a raw indexOf: it normalises case and spacing, so a receipt name that
       differs only in whitespace still reads as the truncation it is instead of slipping
       past this guard into the block that deletes his nicknames. */
    const fromProtel = !!e.liveKey && ((rd && e.liveKey === rd) || isCutOf(g, e.guest));
    if(fromProtel){ e.seen = MODEL.reportDate; continue; }
    /* sameName, not !==: two names that differ only in case or spacing are one guest, and
       reading them as a turnover marks the room and deletes its nickname. */
    const changed = !!(e.guest && !sameName(e.guest, g));
    /* Stamped so the room can be marked as having turned over on a night whose rate
       list was never opened. It is weaker evidence than an arrival or departure date —
       it says the name under this room is not the name that was here before, which
       could equally be a correction — so it is shown as inferred, never as fact. */
    if(changed) e.movedOn = MODEL.reportDate;
    if(changed && e.nick){
      dropped.push(room + " (" + e.nick + ")");
      delete e.nick;
    }
    if(changed && WATCH.some(w => String(w.room) === room))
      watchHit.push({room, oldGuest: e.guest, newGuest: g});
    e.guest = g;
    e.seen = MODEL.reportDate;
  }
  /* ---- a guest who changed rooms has not left ----
     protel's report only ever lists rooms that were charged, so the room somebody moved
     OUT of is simply absent from it — there is no event to read, and the nickname would
     sit on an empty room for ever while the guest's new room got none.

     So: if the name now charging a room is exactly the name that carried a nickname in
     another room tonight or last night, and that other room is not still charging under
     it, they moved. Take the nickname with them.

     Two guards, both deliberately strict. The old room still charging under that name is
     not a move — that is one party across two rooms. And two rooms holding the same name
     is not evidence of anything, so an ambiguous match moves nothing at all. */
  if(rd){
    const prev = prevNightKey(rd);
    for(const [room, g] of Object.entries(tonight)){
      const e = ROOMS[room];
      if(!e || (e.seen && dateNum(e.seen) > rd)) continue;
      if(e.nick) continue;                        // already labelled: nothing to carry in
      const was = before[room];
      if(was && was.guest && sameName(was.guest, g)) continue;   // same guest as before
      const from = [];
      for(const [src, b] of Object.entries(before)){
        if(src === room || !b.nick || !sameName(b.guest, g)) continue;
        const sn = dateNum(b.seen);
        if(sn !== rd && sn !== prev) continue;
        if(tonight[src] && sameName(tonight[src], g)) continue;  // still charging there
        from.push(src);
      }
      if(from.length !== 1) continue;
      const src = from[0];
      e.nick = before[src].nick;
      if(ROOMS[src]) delete ROOMS[src].nick;
      moved.push(src + " → " + room + " (" + e.nick + ")");
    }
  }
  saveRooms();
  if(dropped.length)
    setTimeout(() => toast(t("n.reset") + dropped.join(" · "), true), 700);
  /* Never silently: moving someone's label between rooms is exactly the kind of thing
     that has to be visible the night it happens. */
  if(moved.length)
    setTimeout(() => toast(t("n.moved") + moved.join(" · "), true), 1100);
  if(watchHit.length)
    setTimeout(() => openWatchChangePrompt(watchHit), 900);
}

function nickFor(room){ const e = ROOMS[String(room)]; return (e && e.nick) ? e.nick : null; }
/* Is `short` what the .oxps made of `full`? A cut name is the opening of the whole one,
   so this asks that directly instead of reasoning about dates. Four characters minimum,
   so an initial does not match half the hotel. */
function isCutOf(short, full){
  const n = x => String(x || "").trim().replace(/\s+/g, " ").toUpperCase();
  const a = n(short), b = n(full);
  return a.length >= 4 && b.length > a.length && b.indexOf(a) === 0;
}
function guestFor(room){
  /* A name read live from protel BEATS the one on the receipt. It is the same guest —
     the .oxps simply truncates it, and that truncation is the entire reason this exists.

     THE FIRST VERSION OF THIS ASKED THE WRONG QUESTION. It preferred the live name only
     when the in-house list's date equalled the report's night, and he found what that
     costs: he audits the night that has just ended, while protel's in-house list always
     says TODAY. At one in the morning those are different days and every name fell back
     to the cut one — the fix looked like it had done nothing.

     So it asks about the NAMES instead. If the receipt's name is the opening of the
     stored one, it is the same guest truncated and the whole name wins. If the room has
     turned over, the new guest's name is not the opening of the old one and the receipt
     wins, which is the case the date was there to protect. The date is still accepted
     when it does match, for a name protel words differently rather than merely cuts. */
  const live = ROOMS[String(room)];
  const onReceipt = (() => {
    if(!MODEL) return null;
    if(!MODEL._gm){
      const m = {};
      for(const r of MODEL.receipts) if(r.roomMain && r.guest && m[r.roomMain] === undefined) m[r.roomMain] = r.guest;
      MODEL._gm = m;
    }
    return MODEL._gm[String(room)] || null;
  })();
  if(live && live.guest && live.liveKey){
    if(!onReceipt) return live.guest;                          // nothing to disagree with
    if(isCutOf(onReceipt, live.guest)) return live.guest;      // the same guest, in full
    if(dateNum(MODEL.reportDate) === live.liveKey) return live.guest;
  }
  if(onReceipt) return onReceipt;
  const e = ROOMS[String(room)];
  return (e && e.guest) || null;
}

   `key` is what makes an alert the SAME alert: the same missing X on the same move, seen
   again on the next read three seconds later, must not pile up a second copy. Everything
   that identifies the thing goes in it, nothing that merely describes it. */
const ALERTS_KEY = "reccheck_alerts";
const ALERTS_DONE_KEY = "reccheck_alerts_done";
const ALERTS_MAX = 400;              // a bound, like every other store in this file
const ALERTS_KEEP_NIGHTS = 14;
let ALERTS = [];
let ALERTS_DONE = {};                // key -> the night it was resolved on
function loadAlerts(){
  try{
    const a = JSON.parse(localStorage.getItem(ALERTS_KEY) || "[]");
    ALERTS = Array.isArray(a) ? a.filter(x => x && typeof x === "object" && x.key) : [];
  }catch(e){ ALERTS = []; }
  try{
    const d = JSON.parse(localStorage.getItem(ALERTS_DONE_KEY) || "{}");
    ALERTS_DONE = (d && typeof d === "object" && !Array.isArray(d)) ? d : {};
  }catch(e){ ALERTS_DONE = {}; }
  pruneAlerts();
}
function saveAlerts(){
  try{ localStorage.setItem(ALERTS_KEY, JSON.stringify(ALERTS)); }catch(e){}
  try{ localStorage.setItem(ALERTS_DONE_KEY, JSON.stringify(ALERTS_DONE)); }catch(e){}
}
/* NOTHING IN THIS FILE IS ALLOWED TO GROW FOREVER — the ledger has a date floor, the tax
   memory keeps seven days, the verify list seven nights. Alerts leave only when he presses
   Resolve, so without this a night with an unmarked move would add entries that never go,
   and a full localStorage does not fail loudly: it throws on the NEXT setItem, which is
   whatever was trying to save the ledger. Fourteen nights, and a hard ceiling under it. */
function pruneAlerts(){
  const floor = bnKey() - 10000;                       // ~a year in YYYYMMDD arithmetic
  const old = k => { const n = ALERTS_DONE[k]; return n && n < floor; };
  for(const k of Object.keys(ALERTS_DONE)) if(old(k)) delete ALERTS_DONE[k];
  const nights = [...new Set(ALERTS.map(a => a.night || 0))].sort((x, y) => y - x);
  const keep = new Set(nights.slice(0, ALERTS_KEEP_NIGHTS));
  ALERTS = ALERTS.filter(a => keep.has(a.night || 0));
  if(ALERTS.length > ALERTS_MAX) ALERTS = ALERTS.slice(-ALERTS_MAX);
}
/* Returns true when this is one we had not already recorded. */
function addAlert(a){
  if(!a || !a.key) return false;
  /* RESOLVED MEANS RESOLVED. The moves window is read every five seconds, so the row he
     just dismissed is back before he has let go of the mouse. Without a record of what he
     resolved, "remove them entirely" lasted five seconds and the button pulsed again. */
  if(ALERTS_DONE[a.key]) return false;
  if(ALERTS.some(x => x.key === a.key)) return false;
  ALERTS.push({key: a.key, kind: a.kind || "", text: a.text || "",
               night: a.night || bnKey(), at: a.at || "", read: false});
  pruneAlerts();
  saveAlerts();
  paintAlertsBtn();
  /* If he is standing on the list when one arrives, he should see it arrive. */
  if(typeof SCREEN !== "undefined" && SCREEN === "alerts") renderAlerts();
  return true;
}
function resolveAlert(key){
  const before = ALERTS.length;
  ALERTS = ALERTS.filter(x => x.key !== key);
  if(ALERTS.length === before) return;
  ALERTS_DONE[key] = bnKey();
  saveAlerts(); paintAlertsBtn(); renderAlerts();
}
function unreadAlerts(){ return ALERTS.filter(x => !x.read).length; }
function markAlertsRead(){
  if(!unreadAlerts()) return;
  for(const a of ALERTS) a.read = true;
  saveAlerts();
  paintAlertsBtn();
}
function paintAlertsBtn(){
  const b = $("#alertsBtn");
  if(!b) return;
  const n = ALERTS.length, u = unreadAlerts();
  b.querySelector(".mLabel").textContent = t("al.title");
  b.querySelector(".mSub").textContent = n ? t("al.count", {n: n}) : t("al.none");
  b.classList.toggle("unread", u > 0);
}
function renderAlerts(){
  const box = $("#alList");
  if(!box) return;
  box.innerHTML = "";
  if(!ALERTS.length){
    const d = el("div", "alNone", t("al.empty"));
    box.append(d);
    return;
  }
  /* newest night first; within a night, newest alert first */
  const nights = [...new Set(ALERTS.map(a => a.night || 0))].sort((x, y) => y - x);
  for(const night of nights){
    const head = el("div", "alDay", night ? dfmtKey(night) : t("al.nodate"));
    box.append(head);
    const rows = ALERTS.filter(a => (a.night || 0) === night).slice().reverse();
    for(const a of rows){
      const row = el("div", "alRow");
      const txt = el("div", "alTxt", a.text || "");
      if(a.at){ const w = el("div", "alWhen", a.at); txt.append(w); }
      const btn = el("button", "btn small", t("al.resolve"));
      btn.onclick = () => resolveAlert(a.key);
      row.append(txt, btn);
      box.append(row);
    }
  }
}
/* YYYYMMDD -> the d/m/yyyy he reads everywhere else */
function dfmtKey(k){
  const s = String(k);
  if(s.length !== 8) return s;
  return (+s.slice(6, 8)) + "/" + (+s.slice(4, 6)) + "/" + s.slice(0, 4);
}

/* ---------- sense of time: two boundaries, because two different things roll over ----------
   The WORKING NIGHT is protel's date: it turns at 03:30. Everything that answers "which
   night is this report for" reads this one — the welcome line, "last night" / "N nights
   ago", the TONIGHT badge in the file browser, the past-report warning in Tax Check.

   The SHIFT still ends at 07:00. The checklist ticks and the desktop overlay clear then,
   because those are about the shift being stood, not about protel's date. */
const NIGHT_ROLLOVER_H = 3.5;      // working night — protel's date turns at 03:30
const SHIFT_ROLLOVER_H = 7;        // checklist + overlay ticks — the shift ends at 07:00
/* Which day a moment belongs to, by the clock on the wall.

   This used to be `new Date(now - h hours)` — subtract a span of ABSOLUTE time, then read
   the local date off the result. That is a whole hour wrong on the two nights the clock
   moves, because an hour of local time vanishes in March and repeats in October, so
   "seven hours ago" stops landing where 07:00 is. The reset would have gone at 08:00 one
   night in spring and 06:00 one night in autumn.

   Comparing the local hour against the boundary and stepping the local DATE back cannot
   drift: the boundary is 07:00 by the wall clock every night, including those two. On the
   spring night 03:30 does not exist, so the working night turns at the first local time
   that does — which is right, not a compromise.

   The reset itself was never the fragile part. It stores the day key and compares, on a
   30 s poll, so a machine that was asleep or an app that was closed at 07:00 still clears
   on the next look, and the clock being corrected by its time server just gets re-read.
   That half stays exactly as it was. */
function dayAt(h, ms){
  const d = new Date(ms === undefined ? Date.now() : ms);
  const hh = Math.floor(h), mm = Math.round((h - hh) * 60);
  if(d.getHours() < hh || (d.getHours() === hh && d.getMinutes() < mm)) d.setDate(d.getDate() - 1);
  return d;
}
function dayKeyAt(h, ms){
  const d = dayAt(h, ms);
  return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
}
function businessNightDate(){ return dayAt(NIGHT_ROLLOVER_H); }
function bnKey(){ return dayKeyAt(NIGHT_ROLLOVER_H); }
function bnKeyOf(ms){ return dayKeyAt(NIGHT_ROLLOVER_H, ms); }
function shiftKey(){ return dayKeyAt(SHIFT_ROLLOVER_H); }
function nightsAgoKey(key){                       // how many nights before the current working night
  if(!key) return null;
  const b = businessNightDate();
  const cur = new Date(b.getFullYear(), b.getMonth(), b.getDate());
  const that = new Date(Math.floor(key / 10000), Math.floor(key / 100) % 100 - 1, key % 100);
  return Math.round((cur - that) / 86400e3);
}
function relNight(key){
  const ago = nightsAgoKey(key);
  if(ago === null) return "";
  if(ago === 0) return t("rel.tonight");
  if(ago === 1) return t("rel.lastnight");
  return t("rel.ago", {n: ago});
}
function paintClock(){
  const wl = $("#welcomeLine");
  if(!wl) return;
  const b = businessNightDate(), now = new Date();
  wl.textContent = t("welcome.night", {
    d: pad2(b.getDate()) + "/" + pad2(b.getMonth() + 1),
    cd: now.getDate() + "/" + (now.getMonth() + 1),
    t: now.getHours() + ":" + pad2(now.getMinutes())
  });
}

/* ---------- home checklist ---------- */
let CL = (function(){ try{ const a = JSON.parse(localStorage.getItem("reccheck_checklist") || "[]"); return Array.isArray(a) ? a : []; }catch(e){ return []; } })();
let CLEDIT = false;        // edit mode on/off
let CLEDITID = null;       // task id currently being edited in the form
let CLTIER = "low";
function saveCL(){ try{ localStorage.setItem("reccheck_checklist", JSON.stringify(CL)); }catch(e){} }
/* How many columns the checklist should use, and how tall each one is.

   Measured, not guessed: the space a column has is the gap between the top of the list
   and the top of the audit button, which the flex layout has already settled. Both ends
   are stable whatever the column count, so this does not chase its own tail — the row
   below the list never moves because the list got shorter.

   The width is capped so the card never eats the gutter that "Switch user" parks in. */
const CL_COL = 268, CL_GAP = 22, CL_PAD = 18, CL_MAXCOLS = 4;
function layoutChecklist(){
  if(SCREEN !== "menu") return;
  const list = $("#clList"), card = $("#checklist"), btn = $("#auditBtn"), ms = $("#menuScreen");
  if(!list || !card || !btn || !ms) return;
  const rows = list.children.length;
  const setW = w => document.body.style.setProperty("--homeW", w + "px");
  if(rows < 2){ document.body.style.setProperty("--clRows", "999"); setW(640); return; }

  const rowH = list.children[0].getBoundingClientRect().height || 42;
  const cs = getComputedStyle(card);
  const chrome = parseFloat(cs.paddingBottom) + parseFloat(cs.marginBottom);
  const avail = ms.getBoundingClientRect().bottom - list.getBoundingClientRect().top
              - chrome - btn.getBoundingClientRect().height;
  const perCol = Math.max(1, Math.floor(avail / rowH));

  const landing = $("#landing").getBoundingClientRect().width
                - parseFloat(getComputedStyle($("#landing")).paddingLeft) * 2;
  /* "Switch user" parks in the gutter beside the card, and the gutter it needs is
     measured against the WINDOW, not against #landing — the card is centred on screen,
     so the space either side of it is what matters. Reserving against #landing instead
     cost a whole column. Only reserved when that button is actually on screen; below
     1000px it has already fallen back into the header row. */
  const needGutter = window.innerWidth > 1000
                     && getComputedStyle($("#userBtn")).display !== "none";
  const roomForCard = Math.min(landing, needGutter ? window.innerWidth - 280 : Infinity);
  const byWidth = Math.max(1, Math.floor((roomForCard - CL_PAD * 2 + CL_GAP) / (CL_COL + CL_GAP)));
  const cap = Math.max(1, Math.min(byWidth, CL_MAXCOLS));
  const apply = c => {
    document.body.style.setProperty("--clRows", String(Math.ceil(rows / c)));
    /* never NARROWER than the familiar single-column card — adding a second column must
       not make the block shrink; it just splits the same 640px into two */
    setW(c === 1 ? 640
        : Math.min(Math.max(640, Math.round(c * CL_COL + (c - 1) * CL_GAP + CL_PAD * 2)),
                   Math.round(roomForCard)));
  };

  let cols = Math.max(1, Math.min(Math.ceil(rows / perCol), cap));
  apply(cols);
  /* Arithmetic on an assumed row height is off by a row often enough to matter — rows
     are not all the same height once a task title wraps. So rather than trust the sum,
     look: while it still does not fit and there is width for another column, take it.
     Bounded by the width cap, so this always ends. */
  while(cols < cap && list.scrollHeight > list.clientHeight + 1) apply(++cols);
}

/* ---- Protel Shortcuts ---------------------------------------------------
   Split out of the overlay settings in 1.12: these bindings have nothing to do
   with the overlay, and each now carries an explanation of WHY it exists.
   Profiles keep one person's bindings intact when someone else covers the shift.
   Naming and deleting happen inline — Electron has no window.prompt, and a second
   openModal would tear down this dialog. */
const SC_ACTIONS = ["tau", "altf4", "altn", "seq"];
let SCSTATE = null, PROFILE_NAME = "";
function vkName(vk){
  if(vk >= 0x30 && vk <= 0x39) return String.fromCharCode(vk);          // 0-9
  if(vk >= 0x41 && vk <= 0x5A) return String.fromCharCode(vk);          // A-Z
  if(vk >= 0x70 && vk <= 0x87) return "F" + (vk - 0x6F);                // F1-F24
  if(vk >= 0x60 && vk <= 0x69) return "Num " + (vk - 0x60);
  const named = {8:"Backspace",9:"Tab",13:"Enter",27:"Esc",32:"Space",33:"PageUp",34:"PageDown",
                 35:"End",36:"Home",37:"←",38:"↑",39:"→",40:"↓",45:"Insert",46:"Delete",
                 106:"Num *",107:"Num +",109:"Num −",110:"Num .",111:"Num /",
                 186:";",187:"=",188:",",189:"−",190:".",191:"/",192:"`",
                 219:"[",220:"\\",221:"]",222:"'"};
  return named[vk] || ("Key " + vk);
}
function scMods(mods){
  const parts = [];
  if(mods & 1) parts.push("Ctrl");
  if(mods & 2) parts.push("Alt");
  if(mods & 4) parts.push("Shift");
  if(mods & 8) parts.push("Win");
  return parts;
}
function scBtnName(btn){
  return btn === 3 ? t("sc.keyMid") : btn === 4 ? t("sc.keyBack") : t("sc.keyFwd");
}
function scTriggerName(trig){
  if(!trig) return t("sc.none");
  if(trig === "m3") return scBtnName(3);          // pre-1.15 form: no modifiers
  if(trig === "m4") return scBtnName(4);
  if(trig === "m5") return scBtnName(5);
  const mm = /^m(\d+)-(\d+)$/.exec(trig);
  if(mm) return scMods(+mm[1]).concat([scBtnName(+mm[2])]).join(" + ");
  const m = /^k(\d+)-(\d+)$/.exec(trig);
  if(!m) return t("sc.none");
  return scMods(+m[1]).concat([vkName(+m[2])]).join(" + ");

   would swallow every shortcut in the middle of a shift. */
function focusState(){
  const f = (SCSTATE && SCSTATE.focus) || null;
  return {on: !!(f && f.on), needle: (f && f.needle) || ""};

function renderFocusGate(){
  const box = $("#scFocusBox");
  if(!box) return;
  const sc = window.reccheckShortcuts;
  const f = focusState();
  box.innerHTML =
    '<div class="scFocus">' +
      '<label class="scFocusTop"><input type="checkbox" id="scFocusOn"' + (f.on ? " checked" : "") + '>' +
        escapeHtml(t("sc.focusLabel")) + '</label>' +
      '<div class="scFocusSub" id="scFocusSub">' +
        escapeHtml(f.needle ? t("sc.focusMatch", {n: f.needle}) : t("sc.focusNone")) + '</div>' +
      '<button class="btn small" id="scFocusPick">' + escapeHtml(t("sc.focusPick")) + '</button>' +
    '</div>';
  const sub = $("#scFocusSub"), pick = $("#scFocusPick"), chk = $("#scFocusOn");
  const say = m => { sub.textContent = m; };
  /* Five seconds, the same countdown the Test button uses, so it reads the same way:
     start it, put protel in front, and the app reads what is actually there. */
  const runPick = async (thenOn) => {
    if(pick.dataset.busy) return null;
    pick.dataset.busy = "1";
    let n = 5;
    pick.textContent = t("sc.focusCount", {n: n});
    const iv = setInterval(() => { n--; if(n > 0) pick.textContent = t("sc.focusCount", {n: n}); }, 1000);
    const got = await sc.focusPick(5000).catch(() => null);
    clearInterval(iv);
    delete pick.dataset.busy;
    pick.textContent = t("sc.focusPick");
    /* The process name first: it is the one of the three that does not change as the
       user moves around inside protel. */
    if(got && got.self){ say(t("sc.focusSelf")); return null; }
    const needle = got && (got.exe || got.cls || got.title || "").trim();
    if(!needle){ say(t("sc.focusFail")); return null; }
    const st = await sc.focusSet(thenOn, needle).catch(() => null);
    if(st && SCSTATE) SCSTATE.focus = st;
    say(t("sc.focusGot", {n: needle, w: got.title || got.cls || "?"})
        + (thenOn ? "" : "  " + t("sc.focusIdle")));
    return needle;
  };
  pick.onclick = () => runPick(chk.checked);
  chk.onchange = async () => {
    if(!chk.checked){
      const st = await sc.focusSet(false, focusState().needle).catch(() => null);
      if(st && SCSTATE) SCSTATE.focus = st;
      say(t("sc.focusOff"));
      return;
    }

       is first, and only then switch it on. */
    if(!focusState().needle){

      return;

    const st = await sc.focusSet(true, focusState().needle).catch(() => null);

  if(!h) return {key: "sc.hDead", tone: "warn"};
  const probe = h.probe || "";
  if(probe === "missing" || h.state === "no-exe") return {key: "sc.hMissing", tone: "bad"};
  if(probe === "timeout" || probe.indexOf("spawn-error:") === 0 ||
     probe.indexOf("throw:") === 0 || probe.indexOf("no-reply:") === 0)
    return {key: "sc.hBlocked", tone: "bad"};
  if(h.state === "spawn-failed") return {key: "sc.hBlocked", tone: "bad"};
  /* THE RESIDENT, LOOKED FOR. `running` is the status verb's answer to "is the helper's
     window there?" — the one fact about the process in memory that can be established
     from outside it, and it is asked on every press. 1.17.38 read `state` instead, which
     is what tauStart writes the moment it has SPAWNED the helper and never revisits:
     "started" came back as sc.hIdle before it (a running helper described as not
     running, with advice to bind something — he read that on 05/09 while his shortcuts
     worked) and as sc.hOk after it, so a helper that died 53 ms in, the Split landmine,
     would have shown green all night with its own crash text printed underneath.
     Neither was established. This is. */
  if(h.running === true) return {key: "sc.hOk", tone: "good"};
  if(h.running === false){
    /* just spawned: the window takes a moment to exist, and a press that lands inside
       that moment — the shortcuts panel re-asks on every rebind — has not established
       that it died. It says checking, and asks once more shortly. */
    if(h.state === "started" && h.since && Date.now() - h.since < HELPER_GRACE_MS)
      return {key: "sc.hChecking", tone: "faint"};
    if(h.crash) return {key: "sc.hCrash", tone: "bad"};
    if(h.state === "started" || h.state === "running") return {key: "sc.hDead", tone: "warn"};
    return {key: "sc.hIdle", tone: "faint"};
  }
  /* no `running` in the answer: a main.js from before 1.17.39, so the spawn-time state is
     all there is and nothing about the process in memory is claimed */
  if(h.state === "running") return {key: "sc.hOk", tone: "good"};
  if(h.state === "started" || h.state === "idle") return {key: "sc.hIdle", tone: "faint"};
  // exit 3 is the helper's own "Windows would not give me the hooks"
  if(h.state === "exited"){
    if(h.code === 3) return {key: "sc.hRefused", tone: "bad"};
    // 5 is its own caught crash; 3762504530 (0xE0434352) is one the CLR caught for it
    if(h.code === 5 || h.code === 3762504530 || h.crash) return {key: "sc.hCrash", tone: "bad"};
    return {key: "sc.hDead", tone: "warn"};
  }
  return {key: "sc.hIdle", tone: "faint"};
}
function helperDetail(h){
  if(!h) return "";
  const bits = [];
  if(h.probe) bits.push("probe=" + h.probe);
  if(h.state) bits.push("state=" + h.state);
  /* WHICH EXE ANSWERED — collected since 1.17.11 and shown to nobody until 1.17.39: the
     1.17.38 line that promised "helper=vNN" never received it, because sc-helper's
     snapshot did not copy TAUINFO.ver, and the comment here asserted a data path that did
     not exist. It is labelled for what it is now. The status and ping verbs both print
     the VERSION OF THE FILE ON DISK that answered; neither asks the resident what it is,
     so "helper=" would claim a fact about the process in memory that nothing here has
     established. resident= is the status verb's answer to whether that process's window
     exists — established on every press, and what the verdict is built on. */
  if(h.ver) bits.push("exe=" + h.ver);
  if(h.running === true || h.running === false) bits.push("resident=" + (h.running ? "up" : "down"));
  if(h.code !== null && h.code !== undefined) bits.push("exit=" + h.code);
  if(h.err) bits.push("err=" + h.err);
  if(h.ranMs !== null && h.ranMs !== undefined) bits.push("ran=" + h.ranMs + "ms");
  /* the binds file that could not be written says so, instead of its intended contents
     being listed as published */
  if(h.binds === "COULD NOT WRITE") bits.push("binds=COULD NOT WRITE");
  else if(h.specs && h.specs.length) bits.push("binds=" + h.specs.join(","));
  if(h.exe) bits.push(h.exe);
  if(h.crash) bits.push("\n" + h.crash);      // the exception itself, when there is one
  return bits.join("  ");
}
/* sel/raw: the shortcuts menu gets the plain sentence, because "antivirus is blocking
   it" is something the person at the desk needs. The probe/state/exit line is only ever
   for me, so it lives in the debug menu. */
function refreshHelperStatus(sel, raw){
  sel = sel || "#scHelp";
  const box = $(sel);
  if(!box) return;
  const sc = window.reccheckShortcuts;
  const TONE = {good: "#4ade80", bad: "#f87171", warn: "#fbbf24", faint: "var(--faint)"};
  box.innerHTML = '<span style="color:var(--faint)">' + t("sc.hStatus") + ': ' +
                  t("sc.hChecking") + '</span>';
  if(!sc || !sc.helper) return;
  sc.helper().then(h => {
    const el2 = $(sel);
    if(!el2) return;                          // dialog closed while we were asking
    const v = helperVerdict(h), d = helperDetail(h);
    /* inside the grace after a spawn: one more look, when the answer is settled */
    if(v.key === "sc.hChecking") setTimeout(() => refreshHelperStatus(sel, raw), HELPER_GRACE_MS + 200);
    el2.innerHTML =
      '<span style="color:' + TONE[v.tone] + '">\u25cf</span> ' +
      '<span style="color:var(--faint)">' + t("sc.hStatus") + ':</span> ' +
      escapeHtml(t(v.key)) +
      (d && raw
        ? '<div style="margin-top:6px;color:var(--faint);font-family:ui-monospace,Consolas,monospace;' +
          'font-size:11px;word-break:break-all;white-space:pre-wrap">' + t("sc.hDetail") + ': ' + escapeHtml(d) + '</div>'
        : "");
  }).catch(() => {
    const el2 = $(sel);
    if(el2) el2.innerHTML = "";
  });
}

const CL_TIER_RANK = {high: 0, med: 1, low: 2};
function clOrd(x){ return typeof x.ord === "number" ? x.ord : Number.MAX_SAFE_INTEGER; }
/* Ticked tasks still sink to the bottom; above that the user's own order decides.
   Severity now only tints the row — before 1.12.2 it drove the sort, which is why
   the only way to reorder was to delete a task and add it again. */
function clSorted(){
  return CL.slice().sort((a, b) => (a.done - b.done) || (clOrd(a) - clOrd(b)) );
}
/* Give every task an explicit position. On the first run after upgrading, seed it
   from the OLD (done, severity, insertion) order so the list looks exactly as it did
   and nothing appears to jump. Tasks arriving later without one (an import from an
   older backup) simply go to the end. */
function clSeedOrder(){
  const missing = CL.filter(x => typeof x.ord !== "number");
  if(!missing.length) return;
  if(missing.length === CL.length){
    CL.slice()
      .sort((a, b) => (a.done - b.done) || (CL_TIER_RANK[a.tier] - CL_TIER_RANK[b.tier]))
      .forEach((x, k) => { x.ord = k; });
  }else{
    let max = -1;
    for(const x of CL) if(typeof x.ord === "number" && x.ord > max) max = x.ord;
    missing.forEach(x => { x.ord = ++max; });
  }
  saveCL();
}
/* move a task one place up (-1) or down (+1) in the visible list */
function clMove(task, dir){
  const list = clSorted();
  const i = list.indexOf(task), j = i + dir;
  if(i < 0 || j < 0 || j >= list.length) return;
  if(!!list[j].done !== !!task.done) return;      // ticked tasks live below; never swap across
  list.splice(i, 1);
  list.splice(j, 0, task);
  list.forEach((x, k) => { x.ord = k; });
  saveCL();
  renderChecklist();
}
/* can this row still move that way? drives the disabled state of the arrows */
function clCanMove(task, dir){
  const list = clSorted();
  const i = list.indexOf(task), j = i + dir;
  return i >= 0 && j >= 0 && j < list.length && !!list[j].done === !!task.done;
}

function clNightCheck(){

  const open = tool && HELP[tool] !== false;              // open by default for newcomers
  $("#helpPanel").style.display = (tool && open) ? "flex" : "none";
  $("#helpTab").style.display = (tool && !open) ? "" : "none";
  document.body.classList.toggle("helpOn", !!(tool && open));
  $("#helpTab").textContent = t("help.tab");
  $("#helpClose").title = t("help.close");
  if(tool && open){
    $("#helpTitle").textContent = t(tool === "dept" ? "help.deptTitle" : "help.taxTitle");
    $("#helpBody").innerHTML = t(tool === "dept" ? "help.deptBody" : "help.taxBody");
  }
}
function showScreen(which){
  /* Cleared BEFORE renderAll, which calls back in here — otherwise this recurses. */
  if(which === "app" && NAMES_STALE && MODEL){
    NAMES_STALE = false;
    renderAll(LASTFNAME || "");
    return;
  }
  SCREEN = which;
  /* The fit-to-window layout is the home screen's alone — see the CSS. */
  document.body.classList.toggle("onMenu", which === "menu");
  paintHelp();
  const mainEl = document.querySelector("main");
  const tax = document.getElementById("taxScreen");
  if(tax) tax.style.display = which === "tax" ? "" : "none";
  /* Arriving at the Tax Check starts the automatic protel read, and leaving it stops the
     retry. The read itself lives in the other <script> scope, so this is a door, the same
     shape as __taLegacy. Never awaited — the screen must appear at once and the line
     fills in when protel answers. */
  try{ if(window.__taScreen) window.__taScreen(which); }catch(e){}
  $("#rail").style.display = (which === "app" && MODEL) ? "flex" : "none";
  if(which !== "app" && typeof closeDrawer === "function") closeDrawer();
  if(which === "app"){
    $("#landing").style.display = "none";
    mainEl.style.display = "";
    return;
  }
  mainEl.style.display = "none";
  if(which === "tax"){
    $("#landing").style.display = "none";
    window.scrollTo(0, 0);
    return;
  }
  $("#landing").style.display = "";
  $("#menuScreen").style.display = which === "menu" ? "" : "none";
  $("#auditScreen").style.display = which === "audit" ? "" : "none";
  $("#filesScreen").style.display = which === "files" ? "" : "none";
  $("#alertsScreen").style.display = which === "alerts" ? "" : "none";
  $("#statusScreen").style.display = which === "status" ? "" : "none";
  $("#statusListScreen").style.display = which === "stlist" ? "" : "none";
  /* STATUS is drawn by the tax half, which holds the captures: the menu's four lines, and
     the list he chose. Doors, like __taScreen above. */
  if(which === "status"){ try{ if(window.__taStatusMenu) window.__taStatusMenu(); }catch(e){} }
  if(which === "stlist"){ try{ if(window.__taStatus) window.__taStatus(ST_TAG); }catch(e){} }
  if(which === "menu") renderChecklist();
  /* Opening the list is what "read" means — the pulse stops here and nowhere else. */
  if(which === "alerts"){ renderAlerts(); markAlertsRead(); }
  if(which === "files") fbRefresh();
  window.scrollTo(0, 0);
}

/* files screen doubles as a picker for the Tax Check slots */
let PICKCB = null;
window.rcShowAudit = function(){ showScreen("audit"); };
window.rcPickReport = function(cb){
  if(!window.reccheckFiles) return false;
  PICKCB = cb;
  FB.tool = "tax";
  if(!FB.p.tax.dir){                       // first use — the Tax Check gets its own folder
    fbPickDir("tax").then(() => {
      if(FB.p.tax.dir) showScreen("files");
      else{ PICKCB = null; showScreen("tax"); }
    });
    return true;
  }
  showScreen("files");
  return true;
};

  $("#mDirDeptSub").textContent = FB.p.dept.dir || t("menu.dirNone");

function escapeHtml(x){ const d = document.createElement("div"); d.textContent = x; return d.innerHTML; }
function fmtWhen(ms){
  const d = new Date(ms), now = new Date();
  const hm = pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  if(d.toDateString() === now.toDateString()) return t("fb.today") + " " + hm;
  return pad2(d.getDate()) + "/" + pad2(d.getMonth() + 1) + "/" + d.getFullYear() + " " + hm;
}
function fmtSize(b){ return b > 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1024)) + " KB"; }

function fbPaintChrome(){
  const hasHub = !!window.reccheckFiles;
  $("#fbDir").style.display = hasHub ? "" : "none";
  $("#fbViewList").style.display = hasHub ? "" : "none";
  $("#fbViewTiles").style.display = hasHub ? "" : "none";

  $("#fbViewTiles").classList.toggle("active", FB.view === "tiles");
  $("#fbList").className = FB.view;
}
async function fbRefresh(){
  fbPaintChrome();
  const cur = fbCur();
  if(!window.reccheckFiles || !cur.dir) return;
  let res;
  try{ res = await window.reccheckFiles.list(FB.tool, cur.rel); }catch(e){ return; }
  if(res.error && cur.rel){ fbGo(""); return; }          // folder vanished — back to the root
  if(res.dir !== cur.dir){ cur.dir = res.dir; paintDirSub(); fbPaintChrome(); }
  if(typeof res.rel === "string") cur.rel = res.rel.split("\\").join("/");
  $("#fbDir").textContent = cur.dir + (cur.rel ? " / " + cur.rel : "");
  $("#fbDir").title = $("#fbDir").textContent;
  const dirs = res.dirs || [];                           // old engines send no dirs
  const box = $("#fbList");
  box.innerHTML = "";
  $("#fbEmpty").style.display = (res.files.length || dirs.length || cur.rel) ? "none" : "";
  if(cur.rel){
    const up = el("div", "fbItem up");
    up.append(el("div", "fbIcon", "↰"));
    const meta = el("div", "fbMeta");
    meta.append(el("div", "fbName", t("fb.up")));
    up.append(meta);
    up.onclick = () => fbGo(fbUpRel());
    box.append(up);
  }
  for(const d of dirs){
    const it = el("div", "fbItem dir");
    it.append(el("div", "fbIcon", "▣"));
    const meta = el("div", "fbMeta");
    meta.append(el("div", "fbName", d.name));
    meta.append(el("div", "fbSub", t("fb.folder")));
    it.append(meta);
    it.onclick = () => fbGo(String(d.rel).split("\\").join("/"));
    box.append(it);
  }
  for(const f of res.files){
    const it = el("div", "fbItem" + (FB.tool === "dept" && FB.p.dept.open && FB.p.dept.open.path === f.path ? " open" : ""));
    it.append(el("div", "fbIcon", "▤"));
    const meta = el("div", "fbMeta");
    const nmRow = el("div", "fbName", f.name);
    if(bnKeyOf(f.mtimeMs) === bnKey()) nmRow.append(el("span", "fbTonight", t("fb.tonight")));
    meta.append(nmRow);
    meta.append(el("div", "fbSub", fmtWhen(f.mtimeMs) + " · " + fmtSize(f.size)));
    it.append(meta);
    it.onclick = () => fbOpen(f);
    box.append(it);
  }
  if(FB.tool === "dept") checkOpenChanged(res.files);
}
/* the open file may live in another folder than the one on screen — stat it directly */
async function checkOpenByStat(){
  const open = FB.p.dept.open;
  if(!open || !window.reccheckFiles) return;
  if(window.reccheckFiles.stat){
    try{
      const st = await window.reccheckFiles.stat("dept", open.path);
      if(st) checkOpenChanged([{path: open.path, mtimeMs: st.mtimeMs}]);
    }catch(e){}
  }else{
    try{ checkOpenChanged((await window.reccheckFiles.list("dept")).files || []); }catch(e){}
  }
}
async function fbOpen(f){
  try{
    const raw = await window.reccheckFiles.read(FB.tool, f.path);
    const u8 = raw instanceof Uint8Array ? raw : new Uint8Array(raw);
    if(PICKCB){
      const cb = PICKCB;
      PICKCB = null;
      showScreen("tax");
      cb(new File([u8], f.name));
      return;
    }
    if(FB.tool === "tax"){ showScreen("tax"); return; }   // no picker armed — nothing to feed
    const buf = u8.buffer.slice(u8.byteOffset, u8.byteOffset + u8.byteLength);
    FB.p.dept.open = {path: f.path, name: f.name, mtimeMs: f.mtimeMs};
    FB.p.dept.stale = false;
    paintStaleChip();
    await loadReport(buf, f.name);
  }catch(err){
    toast("✗ " + (err.message || err), true);
  }
}
function paintStaleChip(){ $("#staleChip").style.display = (FB.p.dept.stale && MODEL) ? "inline-block" : "none"; }
function checkOpenChanged(files){
  const open = FB.p.dept.open;
  if(!open) return;
  const cur = files.find(x => x.path === open.path);
  if(!cur || cur.mtimeMs <= open.mtimeMs + 500) return;
  open.mtimeMs = cur.mtimeMs;             // one prompt per change
  FB.p.dept.stale = true;
  paintStaleChip();
  if(SCREEN !== "app") return;            // browsing — the list refresh is enough
  showLivePrompt(cur);
}
function showLivePrompt(cur){
  openModal(`
    <h3>${t("live.title")}</h3>
    <div style="font-size:14px;line-height:1.65">${t("live.body", {name: "<b style=\"font-family:var(--mono)\">" + escapeHtml(FB.p.dept.open.name) + "</b>", when: escapeHtml(fmtWhen(cur.mtimeMs))})}</div>
    <div class="actions">
      <button class="btn" id="chKeep">${t("live.keep")}</button>
      <button class="btn amber" id="chLive">${t("live.load")}</button>
    </div>`);
  $("#chKeep").onclick = () => { closeModal(); paintStaleChip(); };
  $("#chLive").onclick = () => { closeModal(); FB.tool = "dept"; fbOpen(cur); };
}
async function fbPickDir(tool){
  if(!window.reccheckFiles) return;
  tool = tool === "tax" ? "tax" : "dept";
  const dir = await window.reccheckFiles.pickDir(tool);
  if(dir){ FB.p[tool].dir = dir; paintDirSub(); if(SCREEN === "files" && FB.tool === tool) fbRefresh(); }
}

/* ---------- file load ---------- */
async function loadFile(file){
  const buf = await file.arrayBuffer();
  return loadReport(buf, file.name);
}
async function loadReport(buf, fname){
  $("#landErr").textContent = "";
  try{
    const xmls = await unzipFpages(buf);
    const parsed = parseReport(xmls);
    if(!isCheckcharge(parsed)){
      throw new Error(t("err.wrongreport") +
        (parsed.reportId ? " The file identifies as: \u201C" + parsed.reportId + "\u201D." : " No protel report id found in it."));
    }
    MODEL = buildModel(parsed);
    STATE = loadState(MODEL.reportDate);
    loadWatch();
    loadRooms();
    /* Before syncRooms, so a room the mirror knows about is already in hand when the
       report's names meet it — otherwise the ingest would create it fresh from the CUT
       name and the protel one would be lost. */
    await mergeRoomsFromDisk();
    syncRooms();
    renderAll(fname);
    if(!MODEL.receipts.length){
      const w = $("#parseWarn");
      w.style.display = "block";
      w.textContent = t("warn.noreceipts");
    }
  }catch(err){
    const msg = "✗ " + (err.message || err);
    if($("#landing").style.display !== "none") $("#landErr").textContent = msg;
    else toast(msg, true);
  }
}

function renderValidation(){
  const warn = $("#parseWarn"), ok = $("#parseOk"), note = $("#parseNote");
  warn.style.display = "none";
  const target = MODEL.validation.filter(v => TARGET_DEPTS.includes(v.section.replace(/\s+\d+%$/,"").trim()));
  const bad = target.filter(v => v.ok === false);
  if(bad.length){
    // section totals include the cash/card (folio) rows, which are checked by
    // hand outside this tool — a small difference there is informational only
    ok.style.display = "none";
    note.style.display = "block";
    note.textContent = t("note.parse") +
      bad.map(v => `${v.section} ${numToMoney(v.parsed)} vs ${numToMoney(v.reported)} (Δ ${numToMoney(Math.round((v.reported - v.parsed)*100)/100)})`).join("  ·  ");
  }else{
    note.style.display = "none";
    ok.style.display = "block";
    ok.textContent = t("ok.parse", {n: target.length});
  }
}

function checkableList(){
  return MODEL.receipts.filter(r => !r.cancelled && !r.voided);
}
/* A manually added receipt is one you are holding. It is money the hotel took and a
   receipt that was received, so it belongs in the totals and in the count — otherwise
   the night reads as fewer receipts than actually came in, which is the one number the
   whole audit exists to get right. Entering it IS the act of checking it: there is
   nothing further to confirm, only reception's posting to chase, which is why it stays
   flagged and stays in the discrepancies. */
function extraTotal(x){ return Math.round((((x && x.v24) || 0) + ((x && x.v13) || 0)) * 100) / 100; }
function extrasOf(dept){ return STATE.extras.filter(x => x.dept === dept); }
function extrasSum(xs){ return xs.reduce((a, x) => a + extraTotal(x), 0); }

function renderSummary(){
  const s = $("#summary");
  s.style.display = "grid";
  s.innerHTML = "";
  const list = checkableList();
  const ex = STATE.extras;
  const received = list.length + ex.length;               // every receipt actually in hand
  const grand = list.reduce((a,r) => a + effTotal(r), 0) + extrasSum(ex);
  const done = list.filter(r => ["ok"].includes(rState(r).status)).length + ex.length;
  const flags = list.filter(r => rState(r).status === "missing").length
              + list.filter(r => rState(r).status === "corrected").length
              + ex.length;

  const stCls = (dn, n) => (n && dn === n) ? " done" : (dn > 0 ? " part" : "");

  const g = el("div","card grand" + stCls(done, received));
  const gl = el("div","lbl", t("sum.grand"));
  if(received && done === received) gl.append(el("span","tick","✓"));
  g.append(gl);
  g.append(el("div","val", numToMoney(Math.round(grand*100)/100)));
  const gs = el("div","sub");
  gs.append(el("b","", String(done)));
  gs.append(` / ${received}` + t("sum.checked") + (flags ? ` · ${flags}` + t("sum.flagged") : "")
            + (ex.length ? t("acc.extra", {n: ex.length}) : ""));
  g.append(gs);
  s.append(g);

  for(const b of TARGET_DEPTS){
    const dl = (MODEL.depts[b].list || []).filter(r => !r.cancelled && !r.voided);
    if(!dl.length && !STATE.extras.some(x => x.dept === b)) continue;
    const dx = extrasOf(b);
    const dRec = dl.length + dx.length;
    const tot = dl.reduce((a,r) => a + effTotal(r), 0) + extrasSum(dx);
    const dn = dl.filter(r => rState(r).status === "ok").length + dx.length;
    const c = el("div","card" + stCls(dn, dRec));
    const cl = el("div","lbl", b);
    if(dRec && dn === dRec) cl.append(el("span","tick","✓"));
    if(MODEL.depts[b].stillOpen){
      const op = el("span","openPill", t("tag.open"));
      op.title = "No ΜΕΤΡΗΤΑ ΤΜΗΜΑΤΩΝ close-out posting in the report — this department had not closed when the report was pulled and may still add receipts. Re-pull the report after it closes.";
      cl.append(op);
    }
    c.append(cl);
    c.append(el("div","val", numToMoney(Math.round(tot*100)/100)));
    const cs = el("div","sub");
    cs.append(el("b","", String(dn)));
    cs.append(` / ${dRec} · `);
    cs.append(el("b","", String(dRec)));
    cs.append(t("sum.rec") + (dx.length ? t("acc.extra", {n: dx.length}) : ""));
    c.append(cs);
    s.append(c);
  }
}

function tagFor(status){
  switch(status){
    case "ok": return ["ok", t("tag.ok")];
    case "missing": return ["missing", t("tag.missing")];
    case "corrected": return ["corr", t("tag.corr")];
    case "cancelled": return ["cancelled", t("tag.cancelled")];
    case "void": return ["void", t("tag.void")];
    case "extra": return ["extra", t("tag.extra")];
    default: return null;
  }
}

function renderAccordions(){
  const wrap = $("#accordions");
  const openSet = new Set([...wrap.querySelectorAll(".acc.open")].map(a => a.dataset.dept));
  wrap.innerHTML = "";

  for(const b of TARGET_DEPTS){
    const D = MODEL.depts[b];
    const list = (D.list || []);
    const extras = STATE.extras.filter(x => x.dept === b);
    if(!list.length && !extras.length) continue;
    wrap.append(buildAcc(b, list, extras, D.other, openSet.has(b)));
  }
  const unass = STATE.extras.filter(x => !TARGET_DEPTS.includes(x.dept));
  if(unass.length) wrap.append(buildAcc("UNASSIGNED — not in report", [], unass, [], true, true));
  for(const a of wrap.querySelectorAll(".acc")) applyRoomFilter(a, a.dataset.dept);
  knavPaint();
  if(RS_FOCUS){ const f = wrap.querySelector(`.roomSearch[data-dept="${CSS.escape(RS_FOCUS)}"]`); if(f) f.focus(); RS_FOCUS = null; }
}

function buildAcc(name, list, extras, other, open, isExtraAcc){
  const checkable = list.filter(r => !r.cancelled && !r.voided);
  const received = checkable.length + extras.length;
  const done = checkable.filter(r => rState(r).status === "ok").length + extras.length;
  const tot = checkable.reduce((a,r) => a + effTotal(r), 0) + extrasSum(extras);

  /* The not-in-report box is never marked finished: everything in it is by definition
     still owed a posting, however completely it has been entered here. */
  const dyn = isExtraAcc ? "" :
    (received && done === received) ? " done" : (done > 0 ? " part" : "");
  const acc = el("div","acc" + (open ? " open" : "") + (isExtraAcc ? " extraAcc" : "") + dyn);
  acc.dataset.dept = name;
  const head = el("div","head");
  head.append(el("div","bar"));
  const nm = el("div","name", name);
  if(dyn === " done") nm.append(el("span","tick","✓"));
  const DD = MODEL.depts[name];
  if(DD && DD.stillOpen){
    const op = el("span","openPill", t("tag.open"));
    op.title = t("open.title");
    nm.append(op);
  }
  head.append(nm);
  const cnt = el("div","cnt");
  const voidCnt = list.filter(r => r.voided).length;
  cnt.append(el("b","", String(received)));
  /* tautological in the not-in-report box, where every entry is one */
  cnt.append(t("sum.rec") + (voidCnt ? t("acc.void", {n: voidCnt}) : "")
             + (extras.length && !isExtraAcc ? t("acc.extra", {n: extras.length}) : ""));
  head.append(cnt);
  const prog = el("div","prog");
  const pb = el("b","", String(done)); prog.append(pb); prog.append(` / ${received}`);
  head.append(prog);
  head.append(el("div","tot", numToMoney(Math.round(tot*100)/100)));
  head.append(el("div","chev","▶"));
  head.onclick = () => acc.classList.toggle("open");
  acc.append(head);

  const body = el("div","body");
  if(!isExtraAcc && checkable.length){
    const sw = el("div","roomSearchWrap");
    const rs = document.createElement("input");
    rs.className = "roomSearch"; rs.placeholder = t("room.ph");
    rs.autocomplete = "off"; rs.inputMode = "numeric";
    rs.dataset.dept = name;
    rs.value = ROOMF[name] || "";
    rs.oninput = () => { rs.value = rs.value.replace(/\D/g,""); ROOMF[name] = rs.value; applyRoomFilter(acc, name); };
    rs.onkeydown = e => roomSearchKeys(e, acc, name, rs);
    sw.append(rs, el("span","rsHint", t("room.hint")));
    body.append(sw);
  }
  for(const r of list){
    if(r.cancelled) continue;              // voided at the POS — hidden from lists
    body.append(receiptRow(r));
  }
  for(const x of extras) body.append(extraRow(x));
  if(other && other.length){
    const det = document.createElement("details");
    det.className = "otherPost";
    const sm = document.createElement("summary");
    sm.textContent = t("acc.other", {n: other.length});
    det.append(sm);
    for(const o of other){
      const rr = el("div","rrow");
      rr.append(el("div","room", o.room || "—"));
      rr.append(el("div","sn", o.rate === "base" ? "" : o.rate));
      rr.append(el("div","split", (o.guest || "") + " " + o.time));
      rr.append(el("div","amt", numToMoney(o.amount)));
      det.append(rr);
    }
    body.append(det);
  }
  acc.append(body);
  return acc;
}

function receiptRow(r){
  const st = rState(r);
  const status = statusOf(r);
  const row = el("div","rrow st-" + status);
  row.dataset.key = rKey(r);
  row.dataset.room = effRoom(r);
  row.onclick = () => { KNAV.key = rKey(r); KNAV.act = "ok"; knavPaint(); };

  const room = el("div","room");
  if(st.corr && st.corr.room){
    const old = el("span","old", r.roomMain); room.append(old);
    room.append(document.createTextNode(" " + st.corr.room));
  }else{
    room.textContent = r.roomMain;
    if(r.roomMain !== r.room) room.append(el("span","adj"," (" + r.room + ")"));
  }
  row.append(room);

  const sn = el("div","sn");
  if(st.corr && st.corr.sn){
    const old = el("span","old", r.sn); sn.append(old);
    sn.append(document.createTextNode(" " + st.corr.sn));
  }else sn.textContent = r.sn;
  row.append(sn);

  /* Every charge resolves through its ROOM to that room's name — not only the ones whose
     room was corrected, which is all this used to do. His words: "give the tool the
     ability to understand which charge in the department check belong to which room and
     render the proper name given".

     A nickname still wins where one is set: they are not retired here, they are simply
     stopped from being the only way a room gets a decent name. When protel's own first
     and last names arrive they become guestFor's source, and the nicknames stop
     mattering on their own rather than being taken away.

     The receipt's OWN name is never lost. Wherever the name shown differs from the one
     printed on the charge, the printed one is on the tooltip — which matters most on a
     turnover, where the room's name tonight is not the name that made the charge. */
  const gname = guestFor(effRoom(r)) || r.guest || "";
  const nick = nickFor(effRoom(r));
  const nm = el("div","name" + (nick ? " nick" : ""), nick || gname);
  nm.title = (nick ? gname + t("n.nickedTitle") : gname) +
             (r.guest && gname !== r.guest ? "  ·  ⌫ " + r.guest : "");
  row.append(nm);

  const split = el("div","split");
  if(corrHasValues(st)){
    const old = el("span","old", rateSplitStr(r.rates)); split.append(old);
    split.append(document.createTextNode(" " + rateSplitStr(effRates(r))));
  }else{
    split.textContent = rateSplitStr(r.voided ? r.posRates : r.rates);
    if(!r.voided && r.paidAmount > 0)
      split.textContent += " · paid −" + numToMoney(r.paidAmount);
  }
  row.append(split);

  const ws = watchFor(effRoom(r));
  if(ws.length){
    row.classList.add("watch");
    const wt = el("span","tag watch", t("tag.watch"));
    wt.title = ws.map(w => (w.name || "?") + (w.sn ? " · SN " + w.sn : "")).join("  |  ");
    row.append(wt);
  }
  if(r.mergedFrom && r.mergedFrom.length > 1)
    row.append(el("span","tag merged", t("tag.merged") + r.mergedFrom.join("+")));
  if(r.voided){
    row.append(el("span","tag void", t("tag.void") + " · " + r.paidBy.join("+")));
  }else{
    const t = tagFor(status);
    if(t) row.append(Object.assign(el("span","tag " + t[0], t[1])));
  }

  const amt = el("div","amt");
  if(corrHasValues(st)){
    const old = el("span","old", numToMoney(r.total)); amt.append(old);
    amt.append(document.createTextNode(numToMoney(effTotal(r))));
  }else amt.textContent = numToMoney(r.voided ? r.posTotal : r.total);
  row.append(amt);

  if(!r.cancelled && !r.voided){
    const wb = el("button","warnBtn","⚠");
    wb.title = "Flag a problem with this receipt";
    wb.onclick = e => { e.stopPropagation(); openRowMenu(wb, r); };
    row.append(wb);

    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.className = "rowck";
    cb.checked = st.status === "ok";
    cb.title = "Checked by eye";
    cb.onclick = e => e.stopPropagation();
    cb.onchange = () => {
      const cur = rState(r);
      if(cb.checked){
        setRState(r, {status: "ok", corr: cur.corr || null});
        toastReceipt(r);
      }else{
        setRState(r, {status: cur.corr ? "corrected" : "pending", corr: cur.corr || null});
      }
      refresh();
    };
    row.append(cb);
  }
  return row;
}

/* ---------- keyboard navigation (room search · arrows · Enter) ---------- */
const ROOMF = {};                       // per-department room filter text
let KNAV = {key: null, act: "ok"};      // highlighted row + selected action
let RS_FOCUS = null;                    // room input to refocus after a refresh

function applyRoomFilter(acc, dept){
  const q = ROOMF[dept] || "";
  for(const row of acc.querySelectorAll(".body .rrow")){
    if(!("room" in row.dataset)) continue;
    row.style.display = (!q || String(row.dataset.room).startsWith(q)) ? "" : "none";
  }
  if(KNAV.key){
    const hl = acc.querySelector(`.rrow[data-key="${CSS.escape(KNAV.key)}"]`);
    if(hl && hl.style.display === "none"){ KNAV.key = null; knavPaint(); }
  }
}
function navRows(root){
  const rows = root ? root.querySelectorAll(".body .rrow") : document.querySelectorAll(".acc.open .body .rrow");
  return [...rows].filter(r => r.style.display !== "none" && r.querySelector(".rowck") && r.offsetParent !== null);
}
function knavPaint(){
  document.querySelectorAll(".rrow.khl").forEach(r => r.classList.remove("khl","act-ok","act-warn"));
  if(!KNAV.key) return;
  const row = document.querySelector(`.rrow[data-key="${CSS.escape(KNAV.key)}"]`);
  if(!row){ KNAV.key = null; return; }
  row.classList.add("khl","act-" + KNAV.act);
}
function knavMove(dir, root){
  const rows = navRows(root); if(!rows.length) return;
  let i = rows.findIndex(r => r.dataset.key === KNAV.key);
  i = i === -1 ? (dir > 0 ? 0 : rows.length - 1) : Math.min(rows.length - 1, Math.max(0, i + dir));
  KNAV.key = rows[i].dataset.key; KNAV.act = "ok"; knavPaint();
  rows[i].scrollIntoView({block: "nearest"});
}
function knavCommit(){
  if(!KNAV.key) return false;
  const row = document.querySelector(`.rrow[data-key="${CSS.escape(KNAV.key)}"]`);
  if(!row) return false;
  if(KNAV.act === "warn"){ const wb = row.querySelector(".warnBtn"); if(wb){ wb.click(); return true; } return false; }
  const cb = row.querySelector(".rowck"); if(!cb) return false;
  const rows = navRows(); const i = rows.indexOf(row);
  const nextKey = (!cb.checked && i > -1 && i < rows.length - 1) ? rows[i + 1].dataset.key : KNAV.key;
  cb.click();                                        // reuses the checkbox logic: state, toast, refresh
  KNAV.key = nextKey; KNAV.act = "ok"; knavPaint();
  return true;
}
function receiptByKey(key){
  for(const b of TARGET_DEPTS){
    const D = MODEL.depts[b]; if(!D || !D.list) continue;
    for(const r of D.list) if(rKey(r) === key) return r;
  }
  return null;
}
function roomSearchKeys(e, acc, dept, rs){
  if(e.key === "ArrowDown"){ knavMove(1, acc); e.preventDefault(); return; }
  if(e.key === "ArrowUp"){ knavMove(-1, acc); e.preventDefault(); return; }
  if(e.key === "Escape"){ rs.value = ""; ROOMF[dept] = ""; applyRoomFilter(acc, dept); rs.blur(); e.preventDefault(); return; }
  if(e.key !== "Enter") return;
  e.preventDefault();
  const rows = navRows(acc); if(!rows.length) return;
  const q = rs.value.trim();
  let target = KNAV.key ? rows.find(r => r.dataset.key === KNAV.key) : null;
  if(!target && q) target = rows.find(r => r.dataset.room === q);
  if(!target) target = rows[0];
  ROOMF[dept] = ""; RS_FOCUS = dept; KNAV.key = null;
  const cb = target.querySelector(".rowck");
  if(cb && !cb.checked) cb.click();                  // confirm only — Enter never un-checks
  else {
    const r = receiptByKey(target.dataset.key);
    if(r) toastReceipt(r);
    rs.value = ""; applyRoomFilter(acc, dept); knavPaint();
  }
}
document.addEventListener("keydown", e => {
  if(menuEl){ if(e.key === "Escape"){ closeMenu(); e.preventDefault(); } return; }
  if($("#modalBg").classList.contains("open")) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if(e.target.classList && e.target.classList.contains("roomSearch")) return;   // handled by the field itself
  if(tag === "input" || tag === "textarea" || tag === "select") return;
  switch(e.key){
    case "ArrowDown": knavMove(1); e.preventDefault(); break;
    case "ArrowUp":   knavMove(-1); e.preventDefault(); break;
    case "ArrowLeft":  if(KNAV.key){ KNAV.act = "warn"; knavPaint(); e.preventDefault(); } break;
    case "ArrowRight": if(KNAV.key){ KNAV.act = "ok";   knavPaint(); e.preventDefault(); } break;
    case "Enter":  if(knavCommit()) e.preventDefault(); break;
    case "Escape": KNAV.key = null; knavPaint(); break;
  }
});

function moneyField(v){ return (v === undefined || v === null || v === "") ? "" : String(v).replace(".", ","); }
function readMoney(s){
  s = (s || "").trim();
  if(s === "") return 0;
  if(!/^-?\d+(?:[.,]\d{1,2})?$/.test(s)) return null;
  return Math.round(parseFloat(s.replace(",", ".")) * 100) / 100;
}

/* ---------- search ---------- */
const inp = () => $("#snInput");
let ntTimer = null;
let currentMatches = [];

function findMatches(q){
  if(!q) return [];
  const out = [];
  for(const r of MODEL.receipts){
    if(effSN(r) === q) out.push({r, exact: true});   // exact serials only — no partial guessing
  }
  return out;
}
/* Searching a serial you added by hand used to find nothing and then offer to add it
   again — the app actively inviting a double entry, and no way to look up what you had
   already recorded. A manual entry is part of the night; the search knows about it. */
function findExtras(q){
  if(!q) return [];
  return STATE.extras.filter(x => String(x.sn) === q);
}
function extraMatchCard(x){
  const c = el("div","match");
  c.append(el("span","dept", x.dept === "UNASSIGNED" ? t("extra.unassigned") : x.dept));
  c.append(el("span","room", x.room || "—"));
  c.append(el("span","msn", x.sn));
  /* same rule for a receipt added by hand: the room decides the name, the nickname
     overrides it, and what was typed in is the last resort rather than the first */
  const nick = x.room ? nickFor(x.room) : null;
  const nm = x.room ? (nick || guestFor(x.room) || x.guest) : null;
  if(nm) c.append(el("span","name" + (nick ? " nick" : ""), nm));
  c.append(el("span","split", rateSplitStr({"24%": x.v24, "13%": x.v13})));
  c.append(el("span","amt", numToMoney(extraTotal(x))));
  const ws = x.room ? watchFor(x.room) : [];
  if(ws.length){
    c.classList.add("watch");
    const wt = el("span","tag watch", t("tag.watch"));
    wt.title = ws.map(w => (w.name || "?") + (w.sn ? " · SN " + w.sn : "")).join("  |  ");
    c.append(wt);
  }
  c.append(el("span","tag extra", t("tag.extra")));
  return c;
}

function searchInput(){
  const f = inp();
  const clean = f.value.replace(/\D/g, "");
  if(clean !== f.value) f.value = clean;
  const q = clean;
  clearTimeout(ntTimer);
  $("#notThereBtn").classList.remove("show");
  const box = $("#matches");
  box.innerHTML = "";
  currentMatches = [];
  inp().classList.remove("nomatch");
  if(!q) return;

  LEAVING = leavingIndex();          // once per search, not once per card
  const ms = findMatches(q);
  const xs = findExtras(q);
  currentMatches = ms;               // Enter confirms a report receipt; an entry you
                                     // typed yourself has nothing left to confirm
  if(!ms.length && !xs.length){
    inp().classList.add("nomatch");
    /* A bare "Receipt isn't there?" button beside the box was missed entirely — it read
       as decoration. It now states the case and asks the question, with the serial in
       it, so it cannot be mistaken for part of the furniture. */
    ntTimer = setTimeout(() => {
      if(inp().value.trim() !== q) return;
      const b = $("#notThereBtn");
      b.textContent = t("search.notThereQ", {sn: q});
      b.classList.add("show");
    }, 900);
    return;
  }
  for(const m of ms) box.append(matchCard(m.r));
  for(const x of xs) box.append(extraMatchCard(x));
}

/* ---- a receipt on a room that is leaving today ----
   His case, in his words: sixteen rooms were due out on 01/09 and they did not all leave
   at 11:00. Some charged something to the room and only then came to the desk. A receipt
   like that has to be settled before they walk out, so it is the one thing on this
   screen that must not be skimmed past.

   The NAME is part of the test, not decoration. A room leaving today may already have
   been re-let to somebody arriving today, and that new guest's receipt is ordinary. Only
   a receipt under the departing guest's own name counts. sameName() is the strict
   comparison — the same one the nickname transfer uses — because marking the wrong
   receipt red is worse than marking none at all.

   Built once per search, not once per card: the ledger comes out of localStorage. */
/* Who is leaving tonight, by room: the DEPARTURE LIST's rows for the night, from the
   STATUS store — his word, 05/09, that it is the only source of truth for departures.
   It used to read the ledger's departure dates, which the census wrote too. */
function leavingIndex(){
  const out = {};
  const night = MODEL ? dateNum(MODEL.reportDate) : 0;
  if(!night) return out;                       // no night, no claim
  for(const r of statusRows(loadStatus(), "DP", night)){
    const room = pillRoom(r.room);
    if(room) (out[room] = out[room] || []).push(r.name || "");

/* ---------- room movements (arrivals / departures / same-day turnover) ---------- */
/* Written by the tax tool when a rate list is loaded — that report is the only one
   either half of this app sees that carries arrival and departure dates. */
const MOVES_KEY = "reccheck_moves_v2";
function loadMoves(){
  try{ return JSON.parse(localStorage.getItem(MOVES_KEY) || "{}") || {}; }catch(e){ return {}; }
}
function saveLedger(led){
  try{ localStorage.setItem(MOVES_KEY, JSON.stringify(led)); }catch(e){}
}
/* The rate list writes a name; the department report writes a name; they are printed by
   different reports and rarely match character for character. So: strip accents and
   punctuation, keep words of three letters or more, and call it the same guest if ANY
   word survives in both. "PAPADOPOULOS GEORGIOS" and "PAPADOPOULOS G." are the same
   person; "KOWALSKI" and "ROSSI" are not. Unknown on either side is never a mismatch —
   this is only ever allowed to fire on a confident contradiction. */
function nameWords(x){
  return String(x || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase()
    .split(/[^\p{L}]+/u).filter(w => w.length >= 3);
}
function sameGuest(a, b){
  const A = nameWords(a), B = nameWords(b);
  if(!A.length || !B.length) return true;
  return A.some(w => B.indexOf(w) >= 0);
}
/* The second stay-shortening rule, removed for the same reason as the one in saveMoves:
   it ended a stay whenever a room charged under a name the ledger did not recognise. The
   desk does not want early checkouts deduced — it wants the dates protel holds, and it
   handles any difference itself. A tolerant name comparison deciding someone had left was
   a guess dressed as a correction, and it changed stored dates on the strength of it. */
function dShort(k){
  k = Number(k) || 0;
  if(!k) return "";
  return String(k % 100).padStart(2, "0") + "/" + String(Math.floor(k / 100) % 100).padStart(2, "0");
}
/* room -> {kind: "arr"|"dep"|"turn", who: [...], sure, from}
   The ledger holds reservations, not nights, so this answers for any night inside the
   span of any rate list ever loaded — including nights whose tax check was never run
   because the main courante balanced. */
/* THE PILLS COME FROM STATUS — his specification, 05/09, in his words: "The pills in the
   department check will be populated from status data, i mainly care about moves and
   departures". And, asked which source: departures ONLY from the departure list, arrivals
   from the arrival list, moves from the moves window's X rows, turnover a room in both
   lists that night. The in-house list's departure column and the ledger no longer draw a
   pill — a planned departure date on the census is not the departure list, and the
   departure list is the source of truth for departures.

   The STATUS store (written by the tax half, see statusIngest) keeps each list's rows for
   the day as a UNION of every capture of it, keyed by name and room, so a guest who has
   left the arrival list because they checked in is still that night's arrival. This
   reads that store and nothing else. Room 9000 and the like are holding rooms and are
   not pills, as they were never stays. */
const STATUS_KEY = "reccheck_status_v1";
function loadStatus(){
  try{ const o = JSON.parse(localStorage.getItem(STATUS_KEY) || "{}"); return (o && typeof o === "object" && !Array.isArray(o)) ? o : {}; }
  catch(e){ return {}; }
}
function statusRows(st, tag, night){
  const d = st && st[tag] && st[tag][String(night)];
  return (d && d.rows && typeof d.rows === "object") ? Object.keys(d.rows).map(k => d.rows[k]) : [];
}
function pillRoom(cell){
  const m = String(cell || "").trim().match(/^(\d{2,3})(?!\d)/);   // the lead room of "414-15"; not 9000
  return m ? m[1] : "";
}
function roomMoves(nightArg){
  const out = {};
  const night = nightArg || (MODEL ? dateNum(MODEL.reportDate) : 0);
  if(!night) return out;
  const st = loadStatus();
  const acc = {};
  const slot = room => (acc[room] = acc[room] || {arr: false, dep: false, move: null, who: [], names: {dep: [], move: []}});
  for(const r of statusRows(st, "DP", night)){
    const room = pillRoom(r.room); if(!room) continue;
    const o = slot(room); o.dep = true; o.names.dep.push(r.name || "");
    if(r.name) o.who.push("\u2190 " + r.name);
  }
  for(const r of statusRows(st, "AR", night)){
    const room = pillRoom(r.room); if(!room) continue;
    const o = slot(room); o.arr = true;
    if(r.name) o.who.push("\u2192 " + r.name);
  }
  for(const r of statusRows(st, "MV", night)){
    if(!String(r.x || "").trim()) continue;                // protel has not marked it — not a move it shows
    const to = pillRoom(r.to), from = pillRoom(r.from); if(!to || !from || to === from) continue;
    const o = slot(to); o.move = from; o.names.move.push(r.name || "");
    if(r.name) o.who.push("\u21b3 " + r.name + "  (" + from + " \u2192 " + to + ")");
  }
  for(const room of Object.keys(acc)){
    const o = acc[room], arrived = o.arr || !!o.move;
    if(!arrived && !o.dep) continue;
    /* a room that departed and was arrived into again is a turnover — the louder fact */
    const kind = (arrived && o.dep) ? "turn" : (o.arr ? "arr" : (o.move ? "move" : "dep"));
    out[room] = {kind: kind, who: o.who, sure: true, from: 0, movedFrom: o.move, names: o.names};
  }
  return out;
}
/* The ledger's view of the same night, kept for DEBUG's movesReport only. */
function ledgerMoves(nightArg){
  const out = {};
  const night = nightArg || (MODEL ? dateNum(MODEL.reportDate) : 0);
  if(!night) return out;
  const led = loadMoves();
  for(const room of Object.keys(led)){
    let arr = false, dep = false, from = 0;
    const who = [];
    let moved = null;
    for(const a of Object.keys(led[room])){
      const r = led[room][a], A = Number(a), D = r.d || 0;
      /* A stay the guest was MOVED OUT of. It is kept, because it is what protel printed,
         but it no longer asserts anything: the room did not depart, the guest simply is
         not in it. Without this the old room fires a departure on the original date. */
      if(r.mv) continue;
      if(A === night){
        arr = true; from = Math.max(from, r.seen || 0);
        if(r.from) moved = r.from;              // arrived here by moving out of that room
        if(r.n) who.push((r.from ? "\u21b3 " : "\u2192 ") + r.n + (r.from ? "  (" + r.from + " \u2192 " + room + ")" : ""));
      }
      if(D === night){
        dep = true; from = Math.max(from, r.seen || 0);
        if(r.n) who.push("\u2190 " + r.n);
      }
    }
    if(!arr && !dep) continue;
    /* A move that also departs tonight is still a turnover — the room changed hands
       twice and that is the louder fact. */
    const kind = (arr && dep) ? "turn" : (arr ? (moved ? "move" : "arr") : "dep");
    out[room] = {kind: kind, who: who, sure: true, from: from, movedFrom: moved};
  }
  /* There was a second pass here that added a dashed TURNOVER pill for any room whose
     name in the department report differed from the name cached for it — "the report
     alone can say the name under it changed". It was wrong, and on 02/09 it was loudly
     wrong: the last rate list loaded was 31/08, so every genuine changeover of 01/09 and
     02/09 read as a name change, and dozens of rooms with no arrival or departure on
     that night at all (65, 94, 124, 129 among them) were asserted to have LEFT AND BEEN
     RE-LET the same day. Dashed or not, a turnover pill claims a departure.

     That is a deduction, from exactly the evidence that manufactured 83 phantom
     departures on 30/08: a room charging under an unrecognised name. His rule is
     standing and it is not qualified — record the data the system holds, do not deduce,
     correct or improve it. A name change is not a date. The panel says only what the
     ledger's arrival and departure dates say.

     ROOMS[].movedOn is still stamped by syncRooms; nothing reads it now. It is left in
     place because it is a fact the report carries, and showing it as its own thing —
     not as a departure — is a separate question. */
  return out;
}
function renderMoves(){
  const box = $("#moves");
  if(!box) return;
  const n = renderMovesFor(box, MODEL ? dateNum(MODEL.reportDate) : 0);
  document.body.classList.toggle("hasMoves", n > 0);
