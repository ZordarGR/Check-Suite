/* The panel for a given night into a given box; how many rooms it drew. The department
   check's #moves and the STATUS screen both come through here, so there is one drawing of
   a pill and not two. */
function renderMovesFor(box, night){
  const mv = roomMoves(night);
  const rooms = Object.keys(mv).sort((a,b) => (parseInt(a)||0) - (parseInt(b)||0));
  box.innerHTML = "";
  if(!rooms.length) return 0;
  box.append(el("div","mvTitle", t("mv.title")));
  /* One colour at a time, under its own heading. Sorted by room number inside each
     group, as it always was — but interleaving the three kinds turned the panel into a
     chequerboard you had to decode pill by pill, which is the opposite of the point.
     The headings also retire the legend: a colour under the word for it needs no key. */
  /* Departures whose room also has receipts in tonight's department check — the paper he
     can throw away. Live ones only: a receipt cancelled or reversed at the POS is not
     something he is holding to file. Built once, not once per pill.

     Matched on the DEPARTING GUEST'S NAME, not on the room number. A room number alone
     marks the wrong stay the moment the room has turned over: with no rate list loaded
     since the guest arrived, the room shows as a departure while the department report
     already carries the NEW occupant's receipts, and every one of those dots lands on
     paper he must not throw away. Same rule as the red mark in the search results, and
     deliberately the same index behind it — "dont accidentally mark the arrival
     receipts". */
  LEAVING = leavingIndex();
  /* THE DOT, his words 05/09: "if a room that moved and/or departed also had a receipt
     which matches that reservation's name in that day then put a dot on the pill,
     otherwise leave it as is". Departed: a receipt on that room under the departing
     reservation's name — a turnover departed too, so it takes the same dot for the same
     name. Moved: a receipt under the moved reservation's name on either
     room, the one left or the one taken — its paper can carry either number. Exact name,
     never the room alone: a room number marks the wrong stay the moment it turns over. */
  const withRec = new Set();
  if(MODEL) for(const r of checkableList()){
    const rm = String(effRoom(r) || "");
    if(!rm) continue;
    for(const room of rooms){
      const m = mv[room];
      if((m.kind === "dep" || m.kind === "turn") && rm === room && (m.names ? m.names.dep : []).some(n => sameName(n, r.guest))) withRec.add(room);
      if(m.kind === "move" && (rm === room || rm === String(m.movedFrom || "")) && (m.names ? m.names.move : []).some(n => sameName(n, r.guest))) withRec.add(room);
    }
  }
  for(const kind of ["dep", "turn", "move", "arr"]){
    const of = rooms.filter(r => mv[r].kind === kind);
    if(!of.length) continue;
    const head = el("div","mvGroup mv-" + kind);
    head.append(el("span","mvGroupName", t("mv.h." + kind)));
    head.append(el("span","mvGroupN", String(of.length)));
    box.append(head);
    const grid = el("div","mvGrid");
    for(const room of of){
      const m = mv[room];
      const rec = (kind === "dep" || kind === "turn" || kind === "move") && withRec.has(String(room));
      const pill = el("div","mvPill mv-" + m.kind + (m.sure ? "" : " guess") + (rec ? " rec" : ""), room);
      pill.title = t("mv." + m.kind) + (m.sure ? "" : " · " + t("mv.guess"))
                 + (rec ? " · " + t("mv.rec") : "")
                 + (m.who.length ? "\n" + m.who.join("\n") : "")
                 + (m.from ? "\n" + t("mv.from", {d: dShort(m.from)}) : "");
      grid.append(pill);
    }
    box.append(grid);
  }
  if(rooms.some(r => !mv[r].sure)) box.append(el("div","mvNote", t("mv.guessNote")));
  return rooms.length;
}
/* Why there are no pills tonight. Since 1.17.42 the panel is built from the STATUS store —
   the departure list, arrival list and moves window protel showed, captured by the helper
   and kept per night — so the first thing this prints is what that store holds for the
   report's night, and the pills it yields. The ledger's own view follows, labelled as the
   ledger's, because a phantom there is still worth seeing even though it draws nothing. */
function movesReport(){
  const L = [];
  const night = MODEL ? dateNum(MODEL.reportDate) : 0;
  L.push("report night  : " + (MODEL ? MODEL.reportDate : "(no department report loaded)")
         + "  ->  " + (night || "COULD NOT READ THE DATE"));
  const st = loadStatus();
  const cnt = tag => statusRows(st, tag, night).length;
  const held = tag => st[tag] ? Object.keys(st[tag]).sort().join(" ") : "";
  L.push("status store  : for this night, departure list " + cnt("DP") + " rows, arrival list " + cnt("AR")
         + " rows, moves window " + cnt("MV") + " rows"
         + (night && !cnt("DP") && !cnt("AR") && !cnt("MV") ? "  — NOTHING CAPTURED FOR THIS NIGHT" : ""));
  L.push("  nights held : DP " + (held("DP") || "none") + "  |  AR " + (held("AR") || "none") + "  |  MV " + (held("MV") || "none"));
  L.push("  in-house    : " + (st.IH ? (st.IH.date || "?") + ", " + (st.IH.rows || []).length + " rows, " + (st.IH.cut ? "CUT SHORT" : "complete") : "no capture"));
  const pills = roomMoves(), hit = Object.keys(pills);
  L.push("tonight       : " + (hit.length ? hit.length + " pills — " + hit.join(" ") : "no pills"));
  L.push("");
  L.push("the ledger's own view — not the pills' source since 1.17.42:");
  const roomMoves_ = ledgerMoves;
  let last = null;
  try{ last = JSON.parse(localStorage.getItem("reccheck_moves_last") || "null"); }catch(e){}
  L.push("last rate list: " + (last ? JSON.stringify(last) : "(no rate list has ever been recorded)"));
  const led = loadMoves(), rooms = Object.keys(led);
  let res = 0, minA = 0, maxD = 0;
  for(const r of rooms) for(const a of Object.keys(led[r])){
    res++;
    const A = Number(a), D = led[r][a].d || 0;
    if(!minA || A < minA) minA = A;
    if(D > maxD) maxD = D;
  }
  L.push("ledger        : " + rooms.length + " rooms, " + res + " reservations"
         + (res ? ", " + minA + " .. " + maxD : " — EMPTY"));
  const mv = roomMoves_(), lhit = Object.keys(mv);
  L.push("ledger tonight: " + (lhit.length ? lhit.length + " would be pills — " + lhit.join(" ") : "no pills"));
  /* Every pill the ledger would draw, with the stay behind it and the DATE OF THE LIST THAT WROTE IT.
     The old report printed "stays near this night" and cut it at 40 rows, which is why
     the first diagnosis of the phantom departures was made on a truncated list and got
     it half right. A pill this panel draws must always appear here — if the panel says
     36 and this says 36, they are the same 36. The `seen` column is the point: a stay
     last written by an old rate list is a date protel may have moved on from, and that
     is what a phantom departure IS now that nothing is deduced any more. */
  if(night && res){
    const newest = last && last.key ? Number(last.key) : 0;
    const rows = [];
    let stale = 0;
    for(const r of Object.keys(mv)){
      const m = mv[r];
      const entries = led[r] || {};
      for(const a of Object.keys(entries)){
        const e = entries[a], A = Number(a), D = e.d || 0;
        if(e.mv) continue;
        if(A !== night && D !== night) continue;
        const seen = e.seen || 0;
        const old = newest && seen && seen < newest;
        if(old) stale++;
        rows.push("  " + (r + "      ").slice(0, 6) + (m.kind + "    ").slice(0, 5)
                  + A + " -> " + (D || "?") + "   written by the list of "
                  + (seen || "?") + (old ? "  << OLDER THAN THE NEWEST LIST" : "")
                  + "   " + (e.n || ""));
      }
    }
    L.push("");
    L.push("every pill the ledger would draw tonight, and the list that wrote it:");
    L.push(rows.length ? rows.slice(0, 200).join("\n") : "  none");
    if(rows.length > 200) L.push("  … " + (rows.length - 200) + " more not shown");
    if(newest){
      L.push("");
      L.push(stale + " of " + rows.length + " were last written by a list older than "
             + newest + ". protel may have changed those dates since.");
    }
    L.push("");
    L.push("stays whose arrival or departure lands near this night:");
    const near = [];
    for(const r of rooms) for(const a of Object.keys(led[r])){
      const A = Number(a), e = led[r][a], D = e.d || 0;
      if(Math.abs(A - night) <= 3 || Math.abs(D - night) <= 3)
        near.push("  " + r + "\t" + A + " -> " + (D || "?") + "\t" + (e.n || "")
                  + "\t" + (e.mv ? "(vacated by a move)" : ""));
    }
    L.push(near.length ? near.slice(0, 120).join("\n")
                       : "  none — every stay in the ledger is more than three days from this night");
    if(near.length > 120) L.push("  … " + (near.length - 120) + " more not shown");
  }
  return L.join("\n");
}

/* ---------- data export / import (sync browser file ⇄ installed app) ---------- */
function exportData(){
  const out = {app: "reccheck", exported: new Date().toISOString(), data: {}};
  for(let i = 0; i < localStorage.length; i++){
    const k = localStorage.key(i);
    if(k && k.indexOf("reccheck") === 0) out.data[k] = localStorage.getItem(k);
  }
  const n = Object.keys(out.data).length;
  if(!n){ toast(t("exp.none"), true); return; }
  const blob = new Blob([JSON.stringify(out, null, 1)], {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  const d = new Date();
  a.download = "reccheck-data-" + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + ".json";
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast(t("exp.done", {n}));
}
function importData(file){
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const j = JSON.parse(rd.result);
      const data = (j && j.app === "reccheck" && j.data && typeof j.data === "object" && !Array.isArray(j.data)) ? j.data : null;
      if(!data) throw new Error(t("imp.notours"));
      let n = 0;
      for(const k of Object.keys(data)){
        const v = data[k];
        if(k.indexOf("reccheck") !== 0 || typeof v !== "string") continue;
        try{ JSON.parse(v); }catch(e){ continue; }        // only well-formed entries
        localStorage.setItem(k, v); n++;
      }
      if(!n) throw new Error(t("imp.nodata"));
      loadWatch(); loadRooms(); loadAlerts(); paintAlertsBtn();
      if(MODEL){
        STATE = loadState(MODEL.reportDate);
        syncRooms();
        refresh();
      }
      toast(t("imp.done", {n}) + (MODEL ? "" : t("imp.loadhint")));
    }catch(err){
      toast(t("imp.fail") + (err.message || err), true);
    }
  };
  rd.onerror = () => toast(t("imp.noread"), true);
  rd.readAsText(file);
}

/* ---------- refresh ---------- */
/* Each stage is isolated because they are not actually dependent on one another,
   and treating them as one statement made them so: a throw anywhere in the first
   four meant searchInput() never ran, and the search results sat there showing
   stale data with nothing on screen to say why. Applying a nickname with results
   up is exactly that path -- saveNick -> refresh -> searchInput -- so the card
   kept the old name and the failure was invisible. Now every stage runs, and one
   that fails says so instead of quietly taking the others with it. */
function refresh(){
  const stage = (name, fn) => { try{ fn(); }catch(e){ uiFault("refresh:" + name, e); } };
  stage("summary", renderSummary);
  stage("accordions", renderAccordions);
  stage("watch", renderWatch);
  stage("nicknames", renderNickPanel);
  stage("movements", renderMoves);
  const q = inp().value.trim();
  if(q) stage("search", searchInput);
}

/* Somewhere to put a failure that has nowhere else to go. Until now anything that
   threw in a handler went to a console nobody has open on a hotel front desk, and
   the only evidence was a screen that quietly stopped keeping up. */
let LAST_FAULT = null, FAULT_SEEN = {};
function uiFault(where, e){
  const msg = (e && (e.message || e)) + "";
  LAST_FAULT = new Date().toISOString() + "  " + where + "\n" + ((e && e.stack) || msg);
  try{ console.error("[reccheck]", where, e); }catch(_){}
  try{ localStorage.setItem("reccheckLastFault", LAST_FAULT); }catch(_){}
  // once per distinct fault: enough to notice and report, not enough to nag
  const k = where + "|" + msg;
  if(FAULT_SEEN[k]) return;
  FAULT_SEEN[k] = 1;
  /* The plain half always shows — a screen that quietly stops keeping up is what 1.16.3
     was about. The technical half is only for whoever is debugging. */
  try{ toast(t("fault.toast", {w: where}) + (debugOn() ? " " + msg : ""), true); }catch(_){}
}
window.addEventListener("error", ev => uiFault("window", ev.error || ev.message));
window.addEventListener("unhandledrejection", ev => uiFault("promise", ev.reason));

/* ---------- print (Greek, corrections only) ---------- */
function pad2(n){ return (n < 10 ? "0" : "") + n; }
function nowStamp(){
  const d = new Date();
  return pad2(d.getDate()) + "/" + pad2(d.getMonth() + 1) + "/" + d.getFullYear() +
         " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
}
function grSplit(rates){
  const order = ["24%","13%","6%","base"];
  const parts = [];
  for(const k of order){
    if(rates[k] === undefined || rates[k] === null) continue;
    parts.push((k === "base" ? "βασικό" : k) + ": " + numToMoney(rates[k]));
  }
  return parts.join("  ·  ");
}
function buildPrintSheet(force){
  const missing = [], corrected = [];
  for(const r of MODEL.receipts){
    if(r.cancelled || r.voided) continue;    // void / settled receipts don't go on paper
    const st = rState(r);
    if(st.status === "missing") missing.push(r);
    if(st.corr) corrected.push({r, st});
  }
  const extras = STATE.extras.slice();
  if(!missing.length && !extras.length && !corrected.length && !force) return null;

  const sheet = $("#printSheet");
  sheet.innerHTML = "";
  const esc = t => { const d = document.createElement("div"); d.textContent = t; return d.innerHTML; };

  let h = `<h1>ΕΛΕΓΧΟΣ ΑΠΟΔΕΙΞΕΩΝ — ΔΙΟΡΘΩΣΕΙΣ</h1>
  <div class="meta">Βραδιά: ${esc(MODEL.reportDate)} &nbsp;·&nbsp; Εκτυπώθηκε: ${nowStamp()} &nbsp;·&nbsp; Kernos Hotel</div>`;

  h += `<h2>1. ΔΕΝ ΠΑΡΕΛΗΦΘΗΣΑΝ — καταχωρημένες στο protel, χωρίς φυσική απόδειξη (${missing.length})</h2>`;
  if(missing.length){
    h += `<table><tr><th>ΤΜΗΜΑ</th><th>ΔΩΜ.</th><th>Σ.Ν.</th><th>ΑΝΑΛΥΣΗ</th><th class="num">ΠΟΣΟ</th></tr>`;
    for(const r of missing){
      h += `<tr><td>${esc(r.dept)}</td><td>${esc(r.roomMain)}</td><td>${esc(r.sn)}</td>
            <td>${esc(grSplit(r.rates))}</td>
            <td class="num">${numToMoney(r.total)}</td></tr>`;
    }
    h += `</table>`;
  }else h += `<div class="none">— καμία —</div>`;

  h += `<h2>2. ΕΚΤΟΣ ΑΝΑΦΟΡΑΣ — αποδείξεις που δεν βρέθηκαν στο protel, χειροκίνητη καταχώρηση (${extras.length})</h2>`;
  if(extras.length){
    h += `<table><tr><th>ΤΜΗΜΑ</th><th>ΔΩΜ.</th><th>ΠΕΛΑΤΗΣ</th><th>Σ.Ν.</th><th class="num">24%</th><th class="num">13%</th><th class="num">ΣΥΝΟΛΟ</th></tr>`;
    for(const x of extras){
      /* the real guest name, never the nickname — this sheet goes to reception */
      h += `<tr><td>${esc(x.dept === "UNASSIGNED" ? "ΑΤΑΞΙΝΟΜΗΤΟ" : x.dept)}</td><td>${esc(x.room)}</td>
            <td>${esc(x.guest || guestFor(x.room) || "")}</td><td>${esc(x.sn)}</td>
            <td class="num">${numToMoney(x.v24 || 0)}</td><td class="num">${numToMoney(x.v13 || 0)}</td>
            <td class="num">${numToMoney(Math.round(((x.v24 || 0) + (x.v13 || 0)) * 100) / 100)}</td></tr>`;
    }
    h += `</table>`;
  }else h += `<div class="none">— καμία —</div>`;

  h += `<h2>3. ΔΙΟΡΘΩΣΕΙΣ — Σ.Ν. / ΔΩΜΑΤΙΟ / ΠΟΣΑ (${corrected.length})</h2>`;
  if(corrected.length){
    h += `<table><tr><th>ΤΜΗΜΑ</th><th>ΔΩΜΑΤΙΟ</th><th>Σ.Ν.</th><th>ΠΟΣΑ</th><th>ΚΑΤΑΣΤΑΣΗ</th></tr>`;
    const arrow = (oldV, newV) => `<span class="old">${esc(oldV)}</span> → ${esc(newV)}`;
    for(const {r, st} of corrected){
      const roomCell = st.corr.room ? arrow(r.roomMain, st.corr.room) : esc(r.roomMain);
      const snCell   = st.corr.sn ? arrow(r.sn, st.corr.sn) : esc(r.sn);
      const valCell  = (st.corr.v24 !== undefined || st.corr.v13 !== undefined)
        ? arrow(grSplit(r.rates), grSplit({"24%": st.corr.v24, "13%": st.corr.v13}))
        : esc(grSplit(r.rates));
      h += `<tr><td>${esc(r.dept)}</td><td>${roomCell}</td><td>${snCell}</td><td>${valCell}</td>
            <td>${st.status === "ok" ? "ΔΙΟΡΘΩΘΗΚΕ ✓" : "ΕΚΚΡΕΜΕΙ"}</td></tr>`;
    }
    h += `</table>`;
  }else h += `<div class="none">— καμία —</div>`;

  sheet.innerHTML = h;
  return sheet;
}

$("#exportData").onclick = () => { $("#kebabMenu").classList.remove("open"); exportData(); };
$("#importData").onclick = () => { $("#kebabMenu").classList.remove("open"); $("#importFile").click(); };
$("#mExport").onclick = exportData;
$("#mImport").onclick = () => $("#importFile").click();
$("#importFile").onchange = e => { if(e.target.files[0]) importData(e.target.files[0]); e.target.value = ""; };
$("#collapseAll").onclick = () => { document.querySelectorAll(".acc").forEach(a => a.classList.remove("open")); $("#kebabMenu").classList.remove("open"); };
$("#resetDay").onclick = () => {
  $("#kebabMenu").classList.remove("open");
  if(!MODEL) return;
  openModal(`
    <h3>${t("reset.title")}</h3>
    <div style="font-size:14px;line-height:1.55">${t("reset.body")}
      <b style="font-family:var(--mono);color:var(--amber)">${MODEL.reportDate}</b>?</div>
    <div class="actions">
      <button class="btn" id="rCancel">${t("reset.cancel")}</button>
      <button class="btn" id="rGo" data-def style="border-color:var(--red-dim);color:var(--red)">${t("reset.go")}</button>
    </div>`);
  $("#rCancel").onclick = closeModal;
  $("#rGo").onclick = () => {
    STATE = blankState(MODEL.reportDate);
    saveState();
    closeModal();
    const i = $("#snInput");
    i.value = ""; i.classList.remove("nomatch");
    $("#matches").innerHTML = "";
    $("#notThereBtn").classList.remove("show");
    renderSummary();
    renderAccordions();
    toast(t("reset.toast"), true);
  };
};
/* ---------- auto-update (active only inside the desktop app) ---------- */
(async function(){
  if(window.reccheckFiles){
    try{ FB.p.dept.dir = await window.reccheckFiles.getDir("dept"); }catch(e){}
    try{ FB.p.tax.dir = await window.reccheckFiles.getDir("tax"); }catch(e){}
  }
  if(window.reccheckOverlay){
    try{ OVON = await window.reccheckOverlay.state(); }catch(e){}
    if(window.reccheckOverlay.onState)
      window.reccheckOverlay.onState(on => { OVON = on; paintOverlayBtn(); });
    if(window.reccheckOverlay.onTick)
      window.reccheckOverlay.onTick(id => {        // a task was clicked on the desktop overlay
        const task = CL.find(x => x.id === id);
        if(task){ task.done = !task.done; saveCL(); renderChecklist(); }
      });
  }
  /* The room database the app's own folder is holding, pulled in at start so the nickname
     panel and the names are complete before any report is opened. NOT awaited: nothing on
     this screen needs it yet, and a boot that waits on an IPC round-trip is a boot that
     can hang on one. Opening a report does await it, which is where it has to be right. */
  loadRooms();
  mergeRoomsFromDisk();
  loadAlerts();
  paintAlertsBtn();
  paintSevSel();
  clNightCheck();
  applyLang();
  refreshProfileName();      // applyLang only repaints the cached name; this loads it
  showScreen("menu");
  setInterval(paintClock, 1000);                 // live clock — repaint every second
  setInterval(clNightCheck, 30000);              // night rollover check
  const ver = $("#appVer");
  if(ver) ver.textContent = "v" + APP_VERSION;
  if(!window.reccheckUpdate) return;             // plain browser — nothing to do
  window.reccheckUpdate.version().then(v => { if(ver && v) ver.textContent = "v" + v; }).catch(() => {});
  if(window.reccheckUpdate.onProgress){
    window.reccheckUpdate.onProgress(p => {
      const box = $("#updBox");
      if(!box) return;
      if(p.phase === "failed" || document.getElementById("updateBtn")){ box.style.display = "none"; return; }
      box.style.display = "block";
      box.textContent = t("upd.dl", {pct: (p.pct === null || p.pct === undefined) ? "…" : p.pct + "%"});
    });
  }
  window.reccheckUpdate.onReady(info => {
    const box = $("#updBox");
    if(box) box.style.display = "none";
    if(document.getElementById("updateBtn")) return;
    const b = document.createElement("button");
    b.id = "updateBtn";
    b.title = (info.full && !info.downloaded) ? t("upd.full", {v: info.version}) : t("upd.ready", {v: info.version});
    b.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none">' +
      '<path d="M12 20V5.5 M5.5 12 L12 5.5 L18.5 12" stroke="#4da6ff" stroke-width="2.8" ' +
      'stroke-linecap="round" stroke-linejoin="round"/></svg>';
    b.onclick = () => {
      b.classList.add("busy");
      window.reccheckUpdate.apply().then(ok => { if(!ok) b.classList.remove("busy"); });
    };
    document.body.append(b);
  });
})();
})();
</script>

/* Room movements, kept for the DEPARTMENT check to colour its rooms by. The rate list

   loaded here — so it is recorded here and read over there.

   It is a LEDGER of reservations, not a snapshot per night. Every in-house guest on the
   list already carries the date they are due to leave, so one list answers "who leaves
   tonight" for every night up to the last departure in it. That matters because the tax
   check is only run on nights where the main courante did not balance — on a quiet night
   no rate list is opened at all, and a snapshot store would simply go blank on exactly
   the night the answer was already known days ago.

   rather than inventing a second departure. Dates normalised to YYYYMMDD. */

/* ---- room moves ----

   against his real Rate Check for 01/09: rooms 148, 263 and 535 were moves, and their
   rows are byte-for-byte the same shape as a genuine arrival — same eight columns, same
   x positions, arrival = today. Occupancy, rate, board and agent say nothing either. The
   report simply does not carry the fact. So a move cannot be RECORDED from it; it can
   only be worked out, and he asked for it to be, on 01/09.

   The comparison is the one HE specified for the nickname transfer in 1.17.7: the same
   name, exactly, in a different room, on the night before. The ledger is already the
   daily name cache that needs — it keeps the guest name per stay and `seen`, the night a
   list last confirmed it — so nothing new is stored to make this work.

   Two guards, both of them his, both load-bearing:
     * the old room still showing that name in TONIGHT's list is NOT a move — that is one
       party across two rooms, and this file has seven such groups (families in adjoining
       rooms). Without this guard every one of them would read as a move.

function mvSameName(a, b){
  const n = x => String(x || "").trim().replace(/\s+/g, " ").toUpperCase();

function mvPrevNight(k){

/* Reads the ledger as it stood BEFORE tonight's list is written into it, which is the
   only moment "where was this name last night" can still be answered. */
function detectMoves(led, rate, night){
  const out = [];
  const prev = mvPrevNight(night);
  if(!night || !prev) return out;
  const tonight = {};                       // room -> the names tonight's list puts there
  for(const room of Object.keys(rate.all))
    tonight[room] = rate.all[room].map(x => (x.name || "").trim());
  for(const room of Object.keys(rate.all)){
    for(const x of rate.all[room]){
      if(dkey(x.arr) !== night) continue;   // only rows protel is calling an arrival today
      const name = (x.name || "").trim();
      if(!name) continue;
      const from = [];
      for(const src of Object.keys(led)){
        if(src === room) continue;
        for(const a of Object.keys(led[src])){
          const e = led[src][a], A = Number(a), D = e.d || 0;
          if(e.mv) continue;                          // already vacated by an earlier move
          if(!mvSameName(e.n, name)) continue;
          const wasThere = (e.seen === prev) || (A <= prev && prev < D);
          if(!wasThere) continue;
          if((tonight[src] || []).some(nm => mvSameName(nm, name))) continue;  // still there
          from.push({src: src, key: a});
        }
      }
      if(from.length !== 1) continue;                 // ambiguous moves nothing at all
      out.push({to: room, arr: dkey(x.arr), from: from[0].src, key: from[0].key, name: name});
    }
  }

}
function saveMoves(rate){

  let wrote=0,why="";

    /* Worked out BEFORE the write loop: afterwards the ledger already says the guest is
       in the new room and the question can no longer be asked. */
    const moves=detectMoves(led, rate, night);
    /* Record the dates the list actually carries, and nothing else.
       There used to be a rule here that shortened a stay whenever a room's arrival date
       did not match what was stored — meant to catch early checkouts. It keyed on the
       arrival, so an arrival that parsed even slightly differently read as "different
       reservation, the old one must be over" and cut a running stay back to the list's own
       date. On the night of 30/08 it manufactured 83 departures against 1 arrival, with
       every false departure landing exactly on the list date. Rooms 73, 75, 91, 98, 120,
       125 and 128 were all cut to 30/08 while protel had them staying to September.
       The desk does not want early checkouts inferred; it wants the dates in the system. */
    for(const room of Object.keys(rate.all)){
      for(const r of rate.all[room]){
        const a=dkey(r.arr), d=dkey(r.dep);
        if(!a)continue;
        const m=led[room]=led[room]||{};
        // a later list wins: that is how an extended stay corrects its departure date

      }
    }

       row can drag.

       This used to take the floor from the NEWEST DEPARTURE IN THE LEDGER minus a year,
       which handed the decision to whatever the furthest-future row happened to say.
       protel prints an open-ended reservation as 31/12/99, and dkey reads a two-digit
       year as 20xx (5288), so ONE such row set newest to 20991231 and the floor to
       20981231 — deleting every real 2026 stay, surviving the cull itself because its own
       date is above the floor, and doing the same again on every later rate list. The
       ledger would have come back empty for ever with nothing on screen to say why.
       Reproduced against this exact code before changing it.

       The list's own business date is a real date and cannot be dragged by a row. With no
       date, nothing is pruned at all: an unbounded ledger is a bad day, a wiped one is a
       lost night.

       And a stay is no longer dropped merely for having NO departure date. `d||0` put
       every such entry below any positive floor. A stay protel printed without a
       departure is a stay whose departure protel has not stated — not an old one. */
    if(night){
      const floor=night-10000;                     // ~a year in YYYYMMDD arithmetic

        for(const a of Object.keys(led[room])){
          const dd=led[room][a].d||0;
          if(dd&&dd<floor)delete led[room][a];
        }
        if(!Object.keys(led[room]).length)delete led[room];
      }
    }

       departure date: the guest did leave that room, but protel never called it a
       departure and inventing one would put a pill on his panel that his own list does
       not have. `mv` simply stops the stale stay asserting anything — which is what was
       silently firing a departure on that room weeks later. */
    for(const m of moves){
      const dst=led[m.to]&&led[m.to][m.arr];
      if(dst)dst.from=m.from;                  // this stay began as a move out of that room
      const src=led[m.from]&&led[m.from][m.key];
      if(src)src.mv=night;                     // vacated by a room move on this night
    }
    localStorage.setItem(MOVES_KEY,JSON.stringify(led));
    /* What this list actually put in the ledger, so DEBUG can answer "why no pills?"
       without anyone having to guess at it a second time. */
    let rooms=0,res=0;for(const r of Object.keys(led)){rooms++;res+=Object.keys(led[r]).length;}
    try{localStorage.setItem("reccheck_moves_last",JSON.stringify({
      biz:rate.bizDate||"(none in the header)", key:night||0, sure:!!rate.dateSure,
      moves:moves.map(m=>m.from+"\u2192"+m.to),
      listRooms:Object.keys(rate.all).length, wrote:wrote,
      ledgerRooms:rooms, ledgerRes:res}));}catch(e){}
    return {night:night, sure:!!rate.dateSure, rooms:Object.keys(rate.all).length, res:res};
  }catch(e){
    why=String(e&&e.message||e);
    try{localStorage.setItem("reccheck_moves_last",JSON.stringify({
      biz:rate&&rate.bizDate||"", key:rate&&rate.dateKey||0, wrote:wrote, error:why}));}catch(e2){}
  }
  return null;
}

function sk(a){return a.sort((x,y)=>(parseInt(x)||0)-(parseInt(y)||0));}
function rowHTML(room,name,tagCls,tagLabel,meta){return `<div class="row"><span class="rm">${room}</span><span class="nm">${name||''}</span><span class="tag ${tagCls}">${tagLabel}</span><span class="meta">${meta||''}</span></div>`;}

/* ============ main render ============ */
function decidePairing(){
  if(RATE && TAX){
    if(PAIR_OVERRIDE && PAIR_OVERRIDE.mode==='decline') return {state:'diff'};
    if(PAIR_OVERRIDE && PAIR_OVERRIDE.mode==='paired') return {state:'paired', night:PAIR_OVERRIDE.night};
    if(RATE.dateKey===TAX.dateKey) return {state:'paired', night:TAX.dateKey};
    return {state:'needprompt'};
  }
  if(TAX) return {state:'tax'};
  if(RATE) return {state:'rate'};
  return {state:'none'};
}
function render(){
  const d=decidePairing();
  const bn=el('banner'), sm=el('ta-summary'), rs=el('results');
  sm.style.display='none'; sm.innerHTML=''; rs.innerHTML=''; bn.innerHTML='';
  el('memsec').style.display = (TAX? 'block':'none');

  if(d.state==='needprompt'){ openModal(); }

  if(d.state==='paired'){
    const x=crossReference(RATE,TAX,d.night);
    const over=overchargeFromMemory();
    const adjPending=x.adjoining.filter(o=>!verifyOf(d.night,o.room)).length;
    const adjProblem=x.adjoining.filter(o=>verifyOf(d.night,o.room)==='problem').length;
    const adjOk=x.adjoining.filter(o=>verifyOf(d.night,o.room)==='ok').length;
    bn.innerHTML=`<div class="banner ok">${t('b_paired', dfmt(RATE.dateKey)||RATE.bizDate, dfmt(d.night))}</div>`;
    sm.style.display='flex';
    const overPend=over.filter(o=>!ackOf(o.room,o.extra)).length;
    sm.innerHTML=stat('stat_night',dfmt(d.night),true)+stat('stat_inhouse',RATE.count)+stat('stat_posted',TAX.totalRooms)+stat('stat_flags',x.totalFail.length+x.autoMiss.length+overPend+adjProblem);
    rs.innerHTML=
      ackSection('fail','sec_fail','empty_fail',x.totalFail,d.night,o=>['red',t('tag_fail'),t('meta_fail')],false)+
      ackSection('auto','sec_auto','empty_auto',x.autoMiss,d.night,o=>['red',o.covered?t('tag_auto_cov'):t('tag_auto_none'),o.covered?t('meta_auto_cov'):t('meta_auto_none')],true)+
      ackSection('over','sec_over','empty_over',over,d.night,o=>['amber',t('tag_over',o.extra),t('meta_over',o.extra,o.nights)],false,'ov:')+
      adjSection(x.adjoining, d.night, adjPending, adjOk, adjProblem)+
      `<div class="legend">${t('okline',x.okCount,x.notOwed)}</div>`;
    renderMemory();
    return;
  }
  if(d.state==='diff'){
    bn.innerHTML=`<div class="banner warn">${t('b_diffnights', RATE.bizDate, TAX.fileDate)}</div>`;
    renderTaxStandalone(); renderRosterInto(rs,true); renderMemory(); return;
  }
  if(d.state==='tax'){
    bn.innerHTML=`<div class="banner">${t('b_onlytax', TAX.fileDate)}</div>`;
    renderTaxStandalone(); renderMemory(); return;
  }
  if(d.state==='rate'){
    bn.innerHTML=`<div class="banner">${t('b_onlyrate', RATE.bizDate)}</div>`;
    renderRosterInto(rs,false); return;
  }
}
function stat(k,v,sm){return `<div class="stat"><div class="k">${t(k)}</div><div class="v ${sm?'sm':''}">${v}</div></div>`;}
function sect(titleKey,cid,count,body){return `<section><h2><span>${t(titleKey)}</span> <span class="count">${count}</span></h2><div class="card">${body}</div></section>`;}
function sectAuto(count,body){return `<section><h2 style="align-items:center"><span>${t('sec_auto')}</span> <span class="count">${count}</span>`+(count?`<button class="mini" data-print="1" style="margin-left:auto">${t('btn_print')}</button>`:'')+`</h2><div class="card">${body}</div></section>`;}
function escHtml(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function buildPrintReport(){
  const d=decidePairing(); let night='',rooms=[],paired=(d.state==='paired');
  if(paired){const x=crossReference(RATE,TAX,d.night);night=dfmt(d.night);
    rooms=x.autoMiss.map(o=>{const rr=RATE.rooms[o.room]||{};return{room:o.room,name:o.name||rr.name||'',term:rr.term||'',agent:rr.agent||'',arr:rr.arr||'',dep:rr.dep||'',covered:o.covered,adj:false};});
    // adjoining rooms manually flagged "Missing" are the same underlying problem — include them
    x.adjoining.forEach(o=>{ if(verifyOf(d.night,o.room)==='problem'){const rr=RATE.rooms[o.room]||{};rooms.push({room:o.room+(o.partner?('-'+o.partner):''),name:o.name||rr.name||'',term:rr.term||'',agent:rr.agent||'',arr:rr.arr||'',dep:rr.dep||'',covered:false,adj:true});} });
    rooms.sort((a,b)=>(parseInt(a.room)||0)-(parseInt(b.room)||0));
  }
  else if(TAX){night=TAX.fileDate;const mem=loadMem();const man=r=>((mem[r]||{})[TAX.fileDate]||{}).manual||null;
    rooms=Object.keys(TAX.rooms).filter(r=>{const b=TAX.rooms[r];return b.arr>0&&b.auto===0&&!man(r);}).sort((a,b)=>(parseInt(a)||0)-(parseInt(b)||0)).map(r=>({room:r,name:'',term:'',agent:'',arr:'',dep:'',covered:TAX.rooms[r].man>0,adj:false}));}
  const _n=new Date(),_p=x=>String(x).padStart(2,'0');const now=_p(_n.getDate())+'/'+_p(_n.getMonth()+1)+'/'+_n.getFullYear()+' '+_p(_n.getHours())+':'+_p(_n.getMinutes());
  let head='<tr><th>'+t('pr_h_room')+'</th>'+(paired?('<th>'+t('pr_h_guest')+'</th><th>'+t('pr_h_board')+'</th><th>'+t('pr_h_operator')+'</th><th>'+t('pr_h_stay')+'</th>'):'')+'<th>'+t('pr_h_auto')+'</th></tr>';
  let body=rooms.length? rooms.map(r=>{const stay=(r.arr&&r.dep)?(r.arr+' → '+r.dep):'';const status=r.adj?(t('pr_covered')+' ('+t('pr_adjnote')+')'):(r.covered?t('pr_covered'):t('pr_notcovered'));
    return '<tr><td>'+escHtml(r.room)+'</td>'+(paired?('<td>'+escHtml(r.name)+'</td><td>'+escHtml(r.term)+'</td><td>'+escHtml(r.agent)+'</td><td>'+stay+'</td>'):'')+'<td>'+status+'</td></tr>';}).join('')
    : '<tr><td colspan="'+(paired?6:2)+'">'+t('pr_empty')+'</td></tr>';
  return '<div class="pr"><h1>'+t('pr_title')+'</h1><div class="prmeta">'+t('pr_meta',night,now,rooms.length)+'</div><table><thead>'+head+'</thead><tbody>'+body+'</tbody></table><div class="prfoot">'+t('pr_foot')+'</div></div>';
}
function printReport(){document.body.classList.add('taxPrint');el('print-mount').innerHTML=buildPrintReport();window.print();}
window.addEventListener('afterprint',()=>document.body.classList.remove('taxPrint'));
function empt(k){return `<div class="empty">${t(k)}</div>`;}
function adjRow(o,night){
  const st=verifyOf(night,o.room);
  let tagCls,tagLabel,meta;
  if(st==='ok'){tagCls='ok';tagLabel=t('tag_verified_ok');meta=t('meta_verified_ok');}
  else if(st==='problem'){tagCls='red';tagLabel=t('tag_verified_problem');meta=t('meta_verified_problem');}
  else {tagCls='violet';tagLabel=t('tag_adj',o.partner?(''+o.partner):'');meta='';}
  const btns=`<span class="btns">`+
    `<button class="mini ${st==='ok'?'on-arr':''}" data-verify="ok" data-room="${o.room}" data-night="${night}">${t('btn_ok')}</button>`+
    `<button class="mini ${st==='problem'?'on-prob':''}" data-verify="problem" data-room="${o.room}" data-night="${night}">${t('btn_missing')}</button>`+
    `</span>`;
  return `<div class="row"><span class="rm">${o.room}${o.partner?('-'+o.partner):''}</span><span class="nm">${o.name||''}</span><span class="tag ${tagCls}">${tagLabel}</span><span class="meta">${meta}</span>${btns}</div>`;
}
function ackRow(o,night,tagCls,tagLabel,meta,ns){
  const persistent=ns==='ov:';        // overcharges come from cross-night memory — their ack survives the night rollover
  const dis=persistent?ackOf(o.room,o.extra):(verifyOf(night,ns+o.room)==='dismissed');
  const attrs=persistent?`data-ack="${o.room}" data-bal="${o.extra}"`:`data-verify="dismissed" data-room="${ns+o.room}" data-night="${night}"`;
  const btn=`<span class="btns"><button class="mini ${dis?'on-arr':''}" ${attrs}>${t('btn_dismiss')}</button></span>`;
  if(dis)return `<div class="row"><span class="rm">${o.room}</span><span class="nm">${o.name||''}</span><span class="tag ok">${t('tag_dismissed')}</span><span class="meta"></span>${btn}</div>`;
  return `<div class="row"><span class="rm">${o.room}</span><span class="nm">${o.name||''}</span><span class="tag ${tagCls}">${tagLabel}</span><span class="meta">${meta}</span>${btn}</div>`;
}
function ackSection(key,titleKey,emptyKey,list,night,spec,withPrint,ns){ns=ns||'';
  if(!list.length)return `<div class="dgroup seg"><div class="dhead static"><span class="segtitle">${t(titleKey)}</span><span class="count c-none">${t('pill_none')}</span></div></div>`;
  const total=list.length;let dN=0;for(const o of list)if(ns==='ov:'?ackOf(o.room,o.extra):verifyOf(night,ns+o.room)==='dismissed')dN++;
  const pending=total-dN, done=pending===0;
  const open=SEC_OPEN[key]!==undefined?SEC_OPEN[key]:pending>0;
  const body=list.map(o=>{const sp=spec(o);return ackRow(o,night,sp[0],sp[1],sp[2],ns);}).join('');
  const pbtn=withPrint?`<button class="mini" data-print="1" style="margin-left:auto">${t('btn_print')}</button>`:'';
  return `<div class="dgroup seg${open?' open':''}"><div class="dhead" data-adjtoggle="${key}"><span class="caret">▶</span><span class="segtitle ${done?'t-ok':''}">${t(titleKey)}${done?' ✓':''}</span><span class="count ${done?'c-ok':''}">${dN}/${total}</span>${pbtn}</div><div class="dbody">${body}</div></div>`;
}
function adjSection(list,night,pending,okN,probN){
  const open = SEC_OPEN.adj!==undefined ? SEC_OPEN.adj : pending>0;
  if(!list.length) return `<div class="dgroup seg"><div class="dhead static"><span class="segtitle">${t('sec_adj')}</span><span class="count c-none">${t('pill_none')}</span></div></div>`;
  const body = list.map(o=>adjRow(o,night)).join('');
  const summary = `<div class="legend" style="margin-top:6px">${t('adj_summary',pending,okN,probN)}</div>`;
  const checked=okN+probN, total=list.length;
  const allOk = pending===0 && probN===0;
  const titleCls = probN>0?'t-warn':(allOk?'t-ok':'');
  const cntCls = probN>0?'c-warn':(allOk?'c-ok':'');
  return `<div class="dgroup seg${open?' open':''}"><div class="dhead" data-adjtoggle="adj"><span class="caret">▶</span><span class="segtitle ${titleCls}">${t('sec_adj')}${allOk?' ✓':''}</span><span class="count ${cntCls}">${checked}/${total}</span></div><div class="dbody">${body}`+
    `<div class="legend">${t('adj_legend')}</div>`+summary+`</div></div>`;
}

function renderRosterInto(container,append){
  const adj=Object.keys(RATE.rooms).filter(r=>RATE.rooms[r].adjoining);
  const list=sk(Object.keys(RATE.rooms));
  let rowsHtml=list.map(r=>{const rr=RATE.rooms[r];return `<div class="row"><span class="rm">${r}${rr.adjoining?('-'+rr.partner):''}</span><span class="nm">${rr.name}</span><span class="meta">${rr.arr} → ${rr.dep}</span>${rr.adjoining?`<span class="tag violet">${t('tag_adj','')}</span>`:''}</div>`;}).join('');
  const html=`<section><h2><span>${t('roster_head')}</span> <span class="count">${list.length}</span></h2>`+
    `<div class="legend" style="margin-top:0;margin-bottom:8px">${t('roster_sub',list.length,adj.length,RATE.bizDate)}</div>`+
    `<div class="card">${rowsHtml}</div></section>`;
  if(append)container.innerHTML+=html; else container.innerHTML=html;
}

/* Tax standalone (no rate loaded / declined) — the v3 logic */
function renderTaxStandalone(){
  const r=TAX; const mem=loadMem();
  const manualOf=room=>((mem[room]||{})[r.fileDate]||{}).manual||null;
  const autoMiss=[]; for(const room of Object.keys(r.rooms)){const b=r.rooms[room];if(b.arr>0&&b.auto===0&&!manualOf(room))autoMiss.push({room,covered:b.man>0});}
  autoMiss.sort((a,b)=>(parseInt(a.room)||0)-(parseInt(b.room)||0));
  const noArrAll=Object.keys(r.rooms).filter(room=>{const b=r.rooms[room];return b.arr===0&&((b.auto||0)+(b.man||0))>0;});
  const noArr=sk(noArrAll.filter(room=>!manualOf(room)));const classified=noArrAll.length-noArr.length;
  const over=overchargeFromMemory();
  over.sort((a,b)=>(parseInt(a.room)||0)-(parseInt(b.room)||0));
  const overPend=over.filter(o=>!ackOf(o.room,o.extra)).length;
  const sm=el('ta-summary'); sm.style.display='flex';
  sm.innerHTML=stat('stat_night',r.fileDate,true)+stat('stat_posted',r.totalRooms)+stat('stat_flags',autoMiss.length+overPend);
  const rs=el('results');
  rs.innerHTML +=
    sectAuto(autoMiss.length, autoMiss.length? autoMiss.map(o=>rowHTML(o.room,'','red',o.covered?t('tag_auto_cov'):t('tag_auto_none'),o.covered?t('meta_auto_cov'):t('meta_auto_none'))).join(''):empt('empty_auto'))+
    sect('sec_over','a2',overPend, over.length? over.map(o=>ackRow(o,0,'amber',t('tag_over',o.extra),t('meta_over',o.extra,o.nights),'ov:')).join(''):empt('empty_over'))+
    sect('sec_adj','a3',0,'')+  // placeholder to keep layout (hidden below)
    noArrSection(noArr,classified);
  // remove empty adjoining placeholder in standalone
  const secs=rs.querySelectorAll('section'); if(secs[2])secs[2].remove();
}
function noArrSection(noArr,classified){
  const body = noArr.length? noArr.map(noArrRow).join('') : `<div class="empty">${classified?t('empty_noarr_classified',classified):t('empty_noarr')}</div>`;
  return `<section><h2><span>${t('tag_noarr')}</span> <span class="count">${noArr.length}</span></h2><div class="card">${body}</div></section>`;
}
function noArrRow(room){const mem=loadMem();const cur=((mem[room]||{})[TAX.fileDate]||{}).manual||null;
  return `<div class="row"><span class="rm">${room}</span><span class="tag grey">${t('tag_noarr')}</span><span class="meta">${t('meta_noarr')}</span><span class="btns"><button class="mini ${cur==='arrival'?'on-arr':''}" data-room="${room}" data-set="arrival">${t('btn_arrival')}</button><button class="mini ${cur==='checkout'?'on-out':''}" data-room="${room}" data-set="checkout">${t('btn_checkout')}</button></span></div>`;}

/* memory accordion (tax) */
function deriveStatus(e){const man=e.manual||null;if(man==='arrival')return['blue',t('tag_arrival'),true];if(man==='checkout')return['blue',t('tag_checkout'),true];if((e.arr||0)===0)return['grey',t('tag_noarr'),true];if((e.auto||0)===0&&(e.man||0)===0)return['red',t('tag_auto_none'),false];if((e.auto||0)===0&&(e.man||0)>0)return['red',t('tag_auto_cov'),false];if(((e.auto||0)+(e.man||0))>=2)return['amber',t('tag_double'),false];return['ok',t('tag_ok'),false];}
function renderMemory(){const mem=loadMem();const dates=recentDates(mem,7);const acc=el('acc');if(!dates.length){acc.innerHTML=`<div class="empty" style="background:var(--panel);border:1px solid var(--line);border-radius:10px">${t('mem_empty')}</div>`;return;}let html='';for(const d of dates){const items=[];let total=0,autox=0,dbl=0,noarr=0,arr=0,out=0;for(const room of Object.keys(mem)){const e=mem[room][d];if(!e)continue;total++;const [cls,label,click]=deriveStatus(e);const man=e.manual||null;if(man==='arrival')arr++;else if(man==='checkout')out++;else if((e.arr||0)===0)noarr++;else if((e.auto||0)===0)autox++;else if(((e.auto||0)+(e.man||0))>=2)dbl++;if(cls!=='ok')items.push([room,cls,label,click]);}items.sort((a,b)=>(parseInt(a[0])||0)-(parseInt(b[0])||0));let chips=`<span class="chip">${total} ${t('chip_rooms')}</span>`;if(autox)chips+=`<span class="chip red">${autox} ${t('chip_auto')}</span>`;if(dbl)chips+=`<span class="chip amber">${dbl} ${t('chip_double')}</span>`;if(noarr)chips+=`<span class="chip grey">${noarr} ${t('chip_noarr')}</span>`;if(arr)chips+=`<span class="chip blue">${arr} ${t('chip_arr')}</span>`;if(out)chips+=`<span class="chip blue">${out} ${t('chip_out')}</span>`;let body;if(!items.length)body=`<div class="empty">${t('date_allok')}</div>`;else body=items.map(function(it){const room=it[0],cls=it[1],label=it[2],click=it[3];const tc=click?(cls+' click cyc'):cls;const da=click?('data-room="'+room+'" data-date="'+d+'"'):'';return '<div class="row"><span class="rm">'+room+'</span><span class="tag '+tc+'" '+da+'>'+label+'</span></div>';}).join('');const open=EXPANDED.has(d)?' open':'';html+='<div class="dgroup'+open+'"><div class="dhead" data-toggle="'+d+'"><span class="caret">▶</span><span class="ddate">'+d+'</span><span class="chips">'+chips+'</span></div><div class="dbody">'+body+'</div></div>';}acc.innerHTML=html;}

/* manual tagging */
function setManual(room,date,val){const mem=loadMem();const rec=mem[room]||(mem[room]={});const e=rec[date]||(rec[date]={arr:0,auto:0,man:0,manual:null});e.manual=val;saveMem(mem);}
function cycleManual(room,date){const mem=loadMem();const e=((mem[room]||{})[date])||{manual:null};const order=[null,'arrival','checkout'];const nx=order[(order.indexOf(e.manual)+1)%3];setManual(room,date,nx);}
document.addEventListener('click',ev=>{const ah=ev.target.closest('[data-adjtoggle]');if(ah&&!ev.target.closest('[data-print]')){const sec=ah.closest('.seg');if(!sec)return;sec.classList.toggle('open');SEC_OPEN[ah.getAttribute('data-adjtoggle')]=sec.classList.contains('open');return;}const pbtn=ev.target.closest('[data-print]');if(pbtn){printReport();return;}const tg=ev.target.closest('[data-toggle]');if(tg){const d=tg.getAttribute('data-toggle');if(EXPANDED.has(d))EXPANDED.delete(d);else EXPANDED.add(d);renderMemory();return;}const ab=ev.target.closest('button[data-ack]');if(ab){toggleAck(ab.getAttribute('data-ack'),Number(ab.getAttribute('data-bal')));SEC_OPEN={};render();return;}
const vb=ev.target.closest('button[data-verify]');if(vb){const room=vb.getAttribute('data-room');const night=Number(vb.getAttribute('data-night'));const val=vb.getAttribute('data-verify');const cur=verifyOf(night,room);setVerify(night,room,cur===val?null:val);SEC_OPEN={};render();return;}
const b=ev.target.closest('button[data-set]');if(b){const room=b.getAttribute('data-room');const set=b.getAttribute('data-set');const cur=((loadMem()[room]||{})[TAX.fileDate]||{}).manual||null;setManual(room,TAX.fileDate,cur===set?null:set);render();return;}const c=ev.target.closest('.cyc');if(c){cycleManual(c.getAttribute('data-room'),c.getAttribute('data-date'));render();return;}});
el('menu-btn').addEventListener('click',e=>{e.stopPropagation();el('menu-drop').classList.toggle('show');});
document.addEventListener('click',e=>{if(!e.target.closest('.menu'))el('menu-drop').classList.remove('show');});
el('reset-mem').addEventListener('click',()=>{if(confirm(t('confirm_clear'))){localStorage.removeItem(MEM_KEY);localStorage.removeItem(VERIFY_KEY);localStorage.removeItem(ACK_KEY);EXPANDED.clear();el('menu-drop').classList.remove('show');render();}});

/* ============ modal ============ */
function openModal(){
  el('m-title').textContent=t('m_title');
  el('m-body1').textContent=t('m_body1', RATE.bizDate, dfmt(TAX.dateKey));
  el('m-datelabel').textContent=t('m_datelabel');
  el('m-date').value=dfmt(TAX.dateKey);
  el('m-decline').textContent=t('m_decline'); el('m-continue').textContent=t('m_continue');
  el('m-back').textContent=t('m_back'); el('m-confirmbtn').textContent=t('m_confirmbtn');
  el('m-confirm').style.display='none'; el('m-row1').style.display='flex'; el('m-row2').style.display='none';
  el('backdrop').classList.add('show');
}
function closeModal(){el('backdrop').classList.remove('show');}
el('m-decline').addEventListener('click',()=>{PAIR_OVERRIDE={mode:'decline'};closeModal();render();});
el('m-continue').addEventListener('click',()=>{
  const entered=(el('m-date').value||'').trim();
  if(dkey(entered)!==TAX.dateKey){ el('m-confirm').style.display='block'; el('m-confirm').style.color='var(--amber)'; el('m-confirm').textContent=t('m_nomatch', entered||'—', dfmt(TAX.dateKey)); return; }
  el('m-confirm').style.display='block'; el('m-confirm').style.color='var(--muted)';
  el('m-confirm').textContent=t('m_confirm', entered, dfmt(TAX.dateKey));
  el('m-row1').style.display='none'; el('m-row2').style.display='flex';
});
el('m-back').addEventListener('click',()=>{el('m-confirm').style.display='none';el('m-row2').style.display='none';el('m-row1').style.display='flex';});
el('m-confirmbtn').addEventListener('click',()=>{PAIR_OVERRIDE={mode:'paired',night:TAX.dateKey};closeModal();render();});
/* Enter = continue / confirm, Esc = close — same manners as the rest of the app */
document.addEventListener('keydown',e=>{
  if(!el('backdrop').classList.contains('show'))return;
  if(e.key==='Escape'){closeModal();return;}
  if(e.key==='Enter'){
    const a=document.activeElement;
    if(a&&a.tagName==='BUTTON')return;
    e.preventDefault();
    if(el('m-row2').style.display!=='none')el('m-confirmbtn').click();
    else el('m-continue').click();
  }
});

/* ============ language ============ */
function applyStatic(){el('apptitle').innerHTML='<span>'+t('app_brand')+'</span> '+t('app_rest');document.querySelectorAll('[data-i18n]').forEach(e=>{e.textContent=t(e.getAttribute('data-i18n'));});el('memhint').textContent=t('mem_hint');el('foot').textContent=t('foot');}
function setLang(l){LANG=l;try{localStorage.setItem('ta_lang',l);}catch(e){}applyStatic();render();}

/* ============ file loading ============ */
function showErr(m){const e=el('err');e.style.display='block';e.textContent=m;} function clearErr(){el('err').style.display='none';}
async function readOxps(file){const buf=await file.arrayBuffer();const zip=await JSZip.loadAsync(buf);const hasPages=Object.keys(zip.files).some(n=>/Pages\/\d+\.fpage$/i.test(n));if(!hasPages)throw new Error('notxps');return await oxpsPages(zip);}
/* The movements panel lives on the other screen, so a rate list that recorded nothing

/* ---- the in-house list, read live, instead of printed to XPS ----
   The helper answers in tab-separated lines: TITLE, then one IH row per guest, then DONE
   with the counts and the cost. Everything after the parse is the SAME path a loaded
   .oxps takes — inhouseToRate produces exactly what parseRate produces, and saveMoves
   does the rest. Nothing here writes the ledger by itself. */
function parseInhouse(txt){
  const rows = []; let title = "", done = null, err = "";
  for(const line of String(txt || "").split(/\r?\n/)){
    if(!line) continue;
    const c = line.split("\t");
    if(c[0] === "IH"){ rows.push([c[1], "", c[2], "", c[3], c[4], c[5], "", "", "", "", c[6]]); }
    else if(c[0] === "TITLE") title = c[1] || "";
    else if(c[0] === "ERR") err = c[1] || "unknown";
    else if(c[0] === "DONE") done = {got:+c[1]||0, rows:+c[2]||0, msgs:+c[3]||0, ms:+c[4]||0,
                                     enc:c[5]||"", cut:c[6] === "cut-short"};
  }
  return {rows, title, done, err};
}
/* A read only becomes data when the window holding the list SAYS it is the in-house
   list. On 04/09 he had the arrival list open but restored, not maximised: the frame's
   caption named no report at all and the read came back with the in-house list's 250
   rows sitting behind it. The helper now scopes a read to the active MDI child and
   reports that child's own caption, and this refuses anything that caption does not
   identify. Without both, whichever list happened to be in front would have gone into
   the ledger as tonight's stays.

   The refusal SHOWS the caption it saw. If protel words it differently on his machine
   the wording is on screen to be read, rather than a pattern guessed at from here. */
function isInhouseTitle(title){ return /in\s*-?\s*house/i.test(String(title || "")); }
/* "Guests inhouse: 04/09/26" — the date is in the window's own caption, which is the one
   thing about this that costs protel nothing at all. */
function inhouseDate(title){
  const m = String(title || "").match(/(\d{1,2}\/\d{1,2}\/\d{2,4})/g);
  return m && m.length ? m[m.length - 1] : "";
}
/* HIS CAVEAT, 04/09: "for the tool to truly read automatically the data make it attempt
   to read every 3 seconds" — and, when this stopped after the first success: "we dont
   want it to stop, as long as the process is open and running it keeps running".

   So it runs for the life of the app, on every screen, whether or not it has already got
   tonight's list. That was put to him with the cost: a FAILED attempt costs protel
   nothing at all — the hunt is window-manager reads, and not one message is sent until
   the list is found — but a SUCCESSFUL one is about 1500 messages, so every three seconds
   is roughly 30,000 a minute, all shift, against software that is not his. He was told
   that plainly and chose this. It is his machine and his call; it is recorded here so it
   is a decision and not a drift.

   WHAT IS NOT REPEATED is the work behind the read. A list that has not changed since the
   last tick writes nothing and redraws nothing: re-saving the ledger and re-rendering
   twenty times a minute would move the page under his hands mid-audit, and that is a
   fault rather than a faithfulness. The read still happens at his cadence. */
let LIVE_TIMER = null;
let LIVE_SIG = "";                       // the last list seen, so an unchanged one is cheap
/* He asked for three seconds and then offered five "if you think its going to cause
   issues". Five, and the reason is the successful read rather than the failed one: at
   three it is about 30,000 messages a minute into protel all shift, at five about 18,000.
   Two seconds is nothing to him — the list lands while he is still looking at protel —
   and it is a third off the load on software that is not his. */
const LIVE_RETRY_MS = 5000;
/* Clearing the ledger from OPTIONS must also clear what the loop remembers, or every list
   looks unchanged and nothing is ever written back — he would empty it and watch it stay
   empty. The reset lives in the other scope, so this is its door. */
window.__taForget = function(){
  try{ LIVE_SIG = ""; RPT_SIG = {}; LIVE_AT = {}; LIVE_HELD = {}; LIVE_ERR = {}; LEDGER_TICK++; }catch(e){}
  try{ localStorage.removeItem(MOVES_DONE_KEY); }catch(e){}
};
function liveStop(){
  if(LIVE_TIMER){ clearInterval(LIVE_TIMER); LIVE_TIMER = null; }
}
/* Started at boot and whenever legacy changes. Legacy is the manual mode, so it is the
   one thing that switches this off. */
function liveEnsure(){
  if(legacyOn() || !LIVE_OK){ liveStop(); return; }
  if(LIVE_TIMER) return;
  autoReadInhouse();
  LIVE_TIMER = setInterval(autoReadInhouse, LIVE_RETRY_MS);
}
/* THE IN-HOUSE LIST EVERY TICK, THE OTHER THREE IN TURN.

   Four lists on every tick would be four rc-tbind.exe launches every five seconds -- some
   thirty thousand process starts across a night shift, on his machine, for lists that do
   not change that fast. The in-house list is the one everything else is built on, so it
   keeps the cadence he asked for; the moves window and the two reports take one tick each
   in rotation, which is a read of each about every fifteen seconds.

   A failed hunt still costs protel nothing at all -- it is window-manager reads and no
   message is sent until the list is found -- so the rotation is about the machine, not
   about protel. */
/* ---- collecting what the helper captured ----

   His, 04/09: "when a user opens protel the tool knows and scans the list opened".

   THE PAGE NO LONGER DRIVES PROTEL ON A TIMER. The resident helper holds a WinEvent hook
   and reads a list the moment it appears, leaving the rows in a file. This collects those
   files, which is a file read through IPC: no process is launched and protel is not
   touched at all, however often it runs. That is what makes the two-second case work — the
   rows were taken when the window opened, so they are still there to collect after it has
   gone, and it also settles the departures cadence he raised: a departure report is read
   when he opens one, which is when it changes, and never in between.

   The manual button still spawns a read, because pressing it is a question about right
   now. Legacy mode still switches all of it off. */
const LIVE_TAGS = ["IH", "MV", "AR", "DP"];
let LIVE_AT = {};                              // tag -> the capture already taken
/* WHAT THE TOOL IS HOLDING, not just what last arrived.

   His, 05/09, with the in-house list open in protel and a departure report on the line:
   "i see the in house list opened but no refresh in reccheck". Nothing was broken. The
   helper does not re-read a caption it has already read — "Guests inhouse: 05/09/26"
   does not change when the window is re-opened — so no new file appeared, nothing was
   ingested, and the line went on reporting the last thing that did arrive. The list he
   was looking at was already in the ledger and the screen had no way to say so.

   So the row carries a second, quieter line naming each list the tool holds and when it
   was taken. It costs protel NOTHING: the files are already on disk and already read
   every tick, and this only reads their captions. Recomputed when a capture's timestamp
   changes and cached otherwise, so a list of 250 rows is not re-scanned every 5 s. */
let LIVE_HELD = {};                            // tag -> {at, date, rows, total, why}
let LIVE_ERR = {};                             // tag -> why its capture file could not be read
let LIVE_ROWS = {};                            // tag -> {p: the parsed capture, at} — what STATUS shows
let LEDGER_TICK = 0;                           // bumped whenever this half writes the ledger
function heldOf(tag, at, txt){
  let date = "", rows = 0, total = 0;
  for(const line of String(txt || "").split(/\r?\n/)){
    if(!line) continue;
    if(line.indexOf(tag + "\t") === 0) rows++;
    else if(line.indexOf("TITLE\t") === 0) date = inhouseDate(line.slice(6));
    /* what protel's list HELD, beside what the helper got of it: a cut-short capture
       used to be summarised by the smaller number alone, as though it were the list */
    else if(line.indexOf("DONE\t") === 0) total = +line.split("\t")[2] || 0;
  }
  return {at: at, date: date, rows: rows, total: total, why: ""};
}
function hhmm(at){
  /* mtimes only. A test fixture numbers its captures 1, 2, 9 — printing 1970 for those
     would be a wrong answer dressed as a measurement, so they simply carry no time. */
  if(!(at > 1e12)) return "";
  try{ const d = new Date(at);
       return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
  catch(e){ return ""; }
}
function paintHeld(){
  const box = el('liveHeld');
  if(!box) return;
  const bits = [];
  for(const tag of LIVE_TAGS){
    const h = LIVE_HELD[tag];
    if(h){
      const when = hhmm(h.at);
      const n = (h.total && h.total !== h.rows) ? t('held_rows2', h.rows, h.total) : t('held_rows', h.rows);
      bits.push(t('held_' + tag) + " " + (h.date || "?") + " \u00b7 " + n + (when ? " \u00b7 " + when : "")
                /* a capture the ingest refused is on disk and NOT in — it says so */
                + (h.why ? " \u2014 " + t('held_not') + t('why_' + h.why) : ""));
    }
    if(LIVE_ERR[tag]) bits.push(t('held_unread', t('held_' + tag), LIVE_ERR[tag]));
  }
  box.textContent = bits.length ? t('held_lead') + bits.join("   ") : t('held_none');
}
async function autoReadInhouse(){
  if(legacyOn() || !LIVE_OK){ liveStop(); return; }
  if(!window.reccheckShortcuts || !window.reccheckShortcuts.listFile) return;
  /* COLLECTED FIRST, THEN INGESTED OLDEST CAPTURE FIRST, so the NEWEST one has the last
     word on the line.

     All four are read on the same tick and each ingest writes the same #liveSay. In tag
     order that means the departure report — last in LIVE_TAGS — overwrites whatever the
     in-house read had just put there, and the files live for twenty hours, so the very
     first tick after the app starts ingests all four at once and leaves a stale departure
     line on screen. He opened the in-house list, watched the tax screen, and saw a
     departure report he had opened hours earlier: "when opening tax check there is nothing
     shown when i open the inhouse list".

     The mtime already says which capture is the news. Sorting by it costs nothing and the
     line then reports the list he just opened. */
  const got = [];
  let stChanged = false;
  for(const tag of LIVE_TAGS){
    try{
      const f = await window.reccheckShortcuts.listFile(tag)
                  .catch(e => ({why: "unread", detail: String((e && e.message) || e || "?")}));
      /* WHICH NOTHING. null is "no such file", and a file older than twenty hours is one
         the page has had — both mean the capture is gone and its summary goes with it. A
         file that is there and could not be READ is neither: what was held stays held, and
         the failure is said as a failure, not as protel having opened nothing. The held
         summary is kept for EVERY file that is there, new or not — that is the point. */
      if(!f || f.why === "old" || (!f.why && !f.text)){ delete LIVE_HELD[tag]; delete LIVE_ERR[tag]; delete LIVE_ROWS[tag]; continue; }
      if(f.why){ LIVE_ERR[tag] = f.detail || f.why; continue; }
      delete LIVE_ERR[tag];
      if(!LIVE_HELD[tag] || LIVE_HELD[tag].at !== f.at){
        LIVE_HELD[tag] = heldOf(tag, +f.at || 0, f.text);
        /* the rows themselves, parsed once per capture, never per tick — and into the
           STATUS store, which the pills and the STATUS lists read */
        try{
          LIVE_ROWS[tag] = {p: tag === "IH" ? parseInhouse(f.text) : parseTagged(f.text, tag), at: +f.at || 0};
          if(statusIngest(tag, LIVE_ROWS[tag].p, +f.at || 0)) stChanged = true;
        }catch(e){ delete LIVE_ROWS[tag]; }
      }
      if(f.at === LIVE_AT[tag]) continue;
      LIVE_AT[tag] = f.at;
      got.push({tag: tag, at: +f.at || 0, text: f.text});
    }catch(e){}
  }
  got.sort((a, b) => a.at - b.at);
  /* the pills draw from the STATUS store now, so a change to it is what redraws them */
  if(stChanged){ LEDGER_TICK++; try{ if(window.__rcMovesChanged) window.__rcMovesChanged(); }catch(e){} }
  for(const g of got){
    /* WHAT BECAME OF IT. The summary used to be drawn from the file's presence alone, so
       a capture the ingest REFUSED — cut short, wrong caption, no date — was announced as
       held: the one claim the line exists to make, and false. Each ingest answers "ok" or
       why not, and the answer rides on the entry. */
    let r = "threw";
    try{ const a = await ingestCaptured(g.tag, g.text); r = (a === undefined) ? "unknown" : String(a); }
    catch(e){ r = "threw"; }
    const h = LIVE_HELD[g.tag];
    if(h && h.at === g.at) h.why = (r === "ok") ? "" : r;
  }
  try{ paintHeld(); }catch(e){}
  if(TAX_SCREEN === "status"){ try{ window.__taStatusMenu(); }catch(e){} }
  if(TAX_SCREEN === "stlist"){ try{ renderStatusList(); }catch(e){} }
}
/* ---- STATUS: what protel has told the tool, kept for the day ----

   His specification, 05/09: "After feeding from the lists the tool will populate the
   below submenus inside STATUS: Arrivals, Departures, In-house, Moves. All lists will be
   refreshing their data each time a window in protel opens, however if a room is missing
   from the arrival list it doesnt mean that it has been cancelled, the tool must wait for
   the next time the in-house list opens so it can read it and if it finds an exact match
   of reservation name and room number to simply mark that as checked in" — and for
   departures, after his own correction: the same, "to confirm that a room has actually
   departed you will have to confirm its absence from the inhouse list as well, unless a
   filter is applied we dont see checked out reservations in the in-house list".

   So each list's rows are kept for the DAY as the UNION of every capture of it, keyed by
   name and room: a row that has left the arrival list because the guest checked in is
   still that night's arrival, and nothing is read into a row being gone. The marks are
   computed from the latest in-house capture and never stored or written anywhere else:
   an arrival is CHECKED IN when the in-house list shows the same name and room with CI; a
   departure is CHECKED OUT when a COMPLETE in-house list, captured later, does not show it
   (or shows it with CO); still on it with CI, it is STILL IN HOUSE as of that capture. A
   cut-short in-house read proves nothing about absence and says so.

   The department check's pills read this store (roomMoves) and nothing else. Nothing here
   asks protel anything: the rows are the capture files, already read every tick. */
const STATUS_KEY = "reccheck_status_v1";
const STATUS_KEEP_DAYS = 7;
let STATUS_TICK = 0;                           // bumped when the store changes
function statusLoad(){
  try{ const o = JSON.parse(localStorage.getItem(STATUS_KEY) || "{}"); return (o && typeof o === "object" && !Array.isArray(o)) ? o : {}; }
  catch(e){ return {}; }
}
function statusSave(st){ try{ localStorage.setItem(STATUS_KEY, JSON.stringify(st)); }catch(e){} }
function stName(x){ return String(x || "").trim().replace(/\s+/g, " ").toUpperCase(); }
function stRoom(x){ return String(x || "").trim(); }
function stKey(name, room){ return stName(name) + "|" + stRoom(room); }
/* an exact match of reservation name and room; "414-15" and "414" are one room */
function stSameRoom(a, b){ a = stRoom(a); b = stRoom(b); return !!a && (a === b || (leadRoom(a) && leadRoom(a) === leadRoom(b))); }
function stDayKey(k){ const y = Math.floor(k / 10000), m = Math.floor(k / 100) % 100, d = k % 100; return Date.UTC(y, m - 1, d) / 86400000; }
function statusPrune(st){
  const today = stDayKey(bnk());
  for(const tag of ["AR", "DP", "MV"]){
    const days = st[tag]; if(!days) continue;
    for(const k of Object.keys(days)) if(!/^\d{8}$/.test(k) || today - stDayKey(+k) > STATUS_KEEP_DAYS) delete days[k];
  }
}
/* A capture into the store. Returns true when something changed. */
function statusIngest(tag, p, at){
  if(!p || !p.rows) return false;
  const st = statusLoad();
  let changed = false;
  if(tag === "IH"){
    if(!isInhouseTitle(p.title)) return false;
    const date = inhouseDate(p.title), key = dkey(date);
    if(!key) return false;
    const rows = p.rows.map(r => ({name: String(r[IH.NAME] || "").trim(), room: stRoom(r[IH.ROOM]), arr: String(r[IH.ARR] || "").trim(),
                                   dep: String(r[IH.DEP] || "").trim(), status: String(r[IH.STATUS] || "").trim()}))
                       .filter(r => r.name || r.room);
    const cut = !!(p.done && p.done.cut);
    const cap = {at: at, date: date, key: key, cut: cut, rows: rows};
    if(!st.IH || st.IH.at !== at){ st.IH = cap; changed = true; }
    /* absence is argued from a COMPLETE list only, so the last complete one is kept apart */
    if(!cut && (!st.IHC || st.IHC.at !== at)){ st.IHC = cap; changed = true; }
  }else{
    const date = inhouseDate(p.title), key = dkey(date);
    if(!key) return false;
    const days = st[tag] = st[tag] || {};
    const day = days[String(key)] = days[String(key)] || {title: p.title, date: date, at: 0, rows: {}};
    if(day.at !== at){ day.at = at; day.title = p.title; day.cut = !!(p.done && p.done.cut); changed = true; }
    for(const c of p.rows){
      let row;
      if(tag === "AR") row = {name: String(c[AR.NAME] || "").trim(), room: stRoom(c[AR.ROOM]), dep: String(c[AR.DEP] || "").trim(), status: String(c[AR.STATUS] || "").trim()};
      else if(tag === "DP") row = {name: String(c[DP.NAME] || "").trim(), room: stRoom(c[DP.ROOM]), arr: String(c[DP.ARR] || "").trim(), status: String(c[DP.STATUS] || "").trim()};
      else row = {from: stRoom(c[MV.FROM]), to: stRoom(c[MV.TO]), name: String(c[MV.NAME] || "").trim(), x: String(c[MV.X] || "").trim(),
                  arr: String(c[MV.ARR] || "").trim(), dep: String(c[MV.DEP] || "").trim()};
      /* a half-read row is not a reservation: both a name and a room, or it is not kept */
      if(tag === "MV"){ if(!row.name || !row.from || !row.to) continue; }
      else if(!row.name || !row.room) continue;
      const k = tag === "MV" ? row.from + "|" + row.to + "|" + stName(row.name) + "|" + row.arr : stKey(row.name, row.room);
      const had = day.rows[k];
      if(!had){ row.first = at; row.last = at; day.rows[k] = row; changed = true; }
      else{ had.last = at; for(const f of Object.keys(row)) if(row[f] !== undefined && had[f] !== row[f]){ had[f] = row[f]; changed = true; } }
    }
  }
  if(changed){ statusPrune(st); statusSave(st); STATUS_TICK++; }
  return changed;
}
/* the in-house row matching a reservation exactly, or null */
function ihFind(cap, name, room){
  if(!cap || !cap.rows) return null;
  const n = stName(name);
  for(const r of cap.rows) if(stName(r.name) === n && stSameRoom(r.room, room)) return r;
  return null;
}
/* {cls, text} for an arrival or departure row, from the latest in-house captures.
   dayKey is the day the list is for. An in-house list dated BEFORE that day says nothing
   about a departure on it: a guest who arrived after that capture and departs today is
   absent from it without ever having left, and a stale complete census — every later read
   cut short — would call them checked out. So for departures only a census dated the
   departure's day or later counts, and the time it prints is one from that day. */
function statusMark(st, tag, row, dayKey){
  const fresh = c => (c && (!dayKey || (c.key || 0) >= dayKey)) ? c : null;
  if(tag === "AR"){
    const ih = st.IH;
    const m = ihFind(ih, row.name, row.room);
    if(m && /^C[IO]\b/i.test(m.status)) return {cls: "mIn", text: t('st_markIn', hhmm(ih.at) || "?")};
    return {cls: "mNone", text: t('st_markExpected')};
  }
  if(tag === "DP"){
    const ih = fresh(st.IH), ihc = fresh(st.IHC);
    const m = ihFind(ih, row.name, row.room);
    if(m && /^CO\b/i.test(m.status)) return {cls: "mOut", text: t('st_markOutCO', hhmm(ih.at) || "?")};
    if(m) return {cls: "mStay", text: t('st_markStay', hhmm(ih.at) || "?")};
    if(ihc && !ihFind(ihc, row.name, row.room)) return {cls: "mOut", text: t('st_markOut', hhmm(ihc.at) || "?")};
    if(ih && ih.cut) return {cls: "mNone", text: t('st_markCut', hhmm(ih.at) || "?")};
    return {cls: "mNone", text: t('st_markNoIH')};
  }
  return null;
}
function stEsc(x){ return escHtml(String(x == null ? "" : x)); }
/* the day a list is shown for: the latest capture's date, else the census's night */
function statusDay(st, tag){
  const held = LIVE_HELD[tag];
  const k = held && held.date ? dkey(held.date) : 0;
  if(k && st[tag] && st[tag][String(k)]) return k;
  const days = st[tag] ? Object.keys(st[tag]).map(Number).filter(Boolean).sort((a, b) => b - a) : [];
  return days.length ? days[0] : 0;
}
/* one line per list for the STATUS menu */
function statusSub(st, tag){
  if(legacyOn()) return t('st_legacyShort');
  if(tag === "IH"){
    const c = st.IH;
    if(!c) return t('st_none');
    return (c.date || "?") + " \u00b7 " + t('held_rows', c.rows.length) + (c.cut ? " \u00b7 " + t('st_cutShort') : "") + (hhmm(c.at) ? " \u00b7 " + t('st_takenAt', hhmm(c.at)) : "");
  }
  const k = statusDay(st, tag);
  const day = k && st[tag] ? st[tag][String(k)] : null;
  if(!day) return t('st_none');
  const rows = Object.keys(day.rows || {}).length;
  return (day.date || dfmt(k)) + " \u00b7 " + t('held_rows', rows) + (hhmm(day.at) ? " \u00b7 " + t('st_takenAt', hhmm(day.at)) : "");
}
window.__taStatusMenu = function(){
  try{
    const st = statusLoad();
    const ids = {AR: "stArr", DP: "stDep", IH: "stInh", MV: "stMov"};
    for(const tag of Object.keys(ids)){
      const b = el(ids[tag]); if(!b) continue;
      const sub = b.querySelector(".mSub"); if(sub) sub.textContent = statusSub(st, tag);
    }
  }catch(e){}
};
let ST_TAG_T = "";
let STATUS_SIG = "";
window.__taStatus = function(tag){ ST_TAG_T = String(tag || ""); STATUS_SIG = ""; try{ renderStatusList(); }catch(e){} };
function statusCols(tag){
  if(tag === "IH") return [["st_room", r => r.room], ["st_name", r => r.name], ["st_arr", r => r.arr], ["st_dep", r => r.dep], ["st_status", r => r.status]];
  if(tag === "AR") return [["st_room", r => r.room], ["st_name", r => r.name], ["st_dep", r => r.dep], ["st_status", r => r.status]];
  if(tag === "DP") return [["st_room", r => r.room], ["st_name", r => r.name], ["st_arr", r => r.arr], ["st_status", r => r.status]];
  return [["st_from", r => r.from], ["st_to", r => r.to], ["st_name", r => r.name], ["st_x", r => r.x], ["st_arr", r => r.arr], ["st_dep", r => r.dep]];
}
function renderStatusList(){
  const box = el('stList');
  if(!box || !ST_TAG_T) return;
